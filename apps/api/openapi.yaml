              properties:
                workspace_id: { type: string, description: Compatibility field; must match the authenticated workspace when supplied. }
                facts: { type: object, minProperties: 1, additionalProperties: true }
                reason: { type: string, minLength: 1 }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/assets/upload:
    post:
      tags: [Catalog]
      operationId: uploadAsset
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: X-Asset-Name, in: header, required: true, schema: { type: string } }
        - { name: X-Asset-SHA256, in: header, required: false, schema: { type: string, pattern: '^[a-fA-F0-9]{64}$' } }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
          text/plain: { schema: { type: string, format: binary } }
      responses:
        '201': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '413': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/assets/{assetId}/scan:
    post:
      tags: [Catalog]
      operationId: promoteScannedAsset
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: assetId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [scan_evidence_ref], additionalProperties: false, properties: { scan_evidence_ref: { type: string } } } } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/assets/{assetId}/parse:
    post:
      tags: [Assets]
      operationId: parseAsset
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: assetId, in: path, required: true, schema: { type: string } }
      description: Parses a clean JSON/CSV/TXT/Markdown/PDF text/DOCX/XLSX asset into auditable facts. Scanned PDFs, image OCR and unsupported formats return a visible failed parse state.
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/assets/{assetId}/download:
    get:
      tags: [Catalog]
      operationId: downloadAsset
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: assetId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Clean binary asset }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
  /healthz:
    get:
      tags: [Runtime]
      operationId: workspaceHealth
      security: []
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
  /metrics:
    get:
      tags: [Runtime]
      summary: Prometheus metrics endpoint for internal scraping
      responses:
        '200': { description: Prometheus text exposition, content: { text/plain: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/platform-accounts:
    get:
      tags: [OAuth]
      operationId: listPlatformAccounts
      description: Returns the merchant-safe store directory with last-known, non-secret OAuth metadata and per-store sync timestamps. Access-token expiry is not the merchant authorization expiry; missing provider metadata remains unknown. Credential references and tokens are never returned.
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
  /v1/platform-accounts/{platform}/manual-record:
    post:
      tags: [OAuth]
      operationId: registerManualPlatformAccount
      description: Registers a credential-free manual store record in the authenticated workspace. This operation is available only when manual store registration is enabled and never accepts credentials or a workspace override.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: platform, in: path, required: true, schema: { $ref: '#/components/schemas/Platform' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, store_name]
              additionalProperties: false
              properties:
                account_id: { type: string, minLength: 1, maxLength: 256, description: Trimmed non-empty account identifier; control characters are rejected. }
                store_name: { type: string, minLength: 1, maxLength: 40, description: Trimmed visible store name; control and Unicode format characters are rejected. }
      responses:
        '201': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/platform-accounts/{platform}/authorize:
    post:
      tags: [OAuth]
      operationId: authorizePlatform
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: platform, in: path, required: true, schema: { $ref: '#/components/schemas/Platform' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AuthorizeRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '413': { $ref: '#/components/responses/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/platform-accounts/{platform}:
    delete:
      tags: [OAuth]
      operationId: revokePlatformAccount
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: platform, in: path, required: true, schema: { $ref: '#/components/schemas/Platform' } }
        - { name: X-Account-Id, in: header, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/platform-accounts/{platform}/sync:
    post:
      tags: [Catalog]
      operationId: syncPlatformProducts
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: platform, in: path, required: true, schema: { $ref: '#/components/schemas/Platform' } }
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, additionalProperties: false, properties: { account_id: { type: string }, cursor: { type: string, description: Cursor returned by the previous page. } } } } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/sync-jobs:
    get:
      tags: [Catalog]
      operationId: listSyncJobs
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' }]
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
    post:
      tags: [Catalog]
      operationId: createSyncJob
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [platform]
              properties:
                platform: { $ref: '#/components/schemas/Platform' }
                account_id: { type: string }
                mode: { type: string, enum: [full, incremental] }
                cursor: { type: string }
      responses:
        '202': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/sync-jobs/{jobId}:
    get:
      tags: [Catalog]
      operationId: getSyncJob
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/sync-jobs/{jobId}/progress:
    post:
      summary: Internal worker progress callback
      description: Worker-only endpoint; records one idempotent sync page.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: jobId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [page_number, items], properties: { page_number: { type: integer, minimum: 1 }, next_cursor: { type: string }, items: { type: array, items: { type: object, additionalProperties: true } } } } } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/sync-jobs/{jobId}/execution-context:
    get:
      summary: Internal worker credential-location gate
      description: Worker-token protected endpoint that revalidates the store account and returns an opaque credential locator in memory. It is never exposed through MCP or persisted in the outbox.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/sync-jobs/{jobId}/result:
    post:
      summary: Internal worker sync result callback
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: jobId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [state], properties: { state: { type: string, enum: [succeeded, partial, failed] }, error_message: { type: string } } } } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/sync-jobs/{jobId}/retry-failed:
    post:
      summary: Retry selected retryable sync failures by replaying their source page cursor
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: jobId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, additionalProperties: false, properties: { failure_ids: { type: array, items: { type: string } } } } } }
      responses:
        '202': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/oauth/callback/{platform}:
    get:
      tags: [OAuth]
      operationId: oauthCallback
      security: []
      parameters:
        - { name: platform, in: path, required: true, schema: { $ref: '#/components/schemas/Platform' } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, required: false, description: OAuth authorization code. Required when the provider did not return an error; the server returns OAUTH_CODE_REQUIRED when it is absent without an error response., schema: { type: string } }
        - { name: error, in: query, required: false, description: Standard OAuth provider error code. When present, the callback is rejected and no platform account is created., schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: error_description, in: query, required: false, description: Provider-supplied error description. It is treated as untrusted display context and never authorizes the callback., schema: { type: string, maxLength: 2000 } }
        - { name: error_uri, in: query, required: false, description: Provider documentation URI, if supplied., schema: { type: string, format: uri, maxLength: 2000 } }
      description: |
        Browser redirect callback for the platform OAuth flow. This route does
        not accept Bearer or X-Workspace-Id authentication; the one-time state
        value and PKCE verifier issued by the authenticated authorize request
        are the authentication and workspace-binding boundary.
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/products:
    get:
      tags: [Catalog]
      operationId: catalogSearch
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: workspace_id, in: query, description: Optional local compatibility value; must equal server scope, schema: { type: string } }
        - { name: query, in: query, required: false, schema: { type: string } }
        - { name: platform, in: query, required: false, schema: { $ref: '#/components/schemas/Platform' } }
        - { name: account_id, in: query, required: false, schema: { type: string } }
        - { name: store_name, in: query, required: false, schema: { type: string } }
        - { name: facts_confirmed, in: query, required: false, schema: { type: boolean } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/products/{productId}/image-review:
    get:
      tags: [Catalog]
      operationId: reviewProductImages
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: productId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/products/import/batch:
    post:
      tags: [Catalog]
      summary: Import up to 50 products across explicitly selected stores; use idempotency to replay safely
      operationId: importProductsBatch
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, minLength: 8, maxLength: 200, pattern: '^[A-Za-z0-9._:-]+$' }
          description: Optional replay key. Same key and normalized payload replays the original result; a different payload returns 409. Without a key, retries are not deduplicated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [products]
              properties:
                idempotency_key: { type: string, minLength: 8, maxLength: 200, pattern: '^[A-Za-z0-9._:-]+$' }
                products:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: true
                    required: [platform, title]
                    properties:
                      platform: { $ref: '#/components/schemas/Platform' }
                      account_id: { type: string, description: Explicit authorized store account. Required in production. }
                      remote_id: { type: string }
                      local_product_key: { type: string }
                      title: { type: string, minLength: 1 }
                      sku_count: { type: integer, minimum: 0 }
                      stock: { type: integer, minimum: 0 }
                      price: { type: number, minimum: 0 }
                      category: { type: string }
                      images: { type: array, items: { type: string } }
                      skus: { type: array, items: { type: object } }
                      attributes: { type: object, additionalProperties: { type: string } }
                      selling_points: { type: array, maxItems: 3, items: { type: object } }
                      store_name: { type: string }
                      store_differentiation: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Envelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/products/import:
    post:
      tags: [Catalog]
      summary: Import a confirmed local product or bind an existing platform product
      operationId: importProduct
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [platform, title]
              properties:
                platform: { $ref: '#/components/schemas/Platform' }
                remote_id: { type: string, description: Existing platform product ID; omit for a local product to be created after confirmation. }
                local_product_key: { type: string, description: Stable caller-provided key for an unbound local product. }
                title: { type: string, minLength: 1 }
                sku_count: { type: integer, minimum: 0 }
                stock: { type: integer, minimum: 0 }
                price: { type: number, minimum: 0 }
                category: { type: string }
                images: { type: array, items: { type: string } }
                attributes: { type: object, additionalProperties: { type: string } }
                selling_points:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    additionalProperties: false
                    required: [text, proof_status, source_ids]
                    properties:
                      id: { type: string }
                      text: { type: string, minLength: 1 }
                      proof_status: { type: string, enum: [pending, confirmed, rejected] }
                      source_ids: { type: array, minItems: 1, items: { type: string } }
                store_name: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/tasks:
    get:
      tags: [Tasks]
      operationId: searchTasks
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: workspace_id, in: query, required: false, schema: { type: string } }
        - { name: query, in: query, required: false, schema: { type: string } }
        - { name: platform, in: query, required: false, schema: { $ref: '#/components/schemas/Platform' } }
        - { name: state, in: query, required: false, schema: { type: string, enum: [draft, resolving_context, blocked_missing_facts, blocked_conflict, ready_for_direction, direction_selected, plan_confirmed, generating, review_required, changes_requested, approved, publish_prepared, publishing, delivered, canceled, failed_recoverable, failed_terminal] } }
        - { name: product_id, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
