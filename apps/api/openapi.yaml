    CommercialAccessErrorDetails:
      type: object
      required: [request_id, trace_id, balance_state, available_points, quoted_points, access_revision, rate_card_version, next_actions]
      properties:
        request_id: { type: string }
        trace_id: { type: string }
        balance_state: { type: string, enum: [known, unknown] }
        available_points: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }], description: Unknown is null and is never projected as zero. }
        quoted_points: { oneOf: [{ type: integer, minimum: 1 }, { type: 'null' }] }
        access_revision: { oneOf: [{ type: string }, { type: 'null' }] }
        rate_card_version: { oneOf: [{ type: string }, { type: 'null' }] }
        next_actions: { type: array, items: { type: string } }
        classification: { type: string, enum: [RECOVERY_CONTROL, POINT_REQUIRED_NO_CHARGE, POINT_CHARGED] }
        registry_version: { type: string }
        retryable: { type: boolean }
      additionalProperties: true
    WorkerCommercialRecheck:
      type: object
      required: [recheck_id, workspace_id, operation, access_mode, access_revision, balance_state, entitlement_snapshot_id, entitlement_snapshot_checksum, rate_version, quoted_points, reservation_state, allowed, ready, checked_at]
      properties:
        recheck_id: { type: string }
        workspace_id: { type: string }
        operation: { type: string, enum: [publish.execute, publish.reconcile, generation.execute, image_generation.execute, catalog.sync.execute, asset.scan.execute, asset.continuation.execute] }
        access_mode: { type: string, enum: [POINT_CHARGED, POINT_REQUIRED_NO_CHARGE] }
        access_revision: { type: string }
        balance_state: { type: string, enum: [known] }
        entitlement_snapshot_id: { type: string, description: Server-derived creative-point access fact identifier; legacy subscription/task quota snapshots are not accepted. }
        entitlement_snapshot_checksum: { type: string, pattern: '^[a-f0-9]{64}$' }
        rate_version: { oneOf: [{ type: string }, { type: 'null' }] }
        quoted_points: { type: integer, minimum: 0 }
        reservation_id: { type: string }
        reservation_state: { type: string, enum: [active, not_required, consumed, released, expired] }
        allowed: { type: boolean }
        ready: { type: boolean }
        denial_code:
          type: string
          enum: [COMMERCIAL_EXECUTION_BALANCE_BLOCKED, COMMERCIAL_EXECUTION_ENTITLEMENT_STALE, COMMERCIAL_EXECUTION_RATE_STALE, COMMERCIAL_EXECUTION_RESERVATION_INVALID, COMMERCIAL_EXECUTION_REVISION_STALE]
        checked_at: { type: string, format: date-time }
      additionalProperties: false
    WorkerExecutionCheckEnvelope:
      allOf:
        - { $ref: '#/components/schemas/ApiEnvelope' }
        - type: object
          properties:
            data:
              type: object
              required: [authorization_recheck, commercial_access_recheck]
              not: { required: [delivery_scan_recheck] }
              properties:
                authorization_recheck: { type: object, additionalProperties: true }
                commercial_access_recheck: { $ref: '#/components/schemas/WorkerCommercialRecheck' }
    WorkerCommercialOnlyExecutionCheckEnvelope:
      allOf:
        - { $ref: '#/components/schemas/ApiEnvelope' }
        - type: object
          properties:
            data:
              type: object
              required: [commercial_access_recheck]
              not:
                anyOf:
                  - { required: [authorization_recheck] }
                  - { required: [delivery_scan_recheck] }
              properties:
                commercial_access_recheck: { $ref: '#/components/schemas/WorkerCommercialRecheck' }
    DeliveryScanRecheck:
      type: object
      required: [schema_version, operation, decision_id, actor_id, identity_id, workbench, context_id, capability, authorized, workspace_id, delivery_id, purpose, asset_id, asset_revision, source_revision, storage_key, sha256, size_bytes, mime_type, request_id, trace_id, admitted_at, recheck_id, event_id, allowed, ready, checked_at]
      properties:
        schema_version: { type: integer, enum: [1] }
        operation: { type: string, enum: [customer_delivery.asset.scan.execute] }
        decision_id: { type: string, minLength: 1 }
        actor_id: { type: string, minLength: 1 }
        identity_id: { type: string, minLength: 1 }
        workbench: { type: string, enum: [platform] }
        context_id: { type: string, enum: ['platform:global'] }
        capability: { type: string, enum: [customer.delivery.update] }
        authorized: { type: boolean, enum: [true] }
        workspace_id: { type: string, minLength: 1 }
        delivery_id: { type: string, minLength: 1 }
        purpose: { type: string, enum: [contract, payment, system_integration, functional_acceptance, training, video] }
        asset_id: { type: string, minLength: 1 }
        asset_revision: { type: integer, minimum: 1 }
        source_revision: { type: integer, minimum: 1 }
        storage_key: { type: string, minLength: 1 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        size_bytes: { type: integer, minimum: 1, maximum: 52428800 }
        mime_type: { type: string, minLength: 1 }
        request_id: { type: string, minLength: 1 }
        trace_id: { type: string, minLength: 1 }
        admitted_at: { type: string, format: date-time }
        recheck_id: { type: string, minLength: 1 }
        event_id: { type: string, minLength: 1 }
        allowed: { type: boolean, enum: [true] }
        ready: { type: boolean, enum: [true] }
        checked_at: { type: string, format: date-time }
      additionalProperties: false
    WorkerDeliveryScanExecutionCheckEnvelope:
      allOf:
        - { $ref: '#/components/schemas/ApiEnvelope' }
        - type: object
          properties:
            data:
              type: object
              required: [delivery_scan_recheck]
              not:
                anyOf:
                  - { required: [authorization_recheck] }
                  - { required: [commercial_access_recheck] }
              properties:
                delivery_scan_recheck: { $ref: '#/components/schemas/DeliveryScanRecheck' }
    WorkerEventExecutionCheckEnvelope:
      oneOf:
        - { $ref: '#/components/schemas/WorkerExecutionCheckEnvelope' }
        - { $ref: '#/components/schemas/WorkerCommercialOnlyExecutionCheckEnvelope' }
        - { $ref: '#/components/schemas/WorkerDeliveryScanExecutionCheckEnvelope' }
    ApiWarning:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean, description: Explicit machine-readable retry decision. Clients must not infer that every error is retryable. }
        details:
          type: object
          description: Structured diagnostics; may include retry_after_seconds and next_actions. Clients should preserve this object for support diagnostics.
          additionalProperties: true
    ApiNextAction:
      description: A human-readable recovery step or a structured action descriptor. Both forms are emitted by implemented API surfaces.
      oneOf:
        - { type: string }
        - { type: object, additionalProperties: true }
    ApiEnvelope:
      type: object
      required: [request_id, trace_id, workspace_id, data, warnings, next_actions, error]
      properties:
        request_id: { type: string }
        trace_id: { type: string }
        workspace_id: { type: string }
        data: {}
        warnings: { type: array, items: { $ref: '#/components/schemas/ApiWarning' } }
        next_actions: { type: array, items: { $ref: '#/components/schemas/ApiNextAction' } }
        error: { oneOf: [{ $ref: '#/components/schemas/ApiError' }, { type: 'null' }] }
  responses:
    Envelope:
      description: Successful response using ApiEnvelope.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiEnvelope' } } }
    ErrorEnvelope:
      description: Failed response using the same ApiEnvelope shape; data is null. Correlation IDs, warnings, next_actions, error details, and retry guidance are diagnostic contract fields and must be preserved by clients.
      headers:
        Retry-After:
          description: Optional delay in seconds (or HTTP date) before a retry. The same value may be present as error.details.retry_after_seconds.
          schema: { oneOf: [{ type: integer, minimum: 0 }, { type: string }] }
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiEnvelope' } } }
    CommercialAccessErrorEnvelope:
      description: Fail-closed commercial access response. Unknown balances remain null; clients may only offer server-authorized recovery actions.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ApiEnvelope' }
              - type: object
                properties:
                  error:
                    type: object
                    required: [code, message, details]
                    properties:
                      code: { type: string, enum: [CREATIVE_POINTS_EXHAUSTED, CREATIVE_POINTS_INSUFFICIENT, CREATIVE_POINTS_UNAVAILABLE, RATE_CARD_UNAVAILABLE, COMMERCIAL_ACCESS_STALE, COMMERCIAL_OPERATION_DISABLED, COMMERCIAL_OPERATION_UNCLASSIFIED] }
                      message: { type: string }
                      retryable: { type: boolean }
                      details: { $ref: '#/components/schemas/CommercialAccessErrorDetails' }
