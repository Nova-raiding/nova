        Allowlist: workspace.bootstrap, workspace.health, workspace.interactive.confirm, workspace.metrics, workspace.deactivate, workspace.activate, workspace.data.delete.request, platform.connect, platform.store.alias.set, catalog.search, catalog.categories, catalog.title.optimize, catalog.title.accept, catalog.import, catalog.facts.confirm, catalog.product.disable, catalog.product.enable, catalog.image.generate, catalog.image.get, catalog.image.review,
