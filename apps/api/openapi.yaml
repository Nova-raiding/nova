  /v1/public/assets/{assetId}/display:
    get:
      tags: [Assets]
      operationId: displaySignedAsset
      description: Returns image bytes only for an asset addressed by a short-lived HMAC-signed URL. This endpoint does not accept bearer authentication; signature fields are bound to the path, workspace, asset, expiry, and content hash. New URLs include v=1 and kid; legacy signed URLs may omit both, but they must be supplied together when present.
      security: []
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 256 } }
        - { name: v, in: query, required: false, schema: { type: string, enum: ['1'] } }
        - { name: kid, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' } }
        - { name: workspace_id, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: expires, in: query, required: true, description: Unix timestamp seconds; URL lifetime is at most 300 seconds., schema: { type: integer, minimum: 1 } }
        - { name: sha256, in: query, required: true, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
        - { name: signature, in: query, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '200':
          description: Verified image bytes.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '410': { $ref: '#/components/responses/ErrorEnvelope' }
        '415': { $ref: '#/components/responses/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/ErrorEnvelope' }
