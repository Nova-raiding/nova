    post:
      tags: [Rules]
      operationId: createRuleVersion
      description: |
        Creates an immutable draft or directly approved active version and appends its audit event.
        Requires rules_admin. Active versions additionally require two-person approval; in production
        X-Rule-Approval-Token must identify the approved_by actor for this workspace.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: packId, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' } }
