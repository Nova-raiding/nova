openapi: 3.0.3
info:
  title: Merchant Marketing MCP/API
  version: 0.1.0
  description: |
    Codex merchant marketing API. Every response, including errors and MCP
    results, is an ApiEnvelope. Production merchant requests must carry a
    Bearer token authorized for the selected X-Workspace-Id; local
    non-production requests retain the ws_demo fallback. External
    platform writes are disabled by default and remain confirmation-gated.
servers:
  - url: http://127.0.0.1:8787
tags:
  - name: Runtime
  - name: Rules
  - name: Catalog
  - name: Tasks
  - name: Versioning
  - name: OAuth
  - name: MCP
paths:
  /v1/platform-capabilities:
    get:
      summary: Read the six-platform capability evidence matrix
      parameters:
        - in: header
          name: X-Workspace-Id
          required: true
          schema: { type: string }
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
      responses:
        '200': { description: Capability matrix }
        '401': { description: Unauthenticated }
        '403': { description: Workspace forbidden }
  /v1/rules:
    get:
      tags: [Rules]
      operationId: listRulePacks
      description: Production reads are served from the tenant-scoped PostgreSQL rule repository. Fixture mode may use seeded rules when no repository is configured.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: pack_id, in: query, required: false, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/rules/audit:
    get:
      tags: [Rules]
      operationId: listRuleAudit
      description: Reads append-only lifecycle audit events. Requires the rules_admin role from the server-side token grant.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: pack_id, in: query, required: false, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/rules/{packId}/versions:
    post:
      tags: [Rules]
      operationId: createRuleVersion
      description: |
        Creates an immutable draft or directly approved active version and appends its audit event.
        Requires rules_admin. Active versions additionally require two-person approval; in production
        X-Rule-Approval-Token must identify the approved_by actor for this workspace.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: packId, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' } }
        - { name: X-Rule-Approval-Token, in: header, required: false, description: Required when status is active in production., schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRuleVersionRequest' }
      responses:
        '201': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/rules/{packId}/versions/{version}/status:
    post:
      tags: [Rules]
      operationId: setRuleVersionStatus
      description: |
        Changes a persisted version to active, inactive, or expired and appends an audit event.
        Activation requires two-person approval. If another version is active, it must first be
        explicitly deactivated; the API never performs a non-atomic implicit replacement.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: packId, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { name: X-Rule-Approval-Token, in: header, required: false, description: Required when status is active in production., schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetRuleVersionStatusRequest' }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/brand-profile:
    get:
      tags: [Catalog]
      operationId: getBrandProfile
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      responses: { '200': { $ref: '#/components/responses/Envelope' } }
    put:
      tags: [Catalog]
      operationId: upsertBrandProfile
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], additionalProperties: false, properties: { name: { type: string }, positioning: { type: string }, audience: { type: string }, tone: { type: array, items: { type: string } }, forbidden_terms: { type: array, items: { type: string } }, details: { type: object, additionalProperties: true }, visual_rules: { $ref: '#/components/schemas/BrandVisualRules' }, source: { type: string }, conflict_resolutions: { type: object, additionalProperties: { type: string, enum: [existing, candidate] } } } } } }
      responses: { '200': { $ref: '#/components/responses/Envelope' }, '400': { $ref: '#/components/responses/ErrorEnvelope' } }
  /v1/brand-profile/extract:
    post:
      tags: [Catalog]
      operationId: extractBrandProfile
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, properties: { asset_ids: { type: array, minItems: 1, maxItems: 50, items: { type: string } } } } } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/assets:
    get:
      tags: [Catalog]
      operationId: listAssets
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      responses: { '200': { $ref: '#/components/responses/Envelope' } }
    post:
      tags: [Catalog]
      operationId: registerAssetMetadata
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name, mime_type, size_bytes, sha256, storage_key], additionalProperties: false, properties: { name: { type: string }, mime_type: { type: string }, size_bytes: { type: integer, minimum: 0 }, sha256: { type: string }, storage_key: { type: string }, rights_status: { type: string, enum: [pending, approved, rejected] } } } } }
      responses: { '201': { $ref: '#/components/responses/Envelope' }, '400': { $ref: '#/components/responses/ErrorEnvelope' } }
  /v1/assets/{assetId}/preference:
    put:
      tags: [Catalog]
      operationId: updateAssetPreference
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: assetId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict]
              additionalProperties: false
              properties:
                verdict: { type: string, enum: [excellent, disliked, unrated] }
                reasons: { type: array, minItems: 1, maxItems: 5, items: { type: string, maxLength: 100 } }
                note: { type: string, maxLength: 500 }
                expected_revision: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/assets/upload:
    post:
      tags: [Catalog]
      operationId: uploadAsset
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: X-Asset-Name, in: header, required: true, schema: { type: string } }
        - { name: X-Asset-SHA256, in: header, required: false, schema: { type: string, pattern: '^[a-fA-F0-9]{64}$' } }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
          text/plain: { schema: { type: string, format: binary } }
      responses:
        '201': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '413': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/assets/{assetId}/scan:
    post:
      tags: [Catalog]
      operationId: promoteScannedAsset
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: assetId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [scan_evidence_ref], additionalProperties: false, properties: { scan_evidence_ref: { type: string } } } } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/assets/{assetId}/parse:
    post:
      tags: [Assets]
      operationId: parseAsset
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: assetId, in: path, required: true, schema: { type: string } }
      description: Parses a clean JSON/CSV/TXT/Markdown/PDF text/DOCX/XLSX asset into auditable facts. Scanned PDFs, image OCR and unsupported formats return a visible failed parse state.
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/assets/{assetId}/download:
    get:
      tags: [Catalog]
      operationId: downloadAsset
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: assetId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Clean binary asset }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
  /healthz:
    get:
      tags: [Runtime]
      operationId: workspaceHealth
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
  /metrics:
    get:
      tags: [Runtime]
      summary: Prometheus metrics endpoint for internal scraping
      responses:
        '200': { description: Prometheus text exposition, content: { text/plain: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/platform-accounts:
    get:
      tags: [OAuth]
      operationId: listPlatformAccounts
      description: Returns the merchant-safe store directory with last-known, non-secret OAuth metadata and per-store sync timestamps. Access-token expiry is not the merchant authorization expiry; missing provider metadata remains unknown. Credential references and tokens are never returned.
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
  /v1/platform-accounts/{platform}/authorize:
    post:
      tags: [OAuth]
      operationId: authorizePlatform
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: platform, in: path, required: true, schema: { $ref: '#/components/schemas/Platform' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AuthorizeRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '413': { $ref: '#/components/responses/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/platform-accounts/{platform}:
    delete:
      tags: [OAuth]
      operationId: revokePlatformAccount
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: platform, in: path, required: true, schema: { $ref: '#/components/schemas/Platform' } }
        - { name: X-Account-Id, in: header, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/platform-accounts/{platform}/sync:
    post:
      tags: [Catalog]
      operationId: syncPlatformProducts
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: platform, in: path, required: true, schema: { $ref: '#/components/schemas/Platform' } }
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, additionalProperties: false, properties: { account_id: { type: string }, cursor: { type: string, description: Cursor returned by the previous page. } } } } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/sync-jobs:
    get:
      tags: [Catalog]
      operationId: listSyncJobs
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
    post:
      tags: [Catalog]
      operationId: createSyncJob
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [platform]
              properties:
                platform: { $ref: '#/components/schemas/Platform' }
                account_id: { type: string }
                mode: { type: string, enum: [full, incremental] }
                cursor: { type: string }
      responses:
        '202': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/sync-jobs/{jobId}:
    get:
      tags: [Catalog]
      operationId: getSyncJob
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/sync-jobs/{jobId}/progress:
    post:
      summary: Internal worker progress callback
      description: Worker-only endpoint; records one idempotent sync page.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: jobId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [page_number, items], properties: { page_number: { type: integer, minimum: 1 }, next_cursor: { type: string }, items: { type: array, items: { type: object, additionalProperties: true } } } } } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/sync-jobs/{jobId}/execution-context:
    get:
      summary: Internal worker credential-location gate
      description: Worker-token protected endpoint that revalidates the store account and returns an opaque credential locator in memory. It is never exposed through MCP or persisted in the outbox.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/sync-jobs/{jobId}/result:
    post:
      summary: Internal worker sync result callback
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: jobId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [state], properties: { state: { type: string, enum: [succeeded, partial, failed] }, error_message: { type: string } } } } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/sync-jobs/{jobId}/retry-failed:
    post:
      summary: Retry selected retryable sync failures by replaying their source page cursor
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: jobId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, additionalProperties: false, properties: { failure_ids: { type: array, items: { type: string } } } } } }
      responses:
        '202': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/oauth/callback/{platform}:
    get:
      tags: [OAuth]
      operationId: oauthCallback
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: platform, in: path, required: true, schema: { $ref: '#/components/schemas/Platform' } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/products:
    get:
      tags: [Catalog]
      operationId: catalogSearch
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: workspace_id, in: query, description: Optional local compatibility value; must equal server scope, schema: { type: string } }
        - { name: query, in: query, required: false, schema: { type: string } }
        - { name: platform, in: query, required: false, schema: { $ref: '#/components/schemas/Platform' } }
        - { name: account_id, in: query, required: false, schema: { type: string } }
        - { name: store_name, in: query, required: false, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/products/{productId}/image-review:
    get:
      tags: [Catalog]
      operationId: reviewProductImages
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: productId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/products/import/batch:
    post:
      tags: [Catalog]
      summary: Atomically import up to 50 products across explicitly selected stores
      operationId: importProductsBatch
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [products]
              properties:
                products:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: true
                    required: [platform, title]
                    properties:
                      platform: { $ref: '#/components/schemas/Platform' }
                      account_id: { type: string, description: Explicit authorized store account. Required in production. }
                      remote_id: { type: string }
                      local_product_key: { type: string }
                      title: { type: string, minLength: 1 }
                      sku_count: { type: integer, minimum: 0 }
                      stock: { type: integer, minimum: 0 }
                      price: { type: number, minimum: 0 }
                      category: { type: string }
                      images: { type: array, items: { type: string } }
                      skus: { type: array, items: { type: object } }
                      attributes: { type: object, additionalProperties: { type: string } }
                      selling_points: { type: array, maxItems: 3, items: { type: object } }
                      store_name: { type: string }
                      store_differentiation: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/products/import:
    post:
      tags: [Catalog]
      summary: Import a confirmed local product or bind an existing platform product
      operationId: importProduct
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [platform, title]
              properties:
                platform: { $ref: '#/components/schemas/Platform' }
                remote_id: { type: string, description: Existing platform product ID; omit for a local product to be created after confirmation. }
                local_product_key: { type: string, description: Stable caller-provided key for an unbound local product. }
                title: { type: string, minLength: 1 }
                sku_count: { type: integer, minimum: 0 }
                stock: { type: integer, minimum: 0 }
                price: { type: number, minimum: 0 }
                category: { type: string }
                images: { type: array, items: { type: string } }
                attributes: { type: object, additionalProperties: { type: string } }
                selling_points:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    additionalProperties: false
                    required: [text, proof_status, source_ids]
                    properties:
                      id: { type: string }
                      text: { type: string, minLength: 1 }
                      proof_status: { type: string, enum: [pending, confirmed, rejected] }
                      source_ids: { type: array, minItems: 1, items: { type: string } }
                store_name: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/tasks:
    get:
      tags: [Tasks]
      operationId: searchTasks
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: workspace_id, in: query, required: false, schema: { type: string } }
        - { name: query, in: query, required: false, schema: { type: string } }
        - { name: platform, in: query, required: false, schema: { $ref: '#/components/schemas/Platform' } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: product_id, in: query, required: false, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
    post:
      tags: [Tasks]
      operationId: createTask
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTaskRequest' } } }
      responses:
        '201': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/task-groups:
    post:
      tags: [Tasks]
      operationId: createTaskGroup
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              additionalProperties: false
              properties:
                request_text: { type: string }
                entries:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product_id, platform]
                    additionalProperties: false
                    properties:
                      product_id: { type: string }
                      platform: { $ref: '#/components/schemas/Platform' }
                      account_id: { type: string }
      responses:
