        expected_revision: { type: string, pattern: '^[1-9][0-9]*$', maxLength: 10 }
        idempotency_key: { type: string, minLength: 8, maxLength: 200, pattern: '^[A-Za-z0-9._:-]+$' }
        reason: { type: string, minLength: 3, maxLength: 1000 }
      additionalProperties: false
    McpPlatformMediaSpecListParams:
      type: object
      properties:
        workspace_id: { type: string, description: Compatibility field; never used as the authorization source. }
        platform: { $ref: '#/components/schemas/Platform' }
        placement: { type: string, minLength: 1, maxLength: 200 }
        device: { type: string, enum: [desktop, mobile] }
        status: { type: string, enum: [draft, approved, expired] }
        at: { type: string, format: date-time }
      additionalProperties: false
    McpPlatformMediaSpecGetParams:
      type: object
      required: [id]
      properties:
        workspace_id: { type: string, description: Compatibility field; never used as the authorization source. }
        id: { type: string, minLength: 1, maxLength: 200 }
        at: { type: string, format: date-time }
      additionalProperties: false
    McpPlatformMediaSpecCreateParams:
