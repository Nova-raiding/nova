                    type: object
                    required: [product_id, platform]
                    additionalProperties: false
                    properties:
                      product_id: { type: string }
                      platform: { $ref: '#/components/schemas/Platform' }
                      account_id: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/tasks/understand:
    post:
      tags: [Tasks]
      operationId: understandTaskRequest
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [request_text], additionalProperties: false, properties: { request_text: { type: string, minLength: 1 } } } } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/tasks/{taskId}/answers:
    post:
      tags: [Tasks]
      operationId: submitTaskAnswers
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [answers], additionalProperties: false, properties: { answers: { type: object, additionalProperties: true }, expected_version: { type: integer, minimum: 1, maximum: 9007199254740991 } } } } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/tasks/{taskId}/directions:
    get:
      tags: [Tasks]
      operationId: listCreativeDirections
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
    post:
      tags: [Tasks]
      operationId: selectDirection
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/TaskId' }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [direction_id], additionalProperties: false, properties: { direction_id: { type: string }, expected_version: { type: integer, minimum: 1 } } } } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/tasks/{taskId}/plan/confirm:
    post:
      tags: [Tasks]
      operationId: confirmTaskPlan
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, properties: { expected_version: { type: integer, minimum: 1, maximum: 9007199254740991 }, price_impact_confirmed: { type: boolean }, actor_id: { type: string } } } } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/tasks/{taskId}/content:
    post:
      tags: [Tasks]
      operationId: generateContent
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/TaskId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      description: Production requests require an Idempotency-Key. Local and test fixture calls may omit it.
      responses:
        '201': { $ref: '#/components/responses/Envelope' }
  /v1/tasks/{taskId}/content-versions:
    get:
      tags: [Versioning]
      operationId: listContentVersions
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/TaskId' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' }]
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/tasks/{taskId}/timeline:
    get:
      tags: [Tasks]
      operationId: getTaskTimeline
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/TaskId' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      description: Durable task event timeline scoped to one workspace; includes version, confirmation, failure and delivery events.
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/tasks/{taskId}/feedback:
    get:
      tags: [Tasks]
      operationId: listTaskFeedback
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/TaskId' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' }]
      description: Lists feedback attached to the task only; it does not alter global rules.
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
    post:
      tags: [Tasks]
      operationId: submitTaskFeedback
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              additionalProperties: false
              properties:
                content_version_id: { type: string }
                rating: { type: string, enum: [liked, neutral, needs_improvement] }
                reason: { type: string }
                comment: { type: string, maxLength: 2000 }
      responses:
        '201': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/tasks/{taskId}/approve:
    post:
      tags: [Tasks]
      operationId: approveContent
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [content_version_id], additionalProperties: false, properties: { content_version_id: { type: string }, expected_version: { type: integer, minimum: 1 } } } } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/content-versions/{contentVersionId}/diff:
    get:
      tags: [Versioning]
      operationId: diffContentVersions
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: contentVersionId, in: path, required: true, schema: { type: string } }
        - { name: against, in: query, required: false, description: Optional same-task baseline version ID; omitted means compare with an empty baseline., schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/content-versions/{contentVersionId}/review:
    get:
      tags: [Review]
      operationId: reviewContentVersion
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: contentVersionId, in: path, required: true, schema: { type: string } }
      description: Runs deterministic P0 checks. It does not represent legal or platform approval.
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/content-versions/{contentVersionId}/review-decisions:
    post:
      tags: [Review]
      operationId: decideContentReviewFinding
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/ActorId' }
        - { name: contentVersionId, in: path, required: true, schema: { type: string } }
      description: Marks a P1/P2 finding as acknowledged or waived with an audit reason. P0 findings cannot be bypassed and must be repaired.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, field, status]
              additionalProperties: false
              properties:
                code: { type: string, minLength: 1 }
                field: { type: string, minLength: 1 }
                status: { type: string, enum: [acknowledged, waived] }
                reason: { type: string }
                expected_revision: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/content-versions/{contentVersionId}/modify:
    post:
      tags: [Versioning]
      operationId: modifyContentVersion
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: contentVersionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes, reason]
              additionalProperties: false
              properties:
                changes: { type: object, additionalProperties: true }
                locked_fields: { type: array, items: { type: string } }
                expected_revision: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1 }
      responses:
        '201': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/content-versions/{contentVersionId}/restore:
    post:
      tags: [Versioning]
      operationId: restoreContentVersion
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: contentVersionId, in: path, required: true, schema: { type: string } }
      description: Restores by creating a new review_required child version. The source version is never overwritten, including approved/delivered versions.
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, additionalProperties: false, properties: { expected_version: { type: integer, minimum: 1 } } } } }
      responses:
        '201': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/content-versions/{contentVersionId}/export:
    get:
      tags: [Versioning]
      operationId: exportContentVersion
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: contentVersionId, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [manifest, json, markdown, bundle], default: bundle } }
      description: Returns a downloadable manifest, content JSON, Markdown, or ZIP bundle. No platform publish receipt is fabricated; a receipt is only present when supplied by a real connector.
      responses:
        '200':
          description: Downloadable content (raw JSON/Markdown, not an ApiEnvelope).
          content:
            application/json: { schema: { type: object } }
            text/markdown: { schema: { type: string } }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/tasks/{taskId}/publish-preview:
    post:
      tags: [Tasks]
      operationId: preparePublish
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/publish-jobs:
    get:
      tags: [Tasks]
      operationId: listPublishJobs
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' }]
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
    post:
      tags: [Tasks]
      operationId: confirmPublish
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublishConfirmRequest' } } }
      responses:
        '202': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/publish-jobs/{jobId}:
    get:
      tags: [Tasks]
      operationId: getPublishJob
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { name: jobId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/publish-jobs/{jobId}/execution-check:
    get:
      tags: [Tasks]
      operationId: checkPublishExecution
      description: Worker-token protected authorization and commercial-access gate immediately before connector execution. Both decisions are re-read from current server-side facts; queued snapshots never self-authorize. Returns the opaque credential locator only to the worker and never through MCP or outbox.
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { name: jobId, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Current authorization and commercial rechecks completed.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkerExecutionCheckEnvelope' } } }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/worker-events/{eventId}/execution-check:
    get:
      tags: [Tasks]
      operationId: checkWorkerEventExecution
      description: Worker-token protected pre-provider gate. Validates the durable commercial snapshot for every merchant event and, for actor-authorized work such as continuation execution, also validates the durable authorization snapshot. Automatic initial merchant asset scans return the commercial-only response variant. Platform-owned customer-delivery scans return the delivery-scan response variant bound to the durable admission event; missing required evidence fails closed.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: eventId, in: path, required: true, schema: { type: string } }
        - { name: aggregate_id, in: query, required: true, schema: { type: string } }
        - { name: operation, in: query, required: true, schema: { type: string, enum: [publish.execute, publish.reconcile, generation.execute, image_generation.execute, catalog.sync.execute, asset.scan.execute, asset.continuation.execute, customer_delivery.asset.scan.execute] } }
      responses:
        '200':
          description: Required current worker evidence rechecks completed for the selected operation.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkerEventExecutionCheckEnvelope' } } }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/publish-jobs/{jobId}/observation:
    post:
      tags: [Tasks]
      operationId: recordPublishObservation
      description: Worker-only status projection. A durable outbox acknowledgement is not a publication acknowledgement.
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { name: jobId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublishObservationRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
  /mcp:
    post:
      tags: [MCP]
      operationId: mcpJsonRpc
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/WorkspaceBootstrap' }
        - { $ref: '#/components/parameters/IdempotencyKeyOptional' }
      requestBody:
        required: true
        content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/McpRequest' }, { $ref: '#/components/schemas/McpNativeRequest' }] } } }
      description: |
        rule.sync.status is included in the MCP allowlist and exposes read-only rule freshness.
        This endpoint also accepts native MCP JSON-RPC methods initialize, tools/list, and tools/call. Native tools/list is merchant-scoped and never advertises ops.* methods; native tools/call reuses the same authorization and business handler as the legacy method envelope.
        Exact recovery tools include commercial.access.get, commercial.catalog.get, commercial.order.create, commercial.order.payment.get, creative-points.balance.get, and creative-points.statement.list. Unavailable catalog, order, or statement repositories are reported as blocked and never projected as empty legacy data.
        Every business method is classified by the shared registry after schema, identity, tenant and RBAC checks and before hydration or side effects. Unknown creative-point values remain null; zero, insufficient, disabled and unclassified states fail closed.
      x-method-result-schema:
        canonical.product.consistency: '#/components/schemas/McpCanonicalProductConsistencyResult'
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '402': { $ref: '#/components/responses/CommercialAccessErrorEnvelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/CommercialAccessErrorEnvelope' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Production gateway/API token. The token grant, not X-Workspace-Id, is the identity source.
  x-error-codes: [UNAUTHENTICATED, FORBIDDEN, REQUEST_BODY_TOO_LARGE, RATE_LIMITED, WORKSPACE_JOB_QUOTA_EXCEEDED, WORKSPACE_SCOPE_REQUIRED, WORKSPACE_SCOPE_MISMATCH, TENANT_SCOPE_DENIED, CONTENT_VERSION_SCOPE_MISMATCH, IDEMPOTENCY_CONFLICT, CREATIVE_POINTS_EXHAUSTED, CREATIVE_POINTS_INSUFFICIENT, CREATIVE_POINTS_UNAVAILABLE, RATE_CARD_UNAVAILABLE, COMMERCIAL_ACCESS_STALE, COMMERCIAL_OPERATION_DISABLED, COMMERCIAL_OPERATION_UNCLASSIFIED, COMMERCIAL_EXECUTION_SNAPSHOT_INVALID, COMMERCIAL_EXECUTION_RECHECK_UNAVAILABLE, COMMERCIAL_EXECUTION_RESERVATION_RECHECK_UNAVAILABLE]
  parameters:
    WorkspaceId:
      name: X-Workspace-Id
      in: header
      required: false
      description: |
        Server-selected tenant scope. This header is conditionally required, not
        optional for production business traffic. In production, the authenticated
        Bearer/OIDC grant must authorize the selected workspace and every request
        except the explicitly documented first-run workspace.bootstrap exception
        must provide this header. In local non-production mode, omission resolves
        only to the ws_demo fixture fallback. It never enables a production
        fallback, changes token identity, or authorizes cross-workspace access.
      schema: { type: string, minLength: 1 }
      x-conditional-required:
        production:
          required: true
          missing_header_error: WORKSPACE_SCOPE_REQUIRED
          resolution: authenticated_grant_must_authorize_selected_workspace
        local_non_production:
          required: false
          omission_resolution: ws_demo
          fixture_only: true
        oidc_bootstrap:
          required: false
          only_for:
            method: workspace.bootstrap
            header: X-Workspace-Bootstrap
            header_value: 'true'
          requires_authenticated_identity: true
          creates_workspace_before_binding: true
          applies_to_other_methods: false
          omission_resolution: newly_created_workspace_id
    WorkspaceBootstrap:
      name: X-Workspace-Bootstrap
      in: header
      required: false
      description: Explicit first-run OIDC bootstrap marker. Only workspace.bootstrap may use this marker without X-Workspace-Id; it is not a local fallback switch and is ignored/rejected for ordinary business methods.
      schema: { type: string, enum: ['true'] }
    ActorId:
      name: X-Actor-Id
      in: header
      required: false
      description: Merchant or reviewer identity recorded in the audit trail; defaults to merchant in local mode.
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 256 }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Required only for MCP publish.confirm.
      schema: { type: string, minLength: 8, maxLength: 256 }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items returned when pagination is requested. Omitting both pagination parameters preserves the legacy array response.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      required: false
      description: Zero-based item offset. Supplying either limit or offset returns the paginated items/total/limit/offset shape.
      schema: { type: integer, minimum: 0, default: 0 }
  schemas:
    McpAssetMetadataUpdateParams:
      type: object
      required: [asset_id, material_category, expected_revision]
      properties:
        workspace_id: { type: string, description: Optional workspace context; server-side identity and access checks remain authoritative. }
        asset_id: { type: string, minLength: 1, maxLength: 256 }
        material_category: { type: string, enum: ['品牌资料', '商品主图', '详情页图', 'SKU 图', '商品视频', '未分类'] }
        expected_revision: { type: string, pattern: '^[1-9][0-9]*$', maxLength: 10 }
      additionalProperties: false
    McpBrandUnitBindStoreParams:
      type: object
      description: Bind an authorized platform store to a brand unit. expected_revision is optional for backward compatibility and, when supplied, provides optimistic concurrency protection. reason is optional and is recorded in the operation audit trail.
      required: [brand_id, platform, account_id]
      properties:
        workspace_id: { type: string, description: Compatibility field; authorization comes from the server-side token/workspace scope. }
        brand_id: { type: string, minLength: 1, maxLength: 128 }
        platform: { type: string, enum: [jd, taobao, tmall, pinduoduo, xiaohongshu, douyin] }
        account_id: { type: string, minLength: 1, maxLength: 256 }
        expected_revision: { type: string, pattern: '^[1-9][0-9]*$', maxLength: 10, description: Optional current brand revision; stale values fail with 409 BRAND_STORE_REVISION_CONFLICT. }
        reason: { type: string, minLength: 3, maxLength: 1000, description: Optional auditable operator reason; defaults to the built-in binding reason when omitted. }
      additionalProperties: false
    McpCanonicalProductConsistencyParams:
      type: object
      description: Read-only workspace-scoped dry-run. It compares explicit legacy products/tasks links with canonical products, listings, and campaign items; it never changes cutover mode or writes business data.
      properties:
        workspace_id: { type: string, minLength: 1, description: Compatibility value; when supplied it must equal the authenticated X-Workspace-Id scope. }
      additionalProperties: false
    McpCanonicalBackfillRunCreateParams:
      type: object
      required: [workspace_id, dry_run, reason]
      properties:
        workspace_id: { type: string, minLength: 1 }
        dry_run: { type: string, enum: ['true', 'false'] }
        batch_limit: { type: string, pattern: '^(?:[1-9][0-9]{0,2}|[1-4][0-9]{3}|5000)$' }
        reason: { type: string, minLength: 3, maxLength: 500 }
      additionalProperties: false
    McpCanonicalBackfillRunGetParams:
      type: object
      required: [workspace_id, run_id]
      properties:
        workspace_id: { type: string, minLength: 1 }
        run_id: { type: string, minLength: 1, maxLength: 200 }
      additionalProperties: false
    McpCanonicalBackfillRunControlParams:
      type: object
      required: [workspace_id, run_id, expected_revision, reason]
      properties:
        workspace_id: { type: string, minLength: 1 }
        run_id: { type: string, minLength: 1, maxLength: 200 }
        expected_revision: { type: string, pattern: '^[1-9][0-9]*$', maxLength: 10 }
        reason: { type: string, minLength: 3, maxLength: 500 }
      additionalProperties: false
    # `ops.canonical.backfill.run` executes one batch and records a synthesized
    # audit reason, so it does not accept the caller-supplied `reason` that
    # pause/resume require. Pointing it at the control schema above advertised a
    # required field the wire validator rejects; it has its own exact schema.
    McpCanonicalBackfillRunExecuteParams:
      type: object
      required: [workspace_id, run_id, expected_revision]
      properties:
        workspace_id: { type: string, minLength: 1 }
        run_id: { type: string, minLength: 1, maxLength: 200 }
        expected_revision: { type: string, pattern: '^[1-9][0-9]*$', maxLength: 10 }
      additionalProperties: false
    McpCanonicalBackfillConflictListParams:
      type: object
      required: [workspace_id]
      properties:
        workspace_id: { type: string, minLength: 1 }
        run_id: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, enum: [open, claimed, resolved, dismissed] }
        limit: { type: string, pattern: '^(?:[1-9]|[1-9][0-9]|100)$', maxLength: 3 }
      additionalProperties: false
    McpCanonicalBackfillConflictClaimParams:
      type: object
      required: [workspace_id, conflict_id, expected_revision, reason]
      properties:
        workspace_id: { type: string, minLength: 1 }
        conflict_id: { type: string, minLength: 1, maxLength: 200 }
        expected_revision: { type: string, pattern: '^[1-9][0-9]*$', maxLength: 10 }
        reason: { type: string, minLength: 3, maxLength: 500 }
      additionalProperties: false
    McpCanonicalBackfillConflictResolveParams:
      type: object
      required: [workspace_id, conflict_id, expected_revision, status, resolution_note, reason]
      properties:
        workspace_id: { type: string, minLength: 1 }
        conflict_id: { type: string, minLength: 1, maxLength: 200 }
        expected_revision: { type: string, pattern: '^[1-9][0-9]*$', maxLength: 10 }
        status: { type: string, enum: [resolved, dismissed] }
        resolution_note: { type: string, minLength: 3, maxLength: 1000 }
        reason: { type: string, minLength: 3, maxLength: 1000 }
        remediation_type: { type: string, enum: [set_legacy_brand] }
        brand_id: { type: string, minLength: 1, maxLength: 200 }
        expected_product_version: { type: string, pattern: '^[1-9][0-9]*$', maxLength: 10 }
        reference: { type: string, minLength: 1, maxLength: 500 }
      additionalProperties: false
    McpCanonicalProductConsistencyResult:
      type: object
      description: API result for canonical.product.consistency. Domain status/codes remain authoritative; transport metadata proves when and from which storage mode the read was produced.
      required: [workspaceId, status, contractVersion, contractStatus, generatedAt, readMode, freshness, revision, availability, blocking, counts, findings, orphanFindings, readOnly, cutover, source, durable, read_control, unified_link_audit]
      properties:
        workspaceId: { type: string }
        status: { type: string, enum: [clean, attention_required] }
        contractVersion: { type: integer, enum: [1] }
        contractStatus: { type: string, enum: [clean, attention_required, unknown, unavailable] }
        generatedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        readMode: { type: string, enum: [live, snapshot] }
        freshness: { type: string, enum: [fresh, stale, expired, unknown] }
        revision: { oneOf: [{ type: string, pattern: '^[a-f0-9]{64}$' }, { type: integer }, { type: 'null' }] }
        availability: { type: string, enum: [available, unknown, unavailable] }
        blocking: { $ref: '#/components/schemas/McpCanonicalProductConsistencyBlocking' }
        counts:
          type: object
          required: [verified, legacy_only, conflict, blocked]
          properties:
            verified: { type: integer, minimum: 0 }
            legacy_only: { type: integer, minimum: 0 }
            conflict: { type: integer, minimum: 0 }
            blocked: { type: integer, minimum: 0 }
          additionalProperties: false
        findings:
          type: array
          items: { $ref: '#/components/schemas/McpCanonicalProductConsistencyFinding' }
        orphanFindings:
          type: array
          items: { $ref: '#/components/schemas/McpCanonicalProductConsistencyOrphanFinding' }
        readOnly: { type: boolean, enum: [true] }
        cutover: { type: string, enum: [unchanged] }
        source: { type: string, enum: [memory, postgres] }
        durable: { type: boolean }
        read_control: { $ref: '#/components/schemas/McpCanonicalProductReadControl' }
        unified_link_audit: { $ref: '#/components/schemas/McpCanonicalProductUnifiedLinkAudit' }
      additionalProperties: false
    McpMarketingImageReconcileParams:
      type: object
      description: Workspace-scoped manual reconciliation of a provider-started or unknown image execution. Completion requires archived, trusted-clean outputs; failure retains evidence and reason.
      required: [job_id, resolution, evidence_ref, reason, idempotency_key]
      properties:
        workspace_id: { type: string, description: Compatibility value; authorization comes from the authenticated workspace scope. }
        job_id: { type: string, minLength: 1, maxLength: 256 }
        resolution: { type: string, enum: [completed, failed] }
        evidence_ref: { type: string, minLength: 1, maxLength: 512 }
        reason: { type: string, minLength: 3, maxLength: 1000 }
        idempotency_key: { type: string, minLength: 8, maxLength: 200, pattern: '^[A-Za-z0-9._:-]+$' }
        expected_revision: { type: string, pattern: '^[1-9][0-9]*$', maxLength: 10 }
      additionalProperties: false
    McpMarketingImageEvidenceExportParams:
      type: object
      description: Workspace-scoped, redacted read-only evidence export for one image job. Image bytes, URLs, credentials, raw provider payloads, and full chat content are never returned.
      required: [job_id]
      properties:
        workspace_id: { type: string, description: Compatibility value; authorization comes from the authenticated workspace scope. }
        job_id: { type: string, minLength: 1, maxLength: 256 }
      additionalProperties: false
    McpMarketingImageArchiveAuditParams:
      type: object
      description: Workspace-scoped read-only audit of image archive receipts, asset scope, digests, and trusted scan state. It never deletes or repairs data.
      properties:
        workspace_id: { type: string, description: Compatibility value; authorization comes from the authenticated workspace scope. }
        limit: { type: string, pattern: '^(?:[1-9]|[1-9][0-9]|100)$', maxLength: 3, description: Maximum findings to return; 1 through 100. }
      additionalProperties: false
    McpMarketingImageBillingAuditParams:
      type: object
      description: Workspace-scoped read-only audit of image provider request, action ledger, usage, cost, and settlement evidence. It never debits, refunds, or changes settlement.
      required: [job_id]
      properties:
        workspace_id: { type: string, description: Compatibility value; authorization comes from the authenticated workspace scope. }
        job_id: { type: string, minLength: 1, maxLength: 256 }
      additionalProperties: false
    McpCanonicalProductConsistencyFinding:
      type: object
      required: [legacyProductId, productId, canonicalProductId, status, contractStatus, codes, listingIds, campaignItemIds, taskIds, publishJobIds, scope, relation, blocking, nextAction, evidence]
      properties:
        legacyProductId: { type: string }
        productId: { type: string }
        canonicalProductId: { oneOf: [{ type: string }, { type: 'null' }] }
        status: { type: string, enum: [verified, legacy_only, conflict, blocked] }
        contractStatus: { type: string, enum: [verified, backfilled, legacy_only, conflict, blocked, unknown, unavailable] }
        codes: { type: array, items: { type: string } }
        listingIds: { type: array, items: { type: string } }
        campaignItemIds: { type: array, items: { type: string } }
        taskIds: { type: array, items: { type: string } }
        publishJobIds: { type: array, items: { type: string } }
        scope:
          type: object
          required: [brandId, platform, accountId, listingId]
          properties:
            brandId: { oneOf: [{ type: string }, { type: 'null' }] }
            platform: { oneOf: [{ type: string }, { type: 'null' }] }
            accountId: { oneOf: [{ type: string }, { type: 'null' }] }
            listingId: { oneOf: [{ type: string }, { type: 'null' }] }
          additionalProperties: false
        relation:
          type: object
          required: [listingIds, campaignItemIds, taskIds, publishJobIds]
          properties:
            listingIds: { type: array, items: { type: string } }
            campaignItemIds: { type: array, items: { type: string } }
            taskIds: { type: array, items: { type: string } }
            publishJobIds: { type: array, items: { type: string } }
          additionalProperties: false
        blocking: { $ref: '#/components/schemas/McpCanonicalProductConsistencyBlocking' }
        nextAction: { $ref: '#/components/schemas/McpCanonicalProductConsistencyNextAction' }
        evidence: { $ref: '#/components/schemas/McpCanonicalProductConsistencyEvidence' }
      additionalProperties: false
    McpCanonicalProductConsistencyBlocking:
      oneOf:
        - type: 'null'
        - { $ref: '#/components/schemas/McpCanonicalProductConsistencyBlockingObject' }
    McpCanonicalProductConsistencyBlockingObject:
      type: object
      required: [code, message, impact, objectType, objectId, retryable]
      properties:
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
        impact: { type: string, minLength: 1 }
        objectType: { type: string, enum: [product, canonical_product, listing, campaign_item, task, publish_job, workspace] }
        objectId: { type: string, minLength: 1 }
        retryable: { type: boolean }
      additionalProperties: false
    McpCanonicalProductConsistencyNextAction:
      oneOf:
        - type: 'null'
        - { $ref: '#/components/schemas/McpCanonicalProductConsistencyNextActionObject' }
    McpCanonicalProductConsistencyNextActionObject:
      type: object
      required: [id, method, label, reason, permission, requiredInputs, confirmation]
      properties:
        id: { type: string, minLength: 1 }
        method: { type: string, enum: [brand-unit.product.create, brand-unit.listing.create, canonical.product.consistency] }
        label: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }
        permission:
          type: object
          required: [allowed, requiredRole]
          properties:
            allowed: { type: boolean }
            requiredRole: { oneOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
          additionalProperties: false
        requiredInputs: { type: array, items: { type: string } }
        confirmation: { type: string, enum: [none, interactive_confirmation] }
      additionalProperties: false
    McpCanonicalProductConsistencyOrphanFinding:
      type: object
      required: [entityType, entityId, status, codes, blocking, nextAction]
      properties:
        entityType: { type: string, enum: [canonical_product, listing, campaign_item, task, publish_job] }
        entityId: { type: string }
        status: { type: string, enum: [conflict, blocked] }
        codes: { type: array, items: { type: string } }
        blocking: { $ref: '#/components/schemas/McpCanonicalProductConsistencyBlockingObject' }
        nextAction: { $ref: '#/components/schemas/McpCanonicalProductConsistencyNextActionObject' }
      additionalProperties: false
    McpCanonicalProductConsistencyEvidence:
      type: object
      required: [codes, generatedAt, revision]
      properties:
        codes: { type: array, items: { type: string } }
        generatedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        revision: { oneOf: [{ type: string, pattern: '^[a-f0-9]{64}$' }, { type: integer }, { type: 'null' }] }
      additionalProperties: false
    McpCanonicalProductReadControl:
      type: object
      required: [mode, source]
      properties:
        mode: { type: string, enum: [legacy_shadow, dual_verify, canonical_read] }
        source: { type: string, enum: [default, feature_flag] }
        reason: { type: string }
        revision: { type: integer }
      additionalProperties: false
    McpCanonicalProductUnifiedLinkAudit:
      type: object
      required: [persisted, count, items]
      properties:
        persisted: { type: boolean }
        count: { type: integer, minimum: 0 }
        items:
          type: array
          items:
            type: object
            required: [id, workspaceId, auditKey, entityType, entityId, status, codes, checkRevision, checksum, firstSeenAt, lastSeenAt]
            properties:
              id: { type: string, minLength: 1 }
              workspaceId: { type: string, minLength: 1 }
              auditKey: { type: string }
              entityType: { type: string, enum: [product, canonical_product, listing, campaign_item, task, publish_job] }
              entityId: { type: string, minLength: 1 }
              legacyProductId: { type: string, minLength: 1 }
              canonicalProductId: { type: string, minLength: 1 }
              listingId: { type: string, minLength: 1 }
              campaignItemId: { type: string, minLength: 1 }
              taskId: { type: string, minLength: 1 }
              publishJobId: { type: string, minLength: 1 }
              status: { type: string, enum: [verified, legacy_only, conflict, blocked] }
              codes: { type: array, items: { type: string } }
              checkRevision: { type: string }
              checksum: { type: string }
              firstSeenAt: { type: string, format: date-time }
              lastSeenAt: { type: string, format: date-time }
              lastError: { type: string }
            additionalProperties: false
      additionalProperties: false
    BrandVisualRules:
      type: object
      additionalProperties: false
      properties:
        logo:
          type: object
          required: [assetIds]
          additionalProperties: false
          properties:
            assetIds: { type: array, minItems: 1, maxItems: 10, items: { type: string } }
            allowRecolor: { type: boolean, default: false }
            allowDistortion: { type: boolean, default: false }
            allowRedraw: { type: boolean, default: false }
            clearSpace: { type: string }
        colors:
          type: object
          additionalProperties: false
          properties:
            primary: { type: array, maxItems: 20, items: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' } }
            secondary: { type: array, maxItems: 20, items: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' } }
            forbidden: { type: array, maxItems: 20, items: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' } }
        fonts:
          type: array
          maxItems: 20
          items:
            type: object
            required: [family, licenseStatus]
            additionalProperties: false
            properties:
              family: { type: string }
              assetId: { type: string }
              licenseStatus: { type: string, enum: [approved, restricted, unknown] }
        styleKeywords: { type: array, maxItems: 20, items: { type: string } }
        restrictedSubjects:
          type: object
          additionalProperties: false
          properties:
            people: { type: array, maxItems: 30, items: { type: string } }
            spokespersons: { type: array, maxItems: 30, items: { type: string } }
            intellectualProperties: { type: array, maxItems: 30, items: { type: string } }
            prohibitedContent: { type: array, maxItems: 30, items: { type: string } }
    RuleApproval:
      type: object
      required: [approval_ref, approved_at, approved_by]
      additionalProperties: false
      properties:
        approval_ref: { type: string, minLength: 1 }
        approved_at: { type: string, format: date-time }
        approved_by: { type: string, minLength: 1 }
    CreateRuleVersionRequest:
      type: object
      required: [name, version, scope, source_kind, source_reference, source_checked_at, checks, reason]
      additionalProperties: false
      properties:
        workspace_id: { type: string, description: Compatibility field; must equal X-Workspace-Id when supplied. }
        pack_id: { type: string, description: Optional consistency field; must equal packId. }
        name: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        scope: { type: string, enum: [global, platform, category, brand, store, campaign] }
        status: { type: string, enum: [draft, active], default: draft }
        source_kind: { type: string, enum: [official, internal, legal_review] }
        source_reference: { type: string, minLength: 1 }
        source_checked_at: { type: string, format: date-time }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time }
        severity: { type: string, enum: [error, warning], default: error }
        action: { type: string, enum: [block, warn, review, allow], default: block }
        target_id: { type: string }
        scope_value: { type: string }
        checks: { type: object, additionalProperties: true }
        checksum: { type: string, pattern: '^[a-f0-9]{64}$', description: Optional client assertion; the server always recomputes it from canonical checks JSON. }
        reason: { type: string, minLength: 1 }
        approval: { $ref: '#/components/schemas/RuleApproval' }
    SetRuleVersionStatusRequest:
      type: object
      required: [status, reason]
      additionalProperties: false
      properties:
        workspace_id: { type: string, description: Compatibility field; must equal X-Workspace-Id when supplied. }
        status: { type: string, enum: [active, inactive, expired] }
        reason: { type: string, minLength: 1 }
        approval: { $ref: '#/components/schemas/RuleApproval' }
    ScopedBrandSettings:
      type: object
      required: [schemaVersion]
      additionalProperties: false
      description: schemaVersion must be 1. Maps are limited to 500 stores, 500 image assignments, and 200 series per store; map keys and referenced store, series, and asset IDs must belong to the authenticated workspace.
      properties:
        schemaVersion: { type: integer, enum: [1] }
        global: { $ref: '#/components/schemas/ScopedBrandEntry' }
        stores: { type: object, maxProperties: 500, additionalProperties: { $ref: '#/components/schemas/ScopedBrandEntry' } }
        series:
          type: object
          maxProperties: 500
          additionalProperties:
            type: object
            maxProperties: 200
            additionalProperties: { $ref: '#/components/schemas/ScopedBrandEntry' }
        images: { type: object, maxProperties: 500, additionalProperties: { $ref: '#/components/schemas/ScopedBrandEntry' } }
    ScopedBrandEntry:
      type: object
      required: [enabled, values]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        values:
          type: object
          additionalProperties: false
          properties:
            color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
            persona: { type: string, maxLength: 4000 }
            sellingPoints: { type: string, maxLength: 4000 }
            logoAssetId: { type: string, maxLength: 200 }
            documentAssetId: { type: string, maxLength: 200 }
    Platform:
      type: string
      enum: [jd, taobao, tmall, pinduoduo, xiaohongshu, douyin]
    AuthorizeRequest:
      type: object
      properties:
        workspace_id: { type: string, description: Compatibility field; must equal X-Workspace-Id when supplied. }
        actor_id: { type: string }
        redirect_uri: { type: string, format: uri }
      additionalProperties: false
    CreateTaskRequest:
      type: object
      required: [product_id, platform]
      properties:
        workspace_id: { type: string, description: Compatibility field; never used as the authorization source. }
        product_id: { type: string }
        brand_id: { type: string, description: Required for brand-restricted members; must grant editor access. }
        platform: { $ref: '#/components/schemas/Platform' }
        account_id: { type: string, description: Authorized platform account bound to this task. }
      additionalProperties: false
    PublishConfirmRequest:
      type: object
      required: [task_id, content_version_id, confirmation_hash, remote_snapshot_hash]
      properties:
        workspace_id: { type: string, description: Compatibility field; must equal server scope when supplied. }
        task_id: { type: string }
        content_version_id: { type: string }
        confirmation_hash: { type: string, minLength: 1 }
        remote_snapshot_hash: { type: string, minLength: 1 }
        account_id: { type: string, description: Authorized platform account used for this publish. }
        confirmation_ticket_nonce_hash: { type: string, pattern: '^[a-f0-9]{64}$', description: One-time confirmation bearer bound to the current actor and session. }
        confirmation_ticket_intent_hash: { type: string, pattern: '^[a-f0-9]{64}$', description: Intent or interactive-session hash bound to the current actor and session. }
      additionalProperties: false
    PublishObservationRequest:
      type: object
      required: [status]
      properties:
        workspace_id: { type: string, description: Compatibility field; must equal server scope when supplied. }
        source: { type: string, enum: [publish, reconcile] }
        observed_at: { type: string, format: date-time }
        status:
          type: object
          required: [found, state]
          properties:
            found: { type: boolean }
            state: { type: string, enum: [submitted, published, rejected, unknown] }
            remote_id: { type: string }
            request_id: { type: string }
            simulated: { type: boolean }
            platform_rejection:
              $ref: '#/components/schemas/PlatformRejection'
          additionalProperties: false
      additionalProperties: false
    PlatformRejection:
      type: object
      required: [raw_code, fields]
      properties:
        raw_code: { type: string, minLength: 1, maxLength: 128, description: Raw platform rejection code safe for merchant support. }
        message: { type: string, minLength: 1, maxLength: 2000 }
        fields:
          type: array
          maxItems: 50
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string, minLength: 1, maxLength: 256 }
              raw_code: { type: string, minLength: 1, maxLength: 128 }
              message: { type: string, minLength: 1, maxLength: 1000 }
            additionalProperties: false
      additionalProperties: false
    McpCampaignBatchControlParams:
