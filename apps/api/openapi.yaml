openapi: 3.0.3
info:
  title: Merchant Marketing MCP/API
  version: 0.1.0
  description: |
    Codex merchant marketing API. Every response, including errors and MCP
    results, is an ApiEnvelope. Production merchant requests must carry a
    Bearer token authorized for the selected X-Workspace-Id; local
    non-production requests retain the ws_demo fallback. External
    platform writes are disabled by default and remain confirmation-gated.
servers:
  - url: http://127.0.0.1:8787
# All API operations are authenticated by default. Public runtime probes and the
# OAuth callback opt out explicitly at their operation level below.
security:
  - bearerAuth: []
tags:
  - name: Runtime
  - name: Rules
  - name: Catalog
  - name: Tasks
  - name: Versioning
  - name: OAuth
  - name: MCP
  - name: Commercial
  - name: Platform Governance
paths:
  /v1/ops/merchant-registration-applications:
    get:
      tags: [Platform Governance]
      operationId: listMerchantRegistrationApplications
      description: Lists merchant registration applications for platform operations.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/ops/merchant-registration-applications/review:
    post:
      tags: [Platform Governance]
      operationId: reviewMerchantRegistrationApplication
      description: Approves or rejects a pending merchant registration application.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, decision, reason]
              properties:
                login: { type: string }
                decision: { type: string, enum: [approved, rejected] }
                reason: { type: string, minLength: 4 }
                workspace_ids: { type: array, items: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/ops/merchant-accounts:
    post:
      tags: [Operations]
      operationId: inviteMerchantAccount
      description: Creates a merchant account invitation. Requires a platform operations role. Only one existing workspace may be bound, or one new workspace may be requested; commercial qualification and capabilities are not granted by invitation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, enterprise_name, contact_name, workspace_ids, reason, idempotency_key]
              additionalProperties: false
              properties:
                login: { type: string, format: email }
                enterprise_name: { type: string, minLength: 1 }
                contact_name: { type: string, minLength: 1 }
                workspace_ids: { type: array, maxItems: 1, items: { type: string } }
                create_workspace: { type: boolean }
                reason: { type: string, minLength: 1 }
                idempotency_key: { type: string, minLength: 1 }
                action: { type: string, enum: [create, reissue] }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '201': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '413': { $ref: '#/components/responses/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/ops/merchant-accounts/authorize:
    post:
      tags: [Platform Governance]
      operationId: authorizeMerchantAccount
      description: Binds a reviewed merchant account to a workspace member role and an approved commercial SKU. Pending payment creates an auditable pending order and invited member without granting paid capabilities.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, workspace_id, member_role, sku_code, amount_fen, payment_status, idempotency_key, reason]
              properties:
                login: { type: string }
                workspace_id: { type: string }
                member_role: { type: string, enum: [workspace_owner, merchant_admin, operator, support, finance] }
                sku_code: { type: string }
                amount_fen: { type: integer, minimum: 0 }
                payment_status: { type: string, enum: [pending, verified] }
                payment_reference: { type: string }
                paid_at: { type: string, format: date-time }
                reason: { type: string, minLength: 4 }
                idempotency_key: { type: string, minLength: 8 }
      responses:
        '201': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /internal/commercial-runtime-attestation:
    get:
      tags: [Infrastructure]
      operationId: getCommercialRuntimeAttestation
      security: []
      description: Public read-only runtime identity probe used over each API container loopback during release verification. Returns process instance identity, code sales protocol, verified release-manifest SHA-256 and actual database migration-checksum hash. Contains no secrets or customer facts. A successful response proves runtime protocol identity only, never purchase, payment, grant or business readiness.
      responses:
        '200':
          description: Runtime identity and actual schema evidence, with unavailable evidence explicit.
          content:
            application/json:
              schema: { type: object }
        '503':
          description: Required runtime or database attestation evidence is unavailable.
          content:
            application/json:
              schema: { type: object }
  /v1/support/requests:
    post:
      tags: [Support]
      operationId: createMerchantSupportRequest
      description: Pre-order support for an authenticated active workspace member. Server fixes workspace, actor and customer identity; no Ops identity or paid qualification is implied. Exact commercial recovery with no point charge.
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject, message, idempotency_key]
              properties:
                subject: { type: string, minLength: 3, maxLength: 200 }
                message: { type: string, minLength: 3, maxLength: 4000 }
                idempotency_key: { type: string, minLength: 8, maxLength: 128, pattern: '^[a-zA-Z0-9._:-]+$' }
                request_id: { type: string, minLength: 1, maxLength: 128 }
                trace_id: { type: string, minLength: 1, maxLength: 128 }
                version: { type: string, minLength: 1, maxLength: 128 }
                step: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/support/requests/{ticketId}:
    get:
      tags: [Support]
      operationId: getMerchantSupportRequest
      description: Return only a caller-owned ticket and customer-visible replies in the authenticated workspace. Request IDs and ticket IDs do not grant access to another customer.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: ticketId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/internal/commercial/notifications/tick:
    post:
      tags: [Internal]
      operationId: tickCommercialNotifications
      description: Signed worker-only notification fanout. Requires the configured worker bearer and request-signing proof; never accessible with a merchant session. Worker batching, durable leases and visibility checks remain authoritative.
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/commercial/access:
    get:
      tags: [Commercial]
      operationId: getCommercialAccess
      description: Returns the server-owned creative-point access decision. Unknown balance remains null and fails closed for business execution.
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/CommercialAccessErrorEnvelope' }
  /v1/commercial/catalog:
    get:
      tags: [Commercial]
      operationId: getCommercialCatalog
      description: Returns only persisted public V2 catalog entries. Missing controlled ops-database access is explicit and never falls back to legacy offers.
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/commercial/order-requests/{idempotencyKey}:
    get:
      tags: [Commercial]
      operationId: commercial_order_request_get
      description: Authenticated workspace and creating-actor scope; server-owned immutable commerce facts only.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: idempotencyKey, in: path, required: true, schema: { type: string, minLength: 8, maxLength: 200 } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/commercial/upgrade-quote-requests/{idempotencyKey}:
    get:
      tags: [Commercial]
      operationId: commercial_upgrade_quote_request_get
      description: Authenticated workspace and creating-actor scope; server-owned immutable commerce facts only.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: idempotencyKey, in: path, required: true, schema: { type: string, minLength: 8, maxLength: 200 } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/commercial/checkout-requests/{idempotencyKey}:
    get:
      tags: [Commercial]
      operationId: commercial_checkout_request_get
      description: Authenticated workspace and creating-actor scope; server-owned immutable commerce facts only.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: idempotencyKey, in: path, required: true, schema: { type: string, minLength: 8, maxLength: 200 } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/commercial/checkouts:
    post:
      tags: [Commercial]
      operationId: commercial_checkout_create
      description: Authenticated workspace and creating-actor scope; server-owned immutable commerce facts only.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [onboarding_sku_code, subscription_sku_code, idempotency_key, reason]
              properties:
                onboarding_sku_code: { type: string, minLength: 1, maxLength: 128 }
                subscription_sku_code: { type: string, minLength: 1, maxLength: 128 }
                idempotency_key: { type: string, minLength: 8, maxLength: 200 }
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/commercial/orders/{orderId}/checkout:
    post:
      tags: [Commercial]
      operationId: commercial_order_payment_create
      description: Authenticated workspace and creating-actor scope; server-owned immutable commerce facts only.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: orderId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 256 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotency_key]
              properties:
                idempotency_key: { type: string, minLength: 8, maxLength: 200 }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/commercial/upgrade-quotes:
    post:
      tags: [Commercial]
      operationId: createCommercialUpgradeQuote
      description: Freezes a server-calculated remaining-period higher-tier upgrade quote. Preserves the original expiry and does not accept client amounts.
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_sku_code, idempotency_key]
              properties:
                target_sku_code: { type: string, minLength: 1, maxLength: 128 }
                idempotency_key: { type: string, minLength: 8, maxLength: 200 }
      responses:
        '201': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/commercial/upgrade-quotes/{quoteId}:
    get:
      tags: [Commercial]
      operationId: getCommercialUpgradeQuote
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: quoteId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 256 } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/commercial/subscription:
    get:
      tags: [Commercial]
      operationId: getCommercialSubscription
      description: Returns current and future paid contracts separately. Future points remain unavailable until their approved release window.
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/commercial/notifications:
    get:
      tags: [Commercial]
      operationId: listCommercialNotifications
      description: Workspace-authorized bounded commercial publication and purchase-result notifications; membership and visibility are rechecked on read. Each result exposes notification_kind, nullable read_at, and optional order_id/result_state (active, scheduled, awaiting_dependency, reconciliation_required); event_id and cursor are opaque.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: cursor, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/commercial/notifications/{notificationId}/read:
    post:
      tags: [Commercial]
      operationId: markCommercialNotificationRead
      description: Idempotently marks only a notification already visible to the verified active member as read. Caller workspace/member identity, financial intent, prices and entitlements are not accepted.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: notificationId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 256 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotency_key]
              properties:
                idempotency_key: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/commercial/orders:
    post:
      tags: [Commercial]
      operationId: createCommercialOrderV2
      description: Creates a V2 purchase, upgrade, or point-pack order from one active approved executable server snapshot. Client amount, currency, points, benefits, private eligibility, and arbitrary recharge values are never accepted.
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purchase_kind, sku_code, idempotency_key, reason]
              properties:
                purchase_kind: { type: string, enum: [purchase, onboarding_once, upgrade, point_pack] }
                sku_code: { type: string, minLength: 1, maxLength: 128 }
                upgrade_quote_id: { type: string, minLength: 1, maxLength: 256, description: Required when purchase_kind is upgrade; old full-price upgrade requests are rejected. }
                checkout_id: { type: string, minLength: 1, maxLength: 256 }
                onboarding_order_id: { type: string, minLength: 1, maxLength: 256 }
                idempotency_key: { type: string, minLength: 8, maxLength: 200 }
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '201': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/commercial/orders/{orderId}/payment:
    get:
      tags: [Commercial]
      operationId: getCommercialOrderPaymentV2
      description: Returns workspace-scoped V2 payment and grant status. Paid with a null access revision is not reported as recovered.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - in: path
          name: orderId
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/creative-points/balance:
    get:
      tags: [Commercial]
      operationId: getCreativePointBalance
      description: Returns the authoritative workspace balance and access revision; unknown is null, never zero.
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/creative-points/statement:
    get:
      tags: [Commercial]
      operationId: listCreativePointStatement
      description: Reads authoritative creative-point ledger evidence from the workspace-scoped repository; unavailable storage is explicit and never projected as an empty statement.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/Limit' }
        - in: query
          name: cursor
          required: false
          description: Base64url-encoded `{createdAt,id}` keyset cursor returned by the previous page.
          schema: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/platform-capabilities:
    get:
      summary: Read the six-platform capability evidence matrix
      description: |
        Returns connector capability evidence for each supported platform.
        The `media_upload` capability may also include the server-owned
        desktop media-spec lifecycle fields `source`, `version`, `expiresAt`,
        `status`, `evidenceRef`, and `verifiedAt` when an approved media
        specification exists. Missing or non-approved media evidence is
        omitted and must remain unverified in clients.
      parameters:
        - in: header
          name: X-Workspace-Id
          required: true
          schema: { type: string }
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
      responses:
        '200': { description: Capability matrix }
        '401': { description: Unauthenticated }
        '403': { description: Workspace forbidden }
  /v1/delivery-readiness:
    get:
      tags: [Runtime]
      operationId: getDeliveryReadiness
      description: Return workspace-scoped mapping, delivery-bundle, and visual-authenticity readiness for visible products and approved content.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: workspace_id, in: query, required: false, description: Optional compatibility value; must equal the authenticated workspace scope., schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/catalog/categories:
    get:
      tags: [Catalog]
      operationId: listCatalogCategories
      description: Return deterministic catalog category and required-field metadata, optionally filtered by query.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: query, in: query, required: false, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /v1/rules:
    get:
      tags: [Rules]
      operationId: listRulePacks
      description: Production reads are served from the tenant-scoped PostgreSQL rule repository. Fixture mode may use seeded rules when no repository is configured.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { name: pack_id, in: query, required: false, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
