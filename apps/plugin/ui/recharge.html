<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{color-scheme:light dark;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;--bg:#fff;--surface:#f6f7f5;--text:#17201b;--muted:#68736c;--line:#dfe4de;--green:#176b4d;--green2:#0f513a;--lime:#d8ed7a;--amber:#8a5b12;--amberbg:#fff4d6} @media(prefers-color-scheme:dark){:root{--bg:#202421;--surface:#292e2a;--text:#f4f6f3;--muted:#aab3ad;--line:#3b433d;--green:#70c89f;--green2:#1d7b58;--lime:#c9e36a;--amber:#ffd177;--amberbg:#40351f}}
    *{box-sizing:border-box}body{margin:0;background:transparent;color:var(--text)}button,input{font:inherit}.wallet{margin:0;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--bg)}.head,.row,.actions{display:flex;align-items:center}.head{justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.mark{width:36px;height:36px;border-radius:11px;background:var(--lime);color:#18362a;display:grid;place-items:center;font-weight:900}.brand b,.brand small{display:block}.brand small,.sub,.label,.order small{color:var(--muted);font-size:12px}.badge{padding:5px 9px;border-radius:99px;background:var(--amberbg);color:var(--amber);font-size:11px;font-weight:700}.balance{margin:18px 0 4px;font-size:34px;font-weight:800;letter-spacing:-.04em}.sub{margin:0 0 16px}.warning{display:none;margin:0 0 16px;padding:12px;border-radius:10px;background:var(--amberbg);color:var(--amber);font-size:13px;line-height:1.5}.warning.show{display:block}.label{display:block;margin:13px 0 7px;font-weight:700}.amounts,.channels{display:grid;gap:8px}.amounts{grid-template-columns:repeat(3,1fr)}.channels{grid-template-columns:1fr 1fr}.choice{height:42px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);font-weight:700}.choice.selected{border:2px solid var(--green);color:var(--green);background:transparent}.custom{width:100%;height:42px;margin-top:8px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text)}.actions{gap:8px;margin-top:16px}.primary,.secondary{height:44px;border-radius:10px;padding:0 15px;font-weight:800}.primary{flex:1;border:0;background:var(--green2);color:white}.secondary{border:1px solid var(--line);background:var(--surface);color:var(--text)}button:disabled{opacity:.55}.order{display:none;margin-top:16px;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}.order.show{display:block}.order b{display:block;margin-bottom:6px}.order .row{justify-content:space-between;gap:8px;font-size:12px}.pending{color:var(--amber);font-weight:800}.paid{color:var(--green);font-weight:800}.safe{margin:12px 0 0;color:var(--muted);font-size:11px;line-height:1.45}.error{color:#b74a3b;font-size:12px;margin-top:10px}dialog{width:min(430px,calc(100% - 28px));padding:0;border:1px solid var(--line);border-radius:18px;background:var(--bg);color:var(--text);box-shadow:0 24px 70px #0008}dialog::backdrop{background:#07110bbb;backdrop-filter:blur(3px)}.checkout{padding:22px}.checkout h2{margin:0 0 6px;font-size:21px}.checkout .pay-amount{margin:20px 0 4px;font-size:34px;font-weight:850}.checkout .pay-channel{color:var(--muted);font-size:13px}.checkout .pay-code{display:grid;place-items:center;width:148px;height:148px;margin:18px auto;border:10px solid white;border-radius:12px;background:repeating-conic-gradient(#17201b 0 8%,white 0 14%);box-shadow:inset 0 0 0 5px #17201b}.checkout .pay-code span{padding:7px;background:white;color:#17201b;font-weight:900}.checkout .pay-note{padding:10px;border-radius:9px;background:var(--amberbg);color:var(--amber);font-size:12px;line-height:1.45}.checkout .actions{margin-top:16px}.checkout .secondary{flex:1}
  </style>
</head>
<body>
  <main class="wallet" aria-live="polite">
    <div class="head"><div class="brand"><div class="mark">麦</div><div><b>大麦钱包</b><small>内容、图片、视频统一额度</small></div></div><span class="badge" id="mode">测试支付</span></div>
    <div class="balance">¥<span id="balance">0.00</span></div><p class="sub" id="status">充值到账后解锁生成能力</p>
    <div class="warning" id="warning"><b>额度不足，需要充值</b><br><span id="reason">当前余额不足以完成本次任务。</span></div>
    <span class="label">选择充值金额</span><div class="amounts"><button class="choice" data-amount="50.00">¥50</button><button class="choice selected" data-amount="100.00">¥100</button><button class="choice" data-amount="300.00">¥300</button></div>
    <input class="custom" id="custom" inputmode="decimal" placeholder="其他金额（元）" aria-label="其他充值金额" />
    <span class="label">支付方式</span><div class="channels"><button class="choice selected" data-channel="alipay">支付宝</button><button class="choice" data-channel="wechat">微信支付</button></div>
    <div class="actions"><button class="primary" id="create">立即充值</button><button class="secondary" id="query" disabled>查询状态</button></div>
    <div class="order" id="order"><div class="row"><b>充值订单</b><span class="pending" id="orderState">待支付</span></div><small id="orderInfo"></small></div>
    <div class="error" id="error"></div><p class="safe">本地测试支付不会产生真实扣款。正式支付将在安全收银台完成，到账以服务端回调为准。</p>
  </main>
  <dialog id="checkout"><section class="checkout"><h2>确认支付</h2><div class="pay-channel" id="checkoutChannel">支付宝收银台</div><div class="pay-amount">¥<span id="checkoutAmount">100.00</span></div><div class="pay-code" aria-label="测试付款码"><span>大麦</span></div><div class="pay-note" id="checkoutNote">这是本地测试付款码，不会产生真实扣款。</div><div class="actions"><button class="secondary" id="closeCheckout">暂不支付</button><button class="primary" id="paidCheckout">我已完成支付</button></div></section></dialog>
  <script>
    const URI='ui://merchant-marketing/recharge-v1.html';let amount='100.00',channel='alipay',orderId='',latest=null,modalRequested=false,nextId=1;const pending=new Map();
    const $=id=>document.getElementById(id);function request(method,params){const id=nextId++;window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');return new Promise((resolve,reject)=>pending.set(id,{resolve,reject}))}async function callTool(name,args){if(window.openai?.callTool)return window.openai.callTool(name,args);return request('tools/call',{name,arguments:args})}
    function value(o,...keys){for(const k of keys)if(o&&o[k]!==undefined)return o[k]}
    function paymentMode(data){return (value(data,'paymentMode','payment_mode','billing_mode','billingMode')||'fixture').toString().toLowerCase()}function render(data){latest=data||{};const balance=value(latest,'balance_cny','balanceCny')??value(latest.plugin_access,'balance_cny','balanceCny')??'0.00';$('balance').textContent=balance;const insufficient=latest.show_recharge===true||latest.code==='RECHARGE_REQUIRED'||latest.code==='BILLING_INSUFFICIENT_BALANCE'||latest.plugin_access?.unlocked===false;$('warning').classList.toggle('show',insufficient);$('reason').textContent=latest.recharge_reason||latest.message||'当前余额不足以完成本次任务。';$('mode').textContent=paymentMode(latest)==='provider'?'安全支付':'测试支付';const id=value(latest,'id','order_id');if(id){orderId=id;const state=value(latest,'state')||'pending';$('order').classList.add('show');$('orderState').textContent=state==='paid'?'已到账':'待支付';$('orderState').className=state==='paid'?'paid':'pending';$('orderInfo').textContent=`${latest.channel==='wechat'?'微信支付':'支付宝'} · ¥${value(latest,'amount_cny','amountCny')||amount} · ${id}`;$('query').disabled=false}$('status').textContent=latest.plugin_access?.unlocked?'钱包可用，生成能力已解锁':'充值到账后解锁生成能力';if(insufficient&&!modalRequested&&window.openai?.requestModal&&window.openai?.displayMode==='inline'){modalRequested=true;window.openai.requestModal({template:URI}).catch(()=>{})}}
    async function openCheckout(data){const url=value(data,'paymentUrl','payment_url');if(paymentMode(data)==='provider'&&typeof url==='string'&&(/^(https:|alipays:|weixin:)/u.test(url))){if(window.openai?.openExternal){await window.openai.openExternal({href:url});return}window.open(url,'_blank','noopener,noreferrer');return}$('checkoutAmount').textContent=value(data,'amount_cny','amountCny')||amount;$('checkoutChannel').textContent=(data.channel==='wechat'?'微信支付':'支付宝')+'收银台';$('checkout').showModal()}
    document.querySelectorAll('[data-amount]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-amount]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');amount=b.dataset.amount;$('custom').value='' });$('custom').oninput=e=>{if(e.target.value){document.querySelectorAll('[data-amount]').forEach(x=>x.classList.remove('selected'));amount=e.target.value.trim()}};document.querySelectorAll('[data-channel]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-channel]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');channel=b.dataset.channel});
    $('create').onclick=async()=>{if(!/^\d+(\.\d{1,2})?$/.test(amount)||Number(amount)<=0){$('error').textContent='请输入正确的充值金额';return}$('error').textContent='';$('create').disabled=true;$('create').textContent='正在进入收银台…';try{const r=await callTool('billing.recharge.create',{amount_cny:Number(amount).toFixed(2),channel,idempotency_key:`chatgpt-ui-${Date.now()}`});const data=r?.structuredContent||r?.content?.[0]?.structuredContent||r;render(data);await openCheckout(data)}catch(e){$('error').textContent=e?.message||'创建订单失败'}finally{$('create').disabled=false;$('create').textContent='立即充值'}};
    async function renderOrderAndWallet(response){const data=response?.structuredContent||response;render(data);if(value(data,'state')==='paid'){const wallet=await callTool('billing.status',{});render(wallet?.structuredContent||wallet)}}
    $('query').onclick=async()=>{if(!orderId)return;$('query').disabled=true;try{const r=await callTool('billing.recharge.get',{order_id:orderId});await renderOrderAndWallet(r)}catch(e){$('error').textContent=e?.message||'查询失败'}finally{$('query').disabled=false}};
    $('closeCheckout').onclick=()=>$('checkout').close();$('paidCheckout').onclick=async()=>{const testMode=paymentMode(latest)!=='provider';$('checkout').close();if(!orderId)return;$('query').disabled=true;try{const r=await callTool('billing.recharge.get',{order_id:orderId,...(testMode?{confirm_test_payment:'true'}:{})});await renderOrderAndWallet(r)}catch(e){$('error').textContent=e?.message||'查询失败'}finally{$('query').disabled=false}};
    window.addEventListener('message',e=>{if(e.source!==window.parent)return;const m=e.data;if(!m||m.jsonrpc!=='2.0')return;if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return}if(m.method==='ui/notifications/tool-result')render(m.params?.structuredContent)});render(window.openai?.toolOutput||{});
  </script>
</body>
</html>
