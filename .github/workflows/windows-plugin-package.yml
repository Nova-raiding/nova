name: windows-plugin-package

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-plugin-bundle
    paths:
      - '.github/workflows/windows-plugin-package.yml'
      - 'apps/plugin/**'
      - 'release-metadata.json'

permissions:
  contents: read

jobs:
  windows-package-smoke:
    runs-on: windows-2022
    steps:
      - name: Check out the tested commit with the Windows runner tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git init .
          git remote add origin https://github.com/Nova-raiding/nova.git
          git fetch --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Checkout fetch failed' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Checkout failed' }
          node --version
          dotnet --version
      - name: Build a self-contained Credential Manager helper
        timeout-minutes: 8
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $helperDir = Join-Path $env:RUNNER_TEMP 'storenova-helper'
          node apps/plugin/scripts/build-windows-credential-helper.mjs $helperDir
          if ($LASTEXITCODE -ne 0) { throw 'Credential helper build failed' }
          $sourceChanges = git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or $sourceChanges) { throw "Credential helper build modified the release source tree: $sourceChanges" }
      - name: Create a runner-local test certificate
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $rootKey = [System.Security.Cryptography.RSA]::Create(2048)
            $rootRequest = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new('CN=Store Nova CI test root', $rootKey, [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
            $rootRequest.CertificateExtensions.Add([System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension]::new($true, $false, 0, $true))
            $rootRequest.CertificateExtensions.Add([System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new([System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::KeyCertSign -bor [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::CrlSign, $true))
            $rootCert = $rootRequest.CreateSelfSigned((Get-Date).AddMinutes(-10), (Get-Date).AddDays(2))
            $leafKey = [System.Security.Cryptography.RSA]::Create(2048)
            $request = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new('CN=Store Nova CI package test only', $leafKey, [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
            $oids = [System.Security.Cryptography.OidCollection]::new()
            [void]$oids.Add([System.Security.Cryptography.Oid]::new('1.3.6.1.5.5.7.3.3'))
            $request.CertificateExtensions.Add([System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new($oids, $false))
            $request.CertificateExtensions.Add([System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension]::new($false, $false, 0, $true))
            $request.CertificateExtensions.Add([System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new([System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature, $true))
            $serial = [byte[]]::new(16)
            [System.Security.Cryptography.RandomNumberGenerator]::Fill($serial)
            $serial[0] = $serial[0] -band 0x7f
            $issued = $request.Create($rootCert, (Get-Date).AddMinutes(-5), (Get-Date).AddDays(1), $serial)
            $created = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::CopyWithPrivateKey($issued, $leafKey)
            $pfxPath = Join-Path $env:RUNNER_TEMP 'storenova-ci-test.pfx'
            $cerPath = Join-Path $env:RUNNER_TEMP 'storenova-ci-test.cer'
            $leafCerPath = Join-Path $env:RUNNER_TEMP 'storenova-ci-leaf.cer'
            [System.IO.File]::WriteAllBytes($pfxPath, $created.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx, 'ci-test-only'))
            [System.IO.File]::WriteAllBytes($cerPath, $rootCert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
            [System.IO.File]::WriteAllBytes($leafCerPath, $created.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
            [System.IO.File]::AppendAllText($env:GITHUB_ENV, "STORENOVA_WINDOWS_SIGNER_THUMBPRINT=$($created.Thumbprint)`n", [System.Text.UTF8Encoding]::new($false))
          } catch {
            Write-Host "::error file=.github/workflows/windows-plugin-package.yml,line=1::CERT_CREATE_$($_.Exception.GetType().Name)_$($_.Exception.Message)"
            exit 1
          }
      - name: Import the runner-local test signing key
        timeout-minutes: 3
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'storenova-ci-test.pfx'
          certutil.exe -user -f -p ci-test-only -importPFX My $pfxPath NoRoot
          if ($LASTEXITCODE -ne 0) { throw 'Test certificate private key import failed' }
      - name: Trust the runner-local test certificate
        timeout-minutes: 3
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cerPath = Join-Path $env:RUNNER_TEMP 'storenova-ci-test.cer'
          certutil.exe -f -addstore Root $cerPath
          if ($LASTEXITCODE -ne 0) { throw 'Test certificate trust import failed' }
          certutil.exe -f -addstore TrustedPublisher (Join-Path $env:RUNNER_TEMP 'storenova-ci-leaf.cer')
          if ($LASTEXITCODE -ne 0) { throw 'Test publisher trust import failed' }
      - name: Build and verify the Windows ZIP through the release script
        timeout-minutes: 8
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $helperDir = Join-Path $env:RUNNER_TEMP 'storenova-helper'
          $artifact = Join-Path $env:RUNNER_TEMP 'storenova-windows-ci-only.zip'
          $releaseResultText = & ./apps/plugin/scripts/build-signed-windows-package.ps1 -OutputPath $artifact -CertificateThumbprint $env:STORENOVA_WINDOWS_SIGNER_THUMBPRINT -HelperDirectory $helperDir -CiTestCertificate
          $releaseResult = $releaseResultText | ConvertFrom-Json
          if ($releaseResult.release_status -ne 'ci_test_only' -or $releaseResult.ready_to_install -ne $false -or $releaseResult.ci_test_certificate -ne $true) {
            throw 'CI test-certificate output is mislabeled as a releasable package'
          }
          if (-not (Test-Path -LiteralPath "$artifact.sha256" -PathType Leaf)) { throw 'Package checksum is missing' }
      - name: Verify a clean Windows install
        timeout-minutes: 3
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $artifact = Join-Path $env:RUNNER_TEMP 'storenova-windows-ci-only.zip'
            $expectedPackageHash = (Get-Content -LiteralPath "$artifact.sha256" -Raw).Trim()
            $actualPackageHash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash
            if ($expectedPackageHash -ne $actualPackageHash) { throw 'Package checksum does not match the ZIP' }
            $extract = Join-Path $env:RUNNER_TEMP 'storenova-extracted'
            Expand-Archive -LiteralPath $artifact -DestinationPath $extract
            $bundleStatus = Get-Content -LiteralPath (Join-Path $extract 'bundle-status.json') -Raw | ConvertFrom-Json
            if ($bundleStatus.release_status -ne 'ci_test_only' -or $bundleStatus.ready_to_install -ne $false -or $bundleStatus.ci_test_certificate -ne $true) {
              throw 'Archived CI test-certificate package is mislabeled as releasable'
            }
            $sandboxHome = Join-Path $env:RUNNER_TEMP 'storenova-clean-user'
            New-Item -ItemType Directory -Force -Path $sandboxHome | Out-Null
            $env:USERPROFILE = $sandboxHome
            $env:CODEX_HOME = Join-Path $sandboxHome '.codex'
            $env:AGENTS_HOME = Join-Path $sandboxHome '.agents'
            $inputPath = Join-Path $env:RUNNER_TEMP 'storenova-install-input.txt'
            $outputPath = Join-Path $env:RUNNER_TEMP 'storenova-install-output.txt'
            $errorPath = Join-Path $env:RUNNER_TEMP 'storenova-install-error.txt'
            [System.IO.File]::WriteAllText($inputPath, "`n`n", [System.Text.Encoding]::ASCII)
            $installCommand = 'call "' + (Join-Path $extract 'install.cmd') + '"'
            $process = Start-Process -FilePath 'cmd.exe' -ArgumentList @('/d', '/c', $installCommand) -RedirectStandardInput $inputPath -RedirectStandardOutput $outputPath -RedirectStandardError $errorPath -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Packaged installer failed: $((Get-Content -LiteralPath $errorPath -Raw).Trim())" }
            $manifest = Get-Content -LiteralPath (Join-Path $extract '.codex-plugin\plugin.json') -Raw | ConvertFrom-Json
            $installed = Join-Path $env:CODEX_HOME 'plugins\cache\merchant-personal\merchant-marketing\local'
            $installedSource = Join-Path $sandboxHome 'plugins\merchant-marketing'
            $registryPath = Join-Path $env:AGENTS_HOME 'plugins\marketplace.json'
            if (-not (Test-Path -LiteralPath $registryPath -PathType Leaf)) { throw 'Personal plugin marketplace registry is missing' }
            $registry = Get-Content -LiteralPath $registryPath -Raw | ConvertFrom-Json
            $marketplaceEntry = @($registry.plugins | Where-Object { $_.name -eq 'merchant-marketing' })
            if ($registry.name -ne 'merchant-personal' -or $marketplaceEntry.Count -ne 1 -or $marketplaceEntry[0].source.source -ne 'local' -or $marketplaceEntry[0].source.path -ne './plugins/merchant-marketing') {
              throw 'Personal plugin marketplace source does not point to the installed source'
            }
            foreach ($pluginPath in @($installed, $installedSource)) {
              $installedStatus = Get-Content -LiteralPath (Join-Path $pluginPath 'bundle-status.json') -Raw | ConvertFrom-Json
              if ($installedStatus.release_status -ne 'ci_test_only' -or $installedStatus.ready_to_install -ne $false) {
                throw "Installed CI package lost its test-only label: $pluginPath"
              }
              $pluginManifest = Join-Path $pluginPath '.codex-plugin\plugin.json'
              if (-not (Test-Path -LiteralPath $pluginManifest -PathType Leaf)) { throw "Installed plugin manifest is missing: $pluginPath" }
              if ((Get-FileHash -LiteralPath $pluginManifest -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath (Join-Path $extract '.codex-plugin\plugin.json') -Algorithm SHA256).Hash) {
                throw "Installed plugin manifest differs from the package: $pluginPath"
              }
              foreach ($relativePath in @('runtime\node.exe', 'windows\StoreNovaCredentialHelper.exe', 'mcp\bridge.mjs', '.mcp.json')) {
                $installedFile = Join-Path $pluginPath $relativePath
                $packageFile = Join-Path $extract $relativePath
                if (-not (Test-Path -LiteralPath $installedFile -PathType Leaf)) { throw "Installed plugin file is missing: $installedFile" }
                if ((Get-FileHash -LiteralPath $installedFile -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $packageFile -Algorithm SHA256).Hash) {
                  throw "Installed plugin file differs from the package: $installedFile"
                }
              }
            }
            if (-not (Test-Path -LiteralPath (Join-Path $installed 'runtime\node.exe') -PathType Leaf)) { throw 'Bundled Node was not installed' }
            $installedHelper = Join-Path $installed 'windows\StoreNovaCredentialHelper.exe'
            $packageHelper = Join-Path $extract 'windows\StoreNovaCredentialHelper.exe'
            if (-not (Test-Path -LiteralPath $installedHelper -PathType Leaf)) { throw 'Credential helper was not installed' }
            if ((Get-FileHash -LiteralPath $installedHelper -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $packageHelper -Algorithm SHA256).Hash) { throw 'Installed credential helper differs from packaged helper' }
            if ((Get-AuthenticodeSignature -LiteralPath $installedHelper).Status -ne 'Valid') { throw 'Installed credential helper signature is invalid' }
            $mcp = Get-Content -LiteralPath (Join-Path $installed '.mcp.json') -Raw | ConvertFrom-Json
            if ($mcp.mcpServers.'merchant-marketing'.command -ne './runtime/node.exe') { throw 'MCP does not use bundled Node' }
            $config = Get-Content -LiteralPath (Join-Path $env:CODEX_HOME 'config.toml') -Raw
            if ($config -notmatch 'merchant-marketing@merchant-personal' -or $config -notmatch 'enabled = true') { throw 'Plugin was not enabled' }
          } catch {
            Write-Host "::error file=.github/workflows/windows-plugin-package.yml,line=1::INSTALL_$($_.Exception.Message)"
            exit 1
          }
      - name: Verify bundled MCP initialize and tool discovery
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          trap {
            Write-Host "::error file=.github/workflows/windows-plugin-package.yml,line=1::MCP_SMOKE_$($_.Exception.Message)"
            $errorPath = Join-Path $env:RUNNER_TEMP 'mcp-smoke-error.txt'
            if (Test-Path -LiteralPath $errorPath) { Write-Host ((Get-Content -LiteralPath $errorPath -Raw) -replace '[\r\n]+', ' | ') }
            exit 1
          }
          $extract = Join-Path $env:RUNNER_TEMP 'storenova-extracted'
          $manifest = Get-Content -LiteralPath (Join-Path $extract '.codex-plugin\plugin.json') -Raw | ConvertFrom-Json
          $installed = Join-Path (Join-Path $env:RUNNER_TEMP 'storenova-clean-user') '.codex\plugins\cache\merchant-personal\merchant-marketing\local'
          $mcp = Get-Content -LiteralPath (Join-Path $installed '.mcp.json') -Raw | ConvertFrom-Json
          $server = $mcp.mcpServers.'merchant-marketing'
          $node = Join-Path $installed ($server.command -replace '^\./', '')
          $inputPath = Join-Path $env:RUNNER_TEMP 'mcp-smoke-input.jsonl'
          $outputPath = Join-Path $env:RUNNER_TEMP 'mcp-smoke-output.jsonl'
          $errorPath = Join-Path $env:RUNNER_TEMP 'mcp-smoke-error.txt'
          $requests = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize"}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}',
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"onboarding.status","arguments":{}}}'
          ) -join "`n"
          [System.IO.File]::WriteAllText($inputPath, "$requests`n", [System.Text.Encoding]::ASCII)
          $env:NODE_ENV = 'test'
          $env:DEPLOY_ENV = 'local_desktop'
          $process = Start-Process -FilePath $node -ArgumentList (Join-Path $installed 'mcp\bridge.mjs') -WorkingDirectory $installed -RedirectStandardInput $inputPath -RedirectStandardOutput $outputPath -RedirectStandardError $errorPath -Wait -PassThru
          if ($null -ne $process.ExitCode -and $process.ExitCode -ne 0) { throw "Bundled MCP bridge exited $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath $outputPath -PathType Leaf)) { throw 'Bundled MCP bridge produced no response file' }
          $responses = @(Get-Content -LiteralPath $outputPath | Where-Object { $_.Trim() } | ForEach-Object { $_ | ConvertFrom-Json })
          if ($responses.Count -ne 3 -or $responses[0].result.serverInfo.version -ne $manifest.version -or $responses[1].result.tools.Count -lt 1) {
            throw 'Bundled MCP initialize or tool discovery returned an invalid response'
          }
          $names = @($responses[1].result.tools | ForEach-Object { $_.name })
          if ($names -notcontains 'merchant.start' -or $names -notcontains 'merchant.first_value' -or @($names | Where-Object { $_ -like 'ops.*' }).Count -gt 0) {
            throw 'Bundled MCP merchant tool surface is incomplete or exposes ops tools'
          }
          if ($responses[2].result.isError -ne $true -or $responses[2].result.structuredContent.code -ne 'MCP_CONFIGURATION_REQUIRED') {
            throw 'Bundled onboarding.status did not fail closed when connection configuration is missing'
          }
      - name: Verify Credential Manager write
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:RUNNER_TEMP 'storenova-clean-user\.codex\plugins\cache\merchant-personal\merchant-marketing\local\windows\StoreNovaCredentialHelper.exe'
          $request = '{"operation":"write","target":"com.storenova.installation-identity","account":"current-installation","data":"ci-package-smoke"}'
          $inputPath = Join-Path $env:RUNNER_TEMP 'credential-write-request.json'
          $outputPath = Join-Path $env:RUNNER_TEMP 'credential-write-output.txt'
          $errorPath = Join-Path $env:RUNNER_TEMP 'credential-write-error.txt'
          [System.IO.File]::WriteAllText($inputPath, $request, [System.Text.Encoding]::ASCII)
          $process = Start-Process -FilePath $binary -RedirectStandardInput $inputPath -RedirectStandardOutput $outputPath -RedirectStandardError $errorPath -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $diagnostic = (Get-Content -LiteralPath $errorPath -Raw).Trim()
            Write-Host "::error file=.github/workflows/windows-plugin-package.yml,line=1::CREDENTIAL_WRITE_FAILED $diagnostic"
            exit 1
          }
      - name: Verify Credential Manager read
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:RUNNER_TEMP 'storenova-clean-user\.codex\plugins\cache\merchant-personal\merchant-marketing\local\windows\StoreNovaCredentialHelper.exe'
          $request = '{"operation":"read","target":"com.storenova.installation-identity","account":"current-installation"}'
          $inputPath = Join-Path $env:RUNNER_TEMP 'credential-read-request.json'
          $outputPath = Join-Path $env:RUNNER_TEMP 'credential-read-output.txt'
          $errorPath = Join-Path $env:RUNNER_TEMP 'credential-read-error.txt'
          [System.IO.File]::WriteAllText($inputPath, $request, [System.Text.Encoding]::ASCII)
          $process = Start-Process -FilePath $binary -RedirectStandardInput $inputPath -RedirectStandardOutput $outputPath -RedirectStandardError $errorPath -Wait -PassThru
          $read = if (Test-Path -LiteralPath $outputPath) { (Get-Content -LiteralPath $outputPath -Raw).Trim() } else { '' }
          if ($process.ExitCode -ne 0 -or $read -ne 'ci-package-smoke') {
            $diagnostic = if (Test-Path -LiteralPath $errorPath) { (Get-Content -LiteralPath $errorPath -Raw).Trim() } else { '' }
            Write-Host "::error file=.github/workflows/windows-plugin-package.yml,line=1::CREDENTIAL_READ_FAILED $diagnostic"
            exit 1
          }
          Write-Host 'Windows package build, bundled install, MCP runtime, and Credential Manager passed.'
      - name: Verify a realistic credential bundle through installed Node and helper
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installed = Join-Path $env:RUNNER_TEMP 'storenova-clean-user\.codex\plugins\cache\merchant-personal\merchant-marketing\local'
          $node = Join-Path $installed 'runtime\node.exe'
          $module = Join-Path $installed 'mcp\windows-credential.mjs'
          $script = Join-Path $env:RUNNER_TEMP 'storenova-credential-bundle-smoke.mjs'
          @'
          import { pathToFileURL } from 'node:url'
          const { writeWindowsCredential, readWindowsCredential } = await import(pathToFileURL(process.argv[2]).href)
          const binding = { apiOrigin: 'https://yxsona.com', workspaceId: 'ws_ci_bundle' }
          const bundle = { schema_version: '1', api_origin: binding.apiOrigin, workspace_id: binding.workspaceId,
            access_token: 'a'.repeat(900), refresh_token: 'r'.repeat(900), expires_at: '2030-01-01T00:00:00.000Z' }
          writeWindowsCredential(binding, bundle)
          const stored = readWindowsCredential(binding)
          if (stored.access_token !== bundle.access_token || stored.refresh_token !== bundle.refresh_token) process.exit(1)
          '@ | Set-Content -LiteralPath $script -Encoding Ascii
          & $node $script $module
          if ($LASTEXITCODE -ne 0) { Write-Host '::error file=.github/workflows/windows-plugin-package.yml,line=1::CREDENTIAL_BUNDLE_ROUNDTRIP_FAILED'; exit 1 }
