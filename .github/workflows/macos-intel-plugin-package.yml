name: macos-intel-plugin-package

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-plugin-bundle
    paths:
      - '.github/workflows/macos-intel-plugin-package.yml'
      - 'apps/plugin/**'
      - 'release-metadata.json'

permissions:
  contents: read

jobs:
  macos-intel-package-smoke:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - name: Check out the tested commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(node -p 'process.platform + "/" + process.arch')" = darwin/x64
      - name: Build the Intel package with its bundled runtime and Keychain helper
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/merchant-marketing-darwin-x64-ci.tar.gz"
          node apps/plugin/scripts/package-local-plugin.mjs "$artifact" > "$RUNNER_TEMP/package-metadata.json"
          node -e '
            const p = require(process.argv[1]);
            if (p.platform !== "darwin" || p.architecture !== "x64" ||
                p.release_status !== "unsigned_candidate" || p.ready_to_install !== false) process.exit(1);
          ' "$RUNNER_TEMP/package-metadata.json"
          tar -xzf "$artifact" -C "$RUNNER_TEMP" \
            runtime/node mcp/keychain-credential-helper mcp/keychain-credential-helper.build.json
          test "$(lipo -archs "$RUNNER_TEMP/runtime/node")" = x86_64
          test "$(lipo -archs "$RUNNER_TEMP/mcp/keychain-credential-helper")" = x86_64
          xcrun vtool -show-build "$RUNNER_TEMP/runtime/node" | grep -q 'minos 11.0'
          xcrun vtool -show-build "$RUNNER_TEMP/mcp/keychain-credential-helper" | grep -q 'minos 11.0'
          shasum -a 256 "$artifact" > "$artifact.sha256"
      - name: Verify clean install and bundled MCP discovery
        shell: bash
        run: |
          set -euo pipefail
          extracted="$RUNNER_TEMP/storenova-package"
          home="$RUNNER_TEMP/storenova-clean-home"
          mkdir -p "$extracted" "$home"
          tar -xzf "$RUNNER_TEMP/merchant-marketing-darwin-x64-ci.tar.gz" -C "$extracted"
          export HOME="$home" CODEX_HOME="$home/.codex" AGENTS_HOME="$home/.agents"
          export PATH=/usr/bin:/bin
          sh "$extracted/install.sh"
          installed="$home/plugins/merchant-marketing"
          cache="$home/.codex/plugins/cache/merchant-personal/merchant-marketing/local"
          test -x "$installed/runtime/node"
          test -x "$installed/mcp/keychain-credential-helper"
          test -x "$cache/runtime/node"
          test -x "$cache/mcp/keychain-credential-helper"
          grep -q 'enabled = true' "$home/.codex/config.toml"
          test "$("$cache/runtime/node" -p 'process.platform + "/" + process.arch')" = darwin/x64
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' |
            NODE_ENV=test DEPLOY_ENV=local_desktop "$cache/runtime/node" "$cache/mcp/bridge.mjs" > "$RUNNER_TEMP/mcp-responses.jsonl"
          "$cache/runtime/node" -e '
            const fs = require("node:fs");
            const lines = fs.readFileSync(process.argv[1], "utf8").trim().split("\n").map(JSON.parse);
            const manifest = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            if (lines.length !== 2 || lines[0]?.result?.serverInfo?.version !== manifest.version ||
                !Array.isArray(lines[1]?.result?.tools) || lines[1].result.tools.length === 0) process.exit(1);
          ' "$RUNNER_TEMP/mcp-responses.jsonl" "$cache/.codex-plugin/plugin.json"
      - name: Keep the verified CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: merchant-marketing-darwin-x64-ci
          path: |
            ${{ runner.temp }}/merchant-marketing-darwin-x64-ci.tar.gz
            ${{ runner.temp }}/merchant-marketing-darwin-x64-ci.tar.gz.sha256
          retention-days: 7
