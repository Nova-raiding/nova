      - name: Run mandatory authorization PostgreSQL acceptance
        env:
          PERSISTENCE_RELEASE_DATABASE_URL: postgres://merchant:merchant@127.0.0.1:5432/merchant
        run: npm run test:authorization-postgres
      - name: Verify authorization execution denominator and retain raw report in CI logs
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { resolve } from 'node:path'
          const command = JSON.parse(readFileSync('package.json', 'utf8')).scripts['test:authorization-postgres']
          const expected = command.split(/\s+/u).filter(path => path.endsWith('.test.ts')).map(path => resolve(path)).sort()
          const rawReport = readFileSync('artifacts/authorization-postgres/vitest.json', 'utf8')
          // This suite uses only isolated synthetic fixtures. Keep failures and skips visible.
          process.stdout.write(rawReport + '\n')
          const report = JSON.parse(rawReport)
          const actual = report.testResults.map(file => resolve(file.name)).sort()
          assert.equal(expected.length, 5, 'five authorization PostgreSQL files are mandatory')
          assert.deepEqual(actual, expected, 'authorization test file set mismatch')
          for (const file of report.testResults) {
            assert.ok(file.assertionResults.length > 0, `empty test file: ${file.name}`)
            assert.ok(file.assertionResults.every(test => test.status === 'passed'), `failed or unexecuted assertion: ${file.name}`)
          }
          assert.equal(report.success, true)
          NODE
      - run: npm run test:load
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npm run infra:validate
      - working-directory: demo/merchant-studio
        run: npm ci && npm run build
