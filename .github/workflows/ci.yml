name: merchant-marketing-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: merchant
          POSTGRES_PASSWORD: merchant
          POSTGRES_DB: merchant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merchant -d merchant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
      - run: npm ci
      - name: Install PostgreSQL 17 client for schema-dump acceptance
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/postgresql.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && printf '%s' \"$VERSION_CODENAME\")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Install desktop browser for real form regression
        run: npx playwright install --with-deps chrome
      - name: Install checksum-pinned kustomize
        env:
          KUSTOMIZE_VERSION: v5.8.1
          KUSTOMIZE_LINUX_AMD64_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
        run: |
          archive="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "/tmp/${archive}" "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/${archive}"
          echo "${KUSTOMIZE_LINUX_AMD64_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          sudo tar -xzf "/tmp/${archive}" -C /usr/local/bin kustomize
          kustomize version
      - run: npm run check
      - name: Run explicit repository release gates
        run: npm run test:release-gates
      - name: Prepare isolated PostgreSQL acceptance images
        run: |
          docker pull postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          docker pull redis:7-alpine
      - name: Run audited PostgreSQL files in owned disposable containers
        run: npm run test:postgres:isolated
      - name: Create isolated PostgreSQL migration databases
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U merchant legacy_backfill_test
          docker exec "${{ job.services.postgres.id }}" createdb -U merchant model_budget_test
      - name: Bootstrap non-superuser application role
        run: >-
          docker exec -i "${{ job.services.postgres.id }}"
          psql -v ON_ERROR_STOP=1 -U merchant -d merchant
          < infra/local/ensure-app-role.sql
      - name: Run PostgreSQL migration acceptance tests without skips
        env:
          PG_DUMP_BIN: /usr/lib/postgresql/17/bin/pg_dump
          LEGACY_BACKFILL_DATABASE_URL: postgres://merchant:merchant@127.0.0.1:5432/legacy_backfill_test
          WORKSPACE_CATALOG_DATABASE_URL: postgres://merchant:merchant@127.0.0.1:5432/merchant
          MODEL_BUDGET_DATABASE_URL: postgres://merchant:merchant@127.0.0.1:5432/model_budget_test
          BRAND_CANONICAL_DATABASE_URL: postgres://merchant:merchant@127.0.0.1:5432/merchant
          WORKSPACE_BOOTSTRAP_DATABASE_URL: postgres://merchant:merchant@127.0.0.1:5432/merchant
          PERSISTENCE_RELEASE_DATABASE_URL: postgres://merchant:merchant@127.0.0.1:5432/merchant
          PLATFORM_MEDIA_SPEC_DATABASE_URL: postgres://merchant:merchant@127.0.0.1:5432/merchant
          ASSET_PARSE_DATABASE_URL: postgres://merchant:merchant@127.0.0.1:5432/merchant
          STORAGE_QUOTA_DATABASE_URL: postgres://merchant:merchant@127.0.0.1:5432/merchant
