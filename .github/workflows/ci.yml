name: merchant-marketing-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:load
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npm run infra:validate
      - working-directory: demo/merchant-studio
        run: npm ci && npm run build
