    app_secret: "${SECRET:DOUYIN_APP_SECRET}"
    oauth_callback_url: "https://merchant.example.com/v1/oauth/callback/douyin"
    webhook_url: "https://merchant.example.com/v1/webhooks/platform/douyin"
    approved_scopes: ["SET_FROM_DOUYIN_APP_CONSOLE"]
    test_store_ids: ["SET_DOUYIN_TEST_STORE_ID"]
    api_environment: production
    capability_evidence_status: blocked_until_production_canary
