# 商家营销内容助手生产配置参考（仅字段契约，不得填写或提交真实密钥）
schema_version: "2"

release:
  environment: production
  capacity_profile: pilot_50
  capacity_profile_note: "首期按 50 个并发工作区采购；扩容到 100/250/500 时使用同一架构并调整副本、数据库、连接和配额"
  region: cn
  release_id: "merchant-plugin-1.4.0"
  plugin_version: "1.4.0"
  mcp_version: "1.4.0"
  schema_version: "1.1.0"
  connector_contract_version: "1.1.0"
  minimum_codex_app_version: "SET_FROM_OFFICIAL_COMPATIBILITY_TEST"

codex:
  plugin_id: "SET_AT_PLUGIN_REGISTRATION"
  manifest_path: ".codex-plugin/plugin.json"
  entry_skill: "merchant-marketing"
  skill_versions:
    platform_connect: "1.0.0"
    brand_profile: "1.0.0"
    product_catalog: "1.0.0"
    campaign_intake: "1.0.0"
    creative_copy: "1.0.0"
    review_delivery: "1.0.0"
  mcp:
    # Root origin only. The ChatGPT/Codex bridge appends /mcp itself.
    base_url: "https://merchant.example.com"
    auth_audience: "merchant-marketing-mcp"
    auth_mode: "oidc_gateway_hmac"
    auth_grants_secret_ref: "secret/merchant-marketing/api-auth-tokens"
    oidc_proxy_signing_secret_ref: "secret/merchant-marketing/oidc-proxy-signing-secret"
    require_workspace_header: true
    request_timeout_seconds: 30
    health_path: "/healthz"

auth:
  merchant_bearer_hostname: "merchant.example.com"
  auth_enforcement: strict
  mcp_authorization_mode: enforce
  durable_platform_assignments_required: true
  session_id_hash_secret_ref: "vault://merchant-identity/session-id-hash-secret"

public_endpoints:
  app_base_url: "https://merchant.example.com"
  # Independent OIDC-only desktop operations origin; do not expose /mcp here.
  ops_base_url: "https://ops.merchant.example.com"
  oauth_callback_base_url: "https://merchant.example.com/v1/oauth/callback"
  webhook_base_url: "https://merchant.example.com/v1/webhooks/platform"
  allowed_origins:
    - "https://merchant.example.com"

payments:
  # The API maps these rendered values to the provider adapter, checkout URL,
  # callback verifier, reconciliation and refund controls. Fixture payment is
  # never allowed by the production gate.
  payment_mode: "provider"
  payment_provider_adapters: "alipay,wechat"
  payment_checkout_base_url: "https://payments.example.com/checkout"
  # Server-side checkout adapter. The API calls this endpoint to create the
  # actual Alipay/WeChat order; it never constructs a fake payment URL.
  payment_provider_checkout_api_url: "https://payments.example.com/v1/checkout"
  payment_provider_query_api_url: "https://payments.example.com/v1/query"
  payment_provider_refund_api_url: "https://payments.example.com/v1/refund"
  payment_provider_api_key_ref: "vault://merchant-payment/provider-api-key"
  payment_provider_merchant_id: "merchant-example"
  payment_callback_base_url: "https://merchant.example.com/v1"
  payment_callback_secret_ref: "vault://merchant-payment-callback"
  payment_reconciliation_enabled: true
  payment_refund_enabled: true

runtime:
  merchant_ui_api_token_ref: "vault://merchant-ui/api-token"
  asset_scanner:
    # Identity and definition-floor values are release configuration, not
    # secrets. Authentication and receipt keys remain Secret/Vault references.
    service_id: "merchant-asset-scanner-production"
    approved_service_ids: ["merchant-asset-scanner-production"]
    minimum_definitions_version: 28000
    minimum_ready_replicas: 2
    api_token_ref: "vault://merchant-scanner/api-token"
    workspace_signing_secret_ref: "vault://merchant-scanner/workspace-signing-secret"
    trusted_public_keys_ref: "vault://merchant-scanner/trusted-public-keys"
  edge:
    managed_dns_enabled: true
    tls_enabled: true
    waf_enabled: true
    load_balancer_enabled: true
    minimum_concurrent_connections: 150
    request_body_limit_mb: 50
  mcp_api:
    stateless: true
    sticky_sessions_enabled: false
    cpu_cores_per_replica: 2
    memory_gb_per_replica: 4
    minimum_replicas: 3
    maximum_replicas: 12
    target_cpu_percent: 60
    scale_out_p95_latency_ms: 800
    scale_out_concurrent_connections_per_replica: 100
  worker_pools:
    sync:
      cpu_cores_per_replica: 2
      memory_gb_per_replica: 4
      minimum_replicas: 2
      maximum_replicas: 12
      scale_metric: oldest_job_age_and_queue_depth
    generation:
      cpu_cores_per_replica: 2
      memory_gb_per_replica: 4
      minimum_replicas: 2
      maximum_replicas: 16
      scale_metric: oldest_job_age_and_provider_quota
    publish:
      cpu_cores_per_replica: 1
      memory_gb_per_replica: 2
      minimum_replicas: 3
      maximum_replicas: 8
      scale_metric: oldest_job_age_and_platform_quota
    reconcile:
      cpu_cores_per_replica: 1
      memory_gb_per_replica: 2
      minimum_replicas: 2
      maximum_replicas: 4
      scale_metric: unknown_job_age_and_queue_depth

platforms:
  jd:
    auth_enabled: false
    read_enabled: false
    write_enabled: false
    app_key: "${SECRET:JD_APP_KEY}"
    app_secret: "${SECRET:JD_APP_SECRET}"
    oauth_callback_url: "https://merchant.example.com/v1/oauth/callback/jd"
    webhook_url: "https://merchant.example.com/v1/webhooks/platform/jd"
    approved_scopes: ["SET_FROM_JD_APP_CONSOLE"]
    test_store_ids: ["SET_TEST_STORE_ID"]
    api_environment: production
    requests_per_second: "SET_FROM_APPROVED_QUOTA"
    aggregate_quota_capacity_status: "BLOCKED_UNTIL_VERIFIED_FOR_500_MERCHANT_MODEL"
    aggregate_quota_evidence_url: "SET_FROM_CAPABILITY_EVIDENCE"
    category_mapping_version: "jd-apparel-1.0.0"
    rule_pack_version: "jd-apparel-1.0.0"
    write_policy_version: "jd-apparel-write-1.0.0"
    default_update_fields: ["title", "selling_points", "detail", "supported_image_references"]
    prefer_draft_on_create: true
    high_impact_fields_require_extra_confirmation: ["category", "sku", "price", "inventory", "listing_status"]

  taobao_tmall:
    auth_enabled: false
    read_enabled: false
    write_enabled: false
    app_key: "${SECRET:TAOBAO_APP_KEY}"
    app_secret: "${SECRET:TAOBAO_APP_SECRET}"
    oauth_callback_url: "https://merchant.example.com/v1/oauth/callback/taobao"
    webhook_url: "https://merchant.example.com/v1/webhooks/platform/taobao"
    approved_scopes: ["SET_FROM_TAOBAO_APP_CONSOLE"]
    test_store_ids: ["SET_TEST_STORE_ID"]
    api_environment: production
    requests_per_second: "SET_FROM_APPROVED_QUOTA"
    aggregate_quota_capacity_status: "BLOCKED_UNTIL_VERIFIED_FOR_500_MERCHANT_MODEL"
    aggregate_quota_evidence_url: "SET_FROM_CAPABILITY_EVIDENCE"
    category_mapping_versions:
      taobao: "taobao-apparel-1.0.0"
      tmall: "tmall-apparel-1.0.0"
    rule_pack_versions:
      taobao: "taobao-apparel-1.0.0"
      tmall: "tmall-apparel-1.0.0"
    write_policy_versions:
      taobao: "taobao-apparel-write-1.0.0"
      tmall: "tmall-apparel-write-1.0.0"
    default_update_fields: ["title", "selling_points", "detail", "supported_image_references"]
    prefer_draft_on_create: true
    high_impact_fields_require_extra_confirmation: ["category", "sku", "price", "inventory", "listing_status"]

  tmall:
    auth_enabled: false
    read_enabled: false
    write_enabled: false
    app_key: "${SECRET:TMALL_APP_KEY}"
    app_secret: "${SECRET:TMALL_APP_SECRET}"
    oauth_callback_url: "https://merchant.example.com/v1/oauth/callback/tmall"
    webhook_url: "https://merchant.example.com/v1/webhooks/platform/tmall"
    approved_scopes: ["SET_FROM_TMALL_APP_CONSOLE"]
    test_store_ids: ["SET_TEST_STORE_ID"]
    api_environment: production
    requests_per_second: "SET_FROM_APPROVED_QUOTA"
    aggregate_quota_capacity_status: "BLOCKED_UNTIL_VERIFIED_FOR_500_MERCHANT_MODEL"
    aggregate_quota_evidence_url: "SET_FROM_CAPABILITY_EVIDENCE"
    category_mapping_version: "tmall-apparel-1.0.0"
    rule_pack_version: "tmall-apparel-1.0.0"
    write_policy_version: "tmall-apparel-write-1.0.0"
    default_update_fields: ["title", "selling_points", "detail", "supported_image_references"]
    prefer_draft_on_create: true
    high_impact_fields_require_extra_confirmation: ["category", "sku", "price", "inventory", "listing_status"]

  pinduoduo:
    auth_enabled: false
    read_enabled: false
    write_enabled: false
    client_id: "${SECRET:PDD_CLIENT_ID}"
    client_secret: "${SECRET:PDD_CLIENT_SECRET}"
    oauth_callback_url: "https://merchant.example.com/v1/oauth/callback/pinduoduo"
    webhook_url: "https://merchant.example.com/v1/webhooks/platform/pinduoduo"
    approved_scopes: ["SET_FROM_PDD_APP_CONSOLE"]
    test_store_ids: ["SET_TEST_STORE_ID"]
    api_environment: production
    requests_per_second: "SET_FROM_APPROVED_QUOTA"
    aggregate_quota_capacity_status: "BLOCKED_UNTIL_VERIFIED_FOR_500_MERCHANT_MODEL"
