server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Resolve the service name at request time. Compose/Kubernetes may replace
  # the API container or pod without restarting this long-lived UI container.
  resolver ${MERCHANT_API_RESOLVER} valid=10s ipv6=off;
  set $merchant_api_host merchant-api;

  # The UI is built with VITE_API_BASE_URL=/api. Keep the browser same-origin
  # while forwarding the prefix-stripped request to the API container.
  location /api/ {
    # Use the stable API service name shared by Kubernetes and Compose. Compose
    # adds this name as a network alias for its local `api` service.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$merchant_api_host:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The entrypoint injects this opaque runtime secret. It must never be
    # committed into the image or browser bundle.
    proxy_set_header Authorization "Bearer ${MERCHANT_API_TOKEN}";
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
