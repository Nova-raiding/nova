server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The SPA shell must never survive a rollout in browser cache. Hashed assets
  # remain cacheable, while root and client-side routes always revalidate the
  # current index so they cannot boot an obsolete API configuration.
  location = / {
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ @merchant_spa;
  }

  location @merchant_spa {
    add_header Cache-Control "no-store" always;
    rewrite ^ /index.html break;
  }

  # Resolve the service name at request time. Compose/Kubernetes may replace
  # the API container or pod without restarting this long-lived UI container.
  resolver ${MERCHANT_API_RESOLVER} valid=10s ipv6=off;
  set $merchant_api_host merchant-api;

  # Static HTML alone is not readiness. Keep the UI out of service until the
  # production API upstream is reachable on the same Docker/Kubernetes network.
  location = /readyz {
    proxy_pass http://$merchant_api_host:8787/readyz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # The UI is built with VITE_API_BASE_URL=/api. Keep the browser same-origin
  # while forwarding the prefix-stripped request to the API container.
  location /api/ {
    # Use the stable API service name shared by Kubernetes and Compose. Compose
    # adds this name as a network alias for its local `api` service.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$merchant_api_host:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Workspace-Id "${MERCHANT_WORKSPACE_ID}";
    proxy_set_header X-Ops-Workbench "workspace";
    # Browser authentication uses the API-issued HttpOnly damai_session.
    # Do not overwrite it with the local fixture bearer: doing so makes a
    # successful merchant login look accepted while requests still execute
    # as the injected demo identity.
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
