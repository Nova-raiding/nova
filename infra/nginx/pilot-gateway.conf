server {
  listen 8080;
  server_name _;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  location = /readyz {
    proxy_pass http://ui:8080/readyz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # The operations console is built with /ops/ as its public base. The
  # upstream receives the path without the external prefix and keeps its own
  # API proxy/authentication behavior intact.
  location ^~ /ops/ {
    proxy_pass http://ops-ui:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Actor-Id $http_x_actor_id;
    proxy_set_header X-Ops-Workbench $http_x_ops_workbench;
    proxy_set_header X-Workspace-Id $http_x_workspace_id;
  }

  location = /ops {
    return 308 /ops/;
  }

  location / {
    proxy_pass http://ui:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
