# Docker Compose can replace a service container without restarting this
# gateway. Resolve service names continuously so a new container IP does not
# leave the public entrypoint returning 502 until nginx is reloaded manually.
upstream pilot_api {
  zone pilot_api 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server merchant-production-api-replica-1:8787 resolve;
}

upstream pilot_ui {
  zone pilot_ui 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server storenova-demo-ui-e0:8080 resolve;
}

upstream pilot_ops_ui {
  zone pilot_ops_ui 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server local-ops-ui-1:8080 resolve;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  location = /readyz {
    proxy_pass http://pilot_ui/readyz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Release identity is an API attestation endpoint. Keep it out of the SPA
  # fallback so deployment and canary checks receive JSON release metadata.
  location = /releasez {
    proxy_pass http://pilot_api/releasez;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # OpenAI Apps domain verification is an exact public challenge path. The
  # API returns the configured token (or an explicit 503 when unset); never
  # serve it from the merchant UI fallback.
  location = /.well-known/openai-apps-challenge {
    proxy_pass http://pilot_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # The operations console is built with /ops/ as its public base. The
  # upstream receives the path without the external prefix and keeps its own
  # API proxy/authentication behavior intact.
  location = /mcp {
    client_max_body_size 70m;
    proxy_pass http://pilot_api/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Actor-Id $http_x_actor_id;
    proxy_set_header X-Ops-Workbench $http_x_ops_workbench;
    proxy_set_header X-Workspace-Id $http_x_workspace_id;
    proxy_pass_request_headers on;
  }

  location = /ops/api/mcp {
    client_max_body_size 70m;
    proxy_pass http://pilot_ops_ui/api/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Actor-Id $http_x_actor_id;
    proxy_set_header X-Ops-Workbench $http_x_ops_workbench;
    proxy_set_header X-Workspace-Id $http_x_workspace_id;
  }

  location = /ops/api/v1/assets/upload {
    client_max_body_size 70m;
    proxy_pass http://pilot_ops_ui/api/v1/assets/upload;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Actor-Id $http_x_actor_id;
    proxy_set_header X-Ops-Workbench $http_x_ops_workbench;
    proxy_set_header X-Workspace-Id $http_x_workspace_id;
    proxy_pass_request_headers on;
  }

  location ^~ /ops/ {
    client_max_body_size 1m;
    proxy_pass http://pilot_ops_ui/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Actor-Id $http_x_actor_id;
    proxy_set_header X-Ops-Workbench $http_x_ops_workbench;
    proxy_set_header X-Workspace-Id $http_x_workspace_id;
  }

  location = /ops {
    return 308 /ops/;
  }

  # API/MCP callers must reach the API directly. Routing /api through the
  # Merchant UI causes its browser proxy to replace the caller Authorization
  # header with MERCHANT_API_TOKEN, collapsing platform and workspace
  # identities into the demo workspace.
  location = /api/mcp {
    client_max_body_size 70m;
    proxy_pass http://pilot_api/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Actor-Id $http_x_actor_id;
    proxy_set_header X-Ops-Workbench $http_x_ops_workbench;
    proxy_set_header X-Workspace-Id $http_x_workspace_id;
    proxy_pass_request_headers on;
  }

  location = /v1/assets/upload {
    client_max_body_size 70m;
    proxy_pass http://pilot_api/v1/assets/upload;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Actor-Id $http_x_actor_id;
    proxy_set_header X-Ops-Workbench $http_x_ops_workbench;
    proxy_set_header X-Workspace-Id $http_x_workspace_id;
    proxy_pass_request_headers on;
  }
  location = /api/v1/assets/upload {
    client_max_body_size 70m;
    proxy_pass http://pilot_api/v1/assets/upload;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Actor-Id $http_x_actor_id;
    proxy_set_header X-Ops-Workbench $http_x_ops_workbench;
    proxy_set_header X-Workspace-Id $http_x_workspace_id;
    proxy_pass_request_headers on;
  }

  location ^~ /api/ {
    client_max_body_size 1m;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://pilot_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Actor-Id $http_x_actor_id;
    proxy_set_header X-Ops-Workbench $http_x_ops_workbench;
    proxy_set_header X-Workspace-Id $http_x_workspace_id;
    proxy_pass_request_headers on;
  }

  location / {
    proxy_pass http://pilot_ui;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
