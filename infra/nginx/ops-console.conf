server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  # Static liveness above is intentionally cheap. Readiness must prove that
  # the API upstream is accepting traffic before this privileged console is
  # considered ready by the scheduler.
  resolver ${OPS_API_RESOLVER} valid=10s ipv6=off;
  set $ops_api_upstream ${OPS_API_UPSTREAM};
  location = /readyz {
    proxy_pass $ops_api_upstream/readyz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass_request_headers on;
  }

  # Optional same-origin API contract. OPS_API_UPSTREAM is a non-secret
  # service URL expanded by the nginx image entrypoint. Authentication remains
  # the browser's OIDC session; this proxy never injects Authorization/token.
  location /api/ {
    # Variable proxy_pass does not apply the URI replacement that the static
    # form used to provide, so strip the browser-only /api prefix explicitly.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $ops_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_request_headers on;
  }

  location ~* \.(?:css|js|map|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    try_files $uri =404;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store" always;
  }
}
