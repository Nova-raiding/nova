map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# The UI, API, and payment containers are replaced independently during a
# rollout. Docker's embedded DNS must be consulted after startup; otherwise
# nginx keeps the old container IP and the public route returns 502.
upstream pilot_api {
  zone pilot_api 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server api:8787 resolve;
}

upstream pilot_ui {
  zone pilot_ui 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server ui:8080 resolve;
}

upstream pilot_ops_ui {
  zone pilot_ops_ui 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server ops-ui:8080 resolve;
}

upstream pilot_payment_gateway {
  zone pilot_payment_gateway 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server payment-gateway:8790 resolve;
}

server {
  listen 8080;
  server_name yxsona.com www.yxsona.com admin.yxsona.com ops.yxsona.com _;
  server_tokens off;

  # Let’s Encrypt HTTP-01 validation. Challenge files are injected only while
  # issuing or renewing certificates; all other HTTP traffic stays redirected.
  location ^~ /.well-known/acme-challenge/ {
    root /tmp/acme;
    default_type text/plain;
  }

  location = /healthz {
    access_log off;
    return 308 https://$host/healthz;
  }

  location = /readyz { return 308 https://$host/readyz; }
  location = /ops { return 308 https://$host/ops/; }
  location / { return 308 https://$host$request_uri; }
}

server {
  listen 8443 ssl;
  server_name alerts.yxsona.com;
  server_tokens off;
  port_in_redirect off;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # The alert receiver is an optional compose profile. Resolve it only when a
  # signed webhook actually arrives so a disabled receiver cannot prevent the
  # public gateway from starting.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $alert_receiver_upstream http://alert-receiver:8791;
  client_max_body_size 256k;

  location = /internal/v1/alerts {
    limit_except POST { deny all; }
    proxy_pass $alert_receiver_upstream;
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass_request_headers on;
  }

  # Health and readiness remain private container/Kubernetes probes. No SPA,
  # API, or default-host fallback is reachable through the alert origin.
  location / { return 404; }
}

server {
  listen 8443 ssl;
  server_name yxsona.com www.yxsona.com admin.yxsona.com ops.yxsona.com;
  server_tokens off;
  # The container listens on 8443 internally but is published as 443. Never
  # expose the internal listener in nginx-generated redirects.
  port_in_redirect off;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  # Keep the public API health probe available to load balancers and HEAD checks.
  location = /v1/healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  # OAuth discovery must be served by the API, not the merchant SPA. ChatGPT
  # fetches these documents before it can start account linking.
  location = /.well-known/oauth-protected-resource {
    proxy_pass http://pilot_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /.well-known/oauth-authorization-server {
    proxy_pass http://pilot_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # OpenAI Apps domain verification is an exact public challenge path. The
  # API returns the configured token (or an explicit 503 when unset); never
  # serve it from the merchant UI fallback.
  location = /.well-known/openai-apps-challenge {
    proxy_pass http://pilot_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Keep canonical legal/support URLs on the public TLS origin. Without
  # these exact matches the UI's own nginx fallback can emit an internal
  # :8080 redirect for the no-slash variants.
  location = /privacy { return 308 https://$host/privacy/; }
  location = /terms { return 308 https://$host/terms/; }
  location = /support { return 308 https://$host/support/; }

  location = /oauth/authorize {
    proxy_pass http://pilot_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
  }

  location = /oauth/token {
    proxy_pass http://pilot_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /readyz {
    proxy_pass http://pilot_ui/readyz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }


  # Release identity is an API attestation endpoint. Keep it out of the SPA
  # fallback so deployment and canary checks receive JSON release metadata.
  location = /releasez {
    proxy_pass http://api:8787/releasez;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Public plugin/API contract. The plugin is configured with the root origin
  # and calls /mcp itself; keep the REST surface available at /v1/* as well.
  location = /mcp {
    proxy_pass http://pilot_api/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Actor-Id $http_x_actor_id;
    proxy_set_header X-Ops-Workbench $http_x_ops_workbench;
    proxy_set_header X-Workspace-Id $http_x_workspace_id;
    # The public ChatGPT MCP host is OAuth-only. A bad or expired OAuth token
    # must never fall back to the legacy static API_AUTH_TOKENS mapping.
    proxy_set_header X-MCP-OAuth-Required "true";
    proxy_pass_request_headers on;
  }

  location ^~ /v1/ {
    proxy_pass http://pilot_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Actor-Id $http_x_actor_id;
    proxy_set_header X-Ops-Workbench $http_x_ops_workbench;
    proxy_set_header X-Workspace-Id $http_x_workspace_id;
    proxy_pass_request_headers on;
  }

  location ^~ /payment-gateway/ {
    rewrite ^/payment-gateway/(.*)$ /$1 break;
    proxy_pass http://pilot_payment_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }

  location ^~ /ops/ {
    proxy_pass http://pilot_ops_ui/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Actor-Id $http_x_actor_id;
    proxy_set_header X-Ops-Workbench $http_x_ops_workbench;
    proxy_set_header X-Workspace-Id $http_x_workspace_id;
  }

  location ^~ /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://pilot_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Actor-Id $http_x_actor_id;
    proxy_set_header X-Ops-Workbench $http_x_ops_workbench;
    proxy_set_header X-Workspace-Id $http_x_workspace_id;
    proxy_pass_request_headers on;
  }

  location / {
    # The platform console is built under /ops/. Keep that canonical base on
    # its dedicated host while the root/admin hosts continue to serve the
    # merchant/plugin UI.
    if ($host = ops.yxsona.com) {
      return 302 https://$host/ops/overview;
    }
    proxy_pass http://pilot_ui;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
