# Isolated production-shape simulation. It deliberately uses a fresh volume
# so a full developer volume cannot hide application startup regressions.
services:
  postgres:
    ports: !reset []
    volumes:
      - merchant-release-sim-postgres:/var/lib/postgresql/data
  redis:
    ports: !reset []
  api:
    ports: !override ["127.0.0.1:8787:8787"]
    environment:
      LOCAL_COMPOSE: "false"
      CONNECTOR_FIXTURE_MODE: "false"
      ALLOW_LOCAL_DURABLE_OBJECT_STORAGE: "false"
      ALLOW_LOCAL_PAYMENT_FIXTURE: "false"
      RUN_MIGRATIONS_ON_STARTUP: "false"
      DB_POOL_MAX: 10
      OPS_DB_POOL_MAX: 3
      ALLOW_WILDCARD_WORKSPACE_GRANT: "false"
      API_AUTH_TOKENS: '{"${RELEASE_SIM_MERCHANT_API_TOKEN:?RELEASE_SIM_MERCHANT_API_TOKEN is required}":{"workspaces":["ws_demo"],"actor_id":"support_demo","roles":["support"]}}'
      OPS_AUTH_MODE: oidc
      MERCHANT_BEARER_HOSTNAME: 127.0.0.1
      SESSION_ID_HASH_SECRET: ${RELEASE_SIM_SESSION_ID_HASH_SECRET:?RELEASE_SIM_SESSION_ID_HASH_SECRET is required}
      OIDC_PROXY_SIGNING_SECRET: ${RELEASE_SIM_OIDC_SIGNING_SECRET:?RELEASE_SIM_OIDC_SIGNING_SECRET is required}
      WORKER_API_CREDENTIALS: '{"sync":{"token":"${RELEASE_SIM_WORKER_SYNC_API_TOKEN:?RELEASE_SIM_WORKER_SYNC_API_TOKEN is required}","signing_secret":"${RELEASE_SIM_WORKER_SYNC_SIGNING_SECRET:?RELEASE_SIM_WORKER_SYNC_SIGNING_SECRET is required}"},"generation":{"token":"${RELEASE_SIM_WORKER_GENERATION_API_TOKEN:?RELEASE_SIM_WORKER_GENERATION_API_TOKEN is required}","signing_secret":"${RELEASE_SIM_WORKER_GENERATION_SIGNING_SECRET:?RELEASE_SIM_WORKER_GENERATION_SIGNING_SECRET is required}"},"publish":{"token":"${RELEASE_SIM_WORKER_PUBLISH_API_TOKEN:?RELEASE_SIM_WORKER_PUBLISH_API_TOKEN is required}","signing_secret":"${RELEASE_SIM_WORKER_PUBLISH_SIGNING_SECRET:?RELEASE_SIM_WORKER_PUBLISH_SIGNING_SECRET is required}"},"reconcile":{"token":"${RELEASE_SIM_WORKER_RECONCILE_API_TOKEN:?RELEASE_SIM_WORKER_RECONCILE_API_TOKEN is required}","signing_secret":"${RELEASE_SIM_WORKER_RECONCILE_SIGNING_SECRET:?RELEASE_SIM_WORKER_RECONCILE_SIGNING_SECRET is required}"},"automation":{"token":"${RELEASE_SIM_WORKER_AUTOMATION_API_TOKEN:?RELEASE_SIM_WORKER_AUTOMATION_API_TOKEN is required}","signing_secret":"${RELEASE_SIM_WORKER_AUTOMATION_SIGNING_SECRET:?RELEASE_SIM_WORKER_AUTOMATION_SIGNING_SECRET is required}"}}'
      RELEASE_ID: ${RELEASE_SIM_RELEASE_ID:?RELEASE_SIM_RELEASE_ID is required}
      RELEASE_GIT_SHA: ${RELEASE_SIM_RELEASE_GIT_SHA:?RELEASE_SIM_RELEASE_GIT_SHA is required}
      RELEASE_MANIFEST_SHA256: ${RELEASE_SIM_RELEASE_MANIFEST_SHA256:?RELEASE_SIM_RELEASE_MANIFEST_SHA256 is required}
      RELEASE_IMAGE_SET_DIGEST: ${RELEASE_SIM_RELEASE_IMAGE_SET_DIGEST:?RELEASE_SIM_RELEASE_IMAGE_SET_DIGEST is required}
  ui:
    ports: !override ["127.0.0.1:18091:8080"]
    environment:
      MERCHANT_API_TOKEN: ${RELEASE_SIM_MERCHANT_API_TOKEN:?RELEASE_SIM_MERCHANT_API_TOKEN is required}
  ops-ui:
    ports: !override ["127.0.0.1:18092:8080"]
    build:
      args:
        OPS_CONSOLE_BUILD_MODE: production
        VITE_OPS_AUTH_MODE: oidc
  api-replica:
    ports: !override ["127.0.0.1:8788:8787"]
    environment:
      LOCAL_COMPOSE: "false"
      CONNECTOR_FIXTURE_MODE: "false"
      ALLOW_LOCAL_DURABLE_OBJECT_STORAGE: "false"
      ALLOW_LOCAL_PAYMENT_FIXTURE: "false"
      RUN_MIGRATIONS_ON_STARTUP: "false"
      DB_POOL_MAX: 10
      OPS_DB_POOL_MAX: 3
      ALLOW_WILDCARD_WORKSPACE_GRANT: "false"
      API_AUTH_TOKENS: '{"${RELEASE_SIM_MERCHANT_API_TOKEN:?RELEASE_SIM_MERCHANT_API_TOKEN is required}":{"workspaces":["ws_demo"],"actor_id":"support_demo","roles":["support"]}}'
      OPS_AUTH_MODE: oidc
      MERCHANT_BEARER_HOSTNAME: 127.0.0.1
      SESSION_ID_HASH_SECRET: ${RELEASE_SIM_SESSION_ID_HASH_SECRET:?RELEASE_SIM_SESSION_ID_HASH_SECRET is required}
      OIDC_PROXY_SIGNING_SECRET: ${RELEASE_SIM_OIDC_SIGNING_SECRET:?RELEASE_SIM_OIDC_SIGNING_SECRET is required}
      WORKER_API_CREDENTIALS: '{"sync":{"token":"${RELEASE_SIM_WORKER_SYNC_API_TOKEN:?RELEASE_SIM_WORKER_SYNC_API_TOKEN is required}","signing_secret":"${RELEASE_SIM_WORKER_SYNC_SIGNING_SECRET:?RELEASE_SIM_WORKER_SYNC_SIGNING_SECRET is required}"},"generation":{"token":"${RELEASE_SIM_WORKER_GENERATION_API_TOKEN:?RELEASE_SIM_WORKER_GENERATION_API_TOKEN is required}","signing_secret":"${RELEASE_SIM_WORKER_GENERATION_SIGNING_SECRET:?RELEASE_SIM_WORKER_GENERATION_SIGNING_SECRET is required}"},"publish":{"token":"${RELEASE_SIM_WORKER_PUBLISH_API_TOKEN:?RELEASE_SIM_WORKER_PUBLISH_API_TOKEN is required}","signing_secret":"${RELEASE_SIM_WORKER_PUBLISH_SIGNING_SECRET:?RELEASE_SIM_WORKER_PUBLISH_SIGNING_SECRET is required}"},"reconcile":{"token":"${RELEASE_SIM_WORKER_RECONCILE_API_TOKEN:?RELEASE_SIM_WORKER_RECONCILE_API_TOKEN is required}","signing_secret":"${RELEASE_SIM_WORKER_RECONCILE_SIGNING_SECRET:?RELEASE_SIM_WORKER_RECONCILE_SIGNING_SECRET is required}"},"automation":{"token":"${RELEASE_SIM_WORKER_AUTOMATION_API_TOKEN:?RELEASE_SIM_WORKER_AUTOMATION_API_TOKEN is required}","signing_secret":"${RELEASE_SIM_WORKER_AUTOMATION_SIGNING_SECRET:?RELEASE_SIM_WORKER_AUTOMATION_SIGNING_SECRET is required}"}}'
      RELEASE_ID: ${RELEASE_SIM_RELEASE_ID:?RELEASE_SIM_RELEASE_ID is required}
      RELEASE_GIT_SHA: ${RELEASE_SIM_RELEASE_GIT_SHA:?RELEASE_SIM_RELEASE_GIT_SHA is required}
      RELEASE_MANIFEST_SHA256: ${RELEASE_SIM_RELEASE_MANIFEST_SHA256:?RELEASE_SIM_RELEASE_MANIFEST_SHA256 is required}
      RELEASE_IMAGE_SET_DIGEST: ${RELEASE_SIM_RELEASE_IMAGE_SET_DIGEST:?RELEASE_SIM_RELEASE_IMAGE_SET_DIGEST is required}
  worker-sync:
    image: local-worker-sync
    build: !reset null
    environment:
      WORKER_DB_POOL_MAX: 3
      WORKER_API_TOKEN: ${RELEASE_SIM_WORKER_SYNC_API_TOKEN:?RELEASE_SIM_WORKER_SYNC_API_TOKEN is required}
      WORKER_API_SIGNING_SECRET: ${RELEASE_SIM_WORKER_SYNC_SIGNING_SECRET:?RELEASE_SIM_WORKER_SYNC_SIGNING_SECRET is required}
  worker-generation:
    image: local-worker-generation
    build: !reset null
    environment:
      WORKER_DB_POOL_MAX: 3
      WORKER_API_TOKEN: ${RELEASE_SIM_WORKER_GENERATION_API_TOKEN:?RELEASE_SIM_WORKER_GENERATION_API_TOKEN is required}
      WORKER_API_SIGNING_SECRET: ${RELEASE_SIM_WORKER_GENERATION_SIGNING_SECRET:?RELEASE_SIM_WORKER_GENERATION_SIGNING_SECRET is required}
  worker-publish:
    image: local-worker-publish
    build: !reset null
    environment:
      WORKER_DB_POOL_MAX: 3
      WORKER_API_TOKEN: ${RELEASE_SIM_WORKER_PUBLISH_API_TOKEN:?RELEASE_SIM_WORKER_PUBLISH_API_TOKEN is required}
      WORKER_API_SIGNING_SECRET: ${RELEASE_SIM_WORKER_PUBLISH_SIGNING_SECRET:?RELEASE_SIM_WORKER_PUBLISH_SIGNING_SECRET is required}
  worker-reconcile:
    image: local-worker-reconcile
    build: !reset null
    environment:
      WORKER_DB_POOL_MAX: 3
      WORKER_API_TOKEN: ${RELEASE_SIM_WORKER_RECONCILE_API_TOKEN:?RELEASE_SIM_WORKER_RECONCILE_API_TOKEN is required}
      WORKER_API_SIGNING_SECRET: ${RELEASE_SIM_WORKER_RECONCILE_SIGNING_SECRET:?RELEASE_SIM_WORKER_RECONCILE_SIGNING_SECRET is required}
  worker-automation:
    image: local-worker-automation
    build: !reset null
    environment:
      WORKER_DB_POOL_MAX: 3
      WORKER_API_TOKEN: ${RELEASE_SIM_WORKER_AUTOMATION_API_TOKEN:?RELEASE_SIM_WORKER_AUTOMATION_API_TOKEN is required}
      WORKER_API_SIGNING_SECRET: ${RELEASE_SIM_WORKER_AUTOMATION_SIGNING_SECRET:?RELEASE_SIM_WORKER_AUTOMATION_SIGNING_SECRET is required}

volumes:
  merchant-release-sim-postgres:
