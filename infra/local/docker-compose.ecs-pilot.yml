      JD_MAPPING_EVIDENCE_VERIFIED_BY: ${JD_MAPPING_EVIDENCE_VERIFIED_BY:-}
      JD_MAPPING_EVIDENCE_VERIFIED_AT: ${JD_MAPPING_EVIDENCE_VERIFIED_AT:-}
      JD_MEDIA_UPLOAD_EVIDENCE_VERSION: ${JD_MEDIA_UPLOAD_EVIDENCE_VERSION:-}
