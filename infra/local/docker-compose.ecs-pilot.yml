  api-replica:
    ports: !override []
    # `extends` is resolved before this overlay is applied. Reuse the rendered
    # production map so every public, connector, alert, and payment value stays
    # byte-for-byte identical across both API instances.
    environment: *ecs-production-api-environment
    volumes:
      - ${CAPABILITY_EVIDENCE_PATH:?CAPABILITY_EVIDENCE_PATH is required}:/run/release-evidence/platform-capability.json:ro

  pilot-gateway:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/pilot-gateway.Dockerfile
    ports: ["0.0.0.0:80:8080"]
    depends_on:
      ui: { condition: service_healthy }
      ops-ui: { condition: service_healthy }
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
