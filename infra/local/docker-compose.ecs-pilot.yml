      JD_MEDIA_UPLOAD_EVIDENCE_VERIFIED_BY: ${JD_MEDIA_UPLOAD_EVIDENCE_VERIFIED_BY:-}
      JD_MEDIA_UPLOAD_EVIDENCE_VERIFIED_AT: ${JD_MEDIA_UPLOAD_EVIDENCE_VERIFIED_AT:-}
      TAOBAO_APP_KEY: ${TAOBAO_APP_KEY:-}
