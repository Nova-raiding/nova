services:
  payment-gateway:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/payment-gateway/Dockerfile
    environment:
      PORT: 8790
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://yxsona.com}
      # The API and gateway must use the same bearer credential. A second
      # independently configured name can render successfully while every
      # checkout fails with 401, so keep one canonical secret at deployment.
      PAYMENT_GATEWAY_API_KEY: ${PAYMENT_PROVIDER_API_KEY:?PAYMENT_PROVIDER_API_KEY is required}
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:?PAYMENT_CALLBACK_SECRET is required}
      PAYMENT_API_BASE_URL: ${PAYMENT_API_BASE_URL:-http://api:8787}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:?ALIPAY_APP_ID is required}
      ALIPAY_REQUEST_TIMEOUT_MS: ${ALIPAY_REQUEST_TIMEOUT_MS:-10000}
      ALIPAY_APP_PRIVATE_KEY_PATH: /run/secrets/alipay_app_private_key
      ALIPAY_PUBLIC_KEY_PATH: /run/secrets/alipay_public_key
    volumes:
      - /opt/merchant-deploy/deploy/secrets/alipay_app_private_key:/run/secrets/alipay_app_private_key:ro
      - /opt/merchant-deploy/deploy/secrets/alipay_public_key:/run/secrets/alipay_public_key:ro
    expose: ["8790"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8790/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
  ui:
    ports: !override []
    environment:
      MERCHANT_API_TOKEN: ${MERCHANT_API_TOKEN:?MERCHANT_API_TOKEN is required for pilot preflight}
      MERCHANT_WORKSPACE_ID: ${MERCHANT_WORKSPACE_ID:?MERCHANT_WORKSPACE_ID is required for pilot preflight}

  ops-ui:
    ports: !override []
    build:
      args:
        OPS_CONSOLE_BUILD_MODE: local
        VITE_API_BASE: /api
        VITE_BASE: /ops/

  api:
    ports: !override ["127.0.0.1:8787:8787"]
    environment:
      # This overlay is a local/pilot surface. The base Compose service keeps
      # its explicit local durable volume; remote OSS/KMS credentials belong to
      # a separately reviewed deployment manifest and must not be required here.
      PUBLIC_APP_BASE_URL: ${PUBLIC_APP_BASE_URL:-https://yxsona.com}
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:-}
      MCP_OAUTH_AUTHORIZATION_ENDPOINT: ${MCP_OAUTH_AUTHORIZATION_ENDPOINT:-}
      MCP_OAUTH_TOKEN_ENDPOINT: ${MCP_OAUTH_TOKEN_ENDPOINT:-}
      OPENAI_APPS_CHALLENGE_TOKEN: ${OPENAI_APPS_CHALLENGE_TOKEN:-}
      PUBLIC_ASSET_BASE_URL: ${PUBLIC_ASSET_BASE_URL:-https://yxsona.com}
      PUBLIC_OAUTH_REDIRECT_URI: ${PUBLIC_OAUTH_REDIRECT_URI:-https://yxsona.com/v1/oauth/callback/{platform}}
      MERCHANT_BEARER_HOSTNAME: ${MERCHANT_BEARER_HOSTNAME:-yxsona.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://yxsona.com,https://admin.yxsona.com,https://ops.yxsona.com}
      OPS_ALERT_NOTIFICATIONS_ENABLED: ${OPS_ALERT_NOTIFICATIONS_ENABLED:-false}
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}
      OPS_ALERT_WEBHOOK_ALLOWED_HOSTS: ${OPS_ALERT_WEBHOOK_ALLOWED_HOSTS:-}
      OPS_ALERT_WEBHOOK_SECRET: ${OPS_ALERT_WEBHOOK_SECRET:-}
      PAYMENT_MODE: ${PAYMENT_MODE:?PAYMENT_MODE=provider is required for ECS}
      PAYMENT_PROVIDER_ADAPTERS: ${PAYMENT_PROVIDER_ADAPTERS:?PAYMENT_PROVIDER_ADAPTERS=alipay is required}
      PAYMENT_CHECKOUT_BASE_URL: ${PAYMENT_CHECKOUT_BASE_URL:?public HTTPS payment checkout base URL is required}
      PAYMENT_PROVIDER_CHECKOUT_API_URL: ${PAYMENT_PROVIDER_CHECKOUT_API_URL:?public HTTPS payment gateway checkout URL is required}
      PAYMENT_PROVIDER_QUERY_API_URL: ${PAYMENT_PROVIDER_QUERY_API_URL:?public HTTPS payment gateway query URL is required}
      PAYMENT_PROVIDER_REFUND_API_URL: ${PAYMENT_PROVIDER_REFUND_API_URL:?public HTTPS payment gateway refund URL is required}
      PAYMENT_PROVIDER_API_KEY: ${PAYMENT_PROVIDER_API_KEY:?PAYMENT_PROVIDER_API_KEY is required}
      PAYMENT_PROVIDER_MERCHANT_ID: ${PAYMENT_PROVIDER_MERCHANT_ID:?PAYMENT_PROVIDER_MERCHANT_ID is required}
      PAYMENT_CALLBACK_BASE_URL: ${PAYMENT_CALLBACK_BASE_URL:?public HTTPS payment callback base URL is required}
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:?PAYMENT_CALLBACK_SECRET is required}
      PAYMENT_RECONCILIATION_ENABLED: ${PAYMENT_RECONCILIATION_ENABLED:?PAYMENT_RECONCILIATION_ENABLED=true is required}
      PAYMENT_REFUND_ENABLED: ${PAYMENT_REFUND_ENABLED:?PAYMENT_REFUND_ENABLED=true is required}
      PAYMENT_ONE_FEN_TEST_ENABLED: ${PAYMENT_ONE_FEN_TEST_ENABLED:-false}
      PAYMENT_ONE_FEN_TEST_WORKSPACE_ID: ${PAYMENT_ONE_FEN_TEST_WORKSPACE_ID:-}
      COMMERCIAL_PAYMENT_PROVIDER: ${COMMERCIAL_PAYMENT_PROVIDER:-manual_transfer}

  api-replica:
    ports: !override []
    environment:
      # Compose resolves `extends` before applying this overlay, so production-
      # facing pilot values added to `api` above do not automatically reach the
      # replica. Keep both instances identical for direct replica canaries and
      # any future load-balanced API traffic.
      PUBLIC_APP_BASE_URL: ${PUBLIC_APP_BASE_URL:-https://yxsona.com}
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:-}
      MCP_OAUTH_AUTHORIZATION_ENDPOINT: ${MCP_OAUTH_AUTHORIZATION_ENDPOINT:-}
      MCP_OAUTH_TOKEN_ENDPOINT: ${MCP_OAUTH_TOKEN_ENDPOINT:-}
      OPENAI_APPS_CHALLENGE_TOKEN: ${OPENAI_APPS_CHALLENGE_TOKEN:-}
      PUBLIC_ASSET_BASE_URL: ${PUBLIC_ASSET_BASE_URL:-https://yxsona.com}
      PUBLIC_OAUTH_REDIRECT_URI: ${PUBLIC_OAUTH_REDIRECT_URI:-https://yxsona.com/v1/oauth/callback/{platform}}
      MERCHANT_BEARER_HOSTNAME: ${MERCHANT_BEARER_HOSTNAME:-yxsona.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://yxsona.com,https://admin.yxsona.com,https://ops.yxsona.com}
      OPS_ALERT_NOTIFICATIONS_ENABLED: ${OPS_ALERT_NOTIFICATIONS_ENABLED:-false}
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}
      OPS_ALERT_WEBHOOK_ALLOWED_HOSTS: ${OPS_ALERT_WEBHOOK_ALLOWED_HOSTS:-}
      OPS_ALERT_WEBHOOK_SECRET: ${OPS_ALERT_WEBHOOK_SECRET:-}
      PAYMENT_MODE: ${PAYMENT_MODE:?PAYMENT_MODE=provider is required for ECS}
      PAYMENT_PROVIDER_ADAPTERS: ${PAYMENT_PROVIDER_ADAPTERS:?PAYMENT_PROVIDER_ADAPTERS=alipay is required}
      PAYMENT_CHECKOUT_BASE_URL: ${PAYMENT_CHECKOUT_BASE_URL:?public HTTPS payment checkout base URL is required}
      PAYMENT_PROVIDER_CHECKOUT_API_URL: ${PAYMENT_PROVIDER_CHECKOUT_API_URL:?public HTTPS payment gateway checkout URL is required}
      PAYMENT_PROVIDER_QUERY_API_URL: ${PAYMENT_PROVIDER_QUERY_API_URL:?public HTTPS payment gateway query URL is required}
      PAYMENT_PROVIDER_REFUND_API_URL: ${PAYMENT_PROVIDER_REFUND_API_URL:?public HTTPS payment gateway refund URL is required}
      PAYMENT_PROVIDER_API_KEY: ${PAYMENT_PROVIDER_API_KEY:?PAYMENT_PROVIDER_API_KEY is required}
      PAYMENT_PROVIDER_MERCHANT_ID: ${PAYMENT_PROVIDER_MERCHANT_ID:?PAYMENT_PROVIDER_MERCHANT_ID is required}
      PAYMENT_CALLBACK_BASE_URL: ${PAYMENT_CALLBACK_BASE_URL:?public HTTPS payment callback base URL is required}
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:?PAYMENT_CALLBACK_SECRET is required}
      PAYMENT_RECONCILIATION_ENABLED: ${PAYMENT_RECONCILIATION_ENABLED:?PAYMENT_RECONCILIATION_ENABLED=true is required}
      PAYMENT_REFUND_ENABLED: ${PAYMENT_REFUND_ENABLED:?PAYMENT_REFUND_ENABLED=true is required}
      PAYMENT_ONE_FEN_TEST_ENABLED: ${PAYMENT_ONE_FEN_TEST_ENABLED:-false}
      PAYMENT_ONE_FEN_TEST_WORKSPACE_ID: ${PAYMENT_ONE_FEN_TEST_WORKSPACE_ID:-}
      COMMERCIAL_PAYMENT_PROVIDER: ${COMMERCIAL_PAYMENT_PROVIDER:-manual_transfer}

  pilot-gateway:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/pilot-gateway.Dockerfile
    ports: ["0.0.0.0:80:8080"]
    depends_on:
      ui: { condition: service_healthy }
      ops-ui: { condition: service_healthy }
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
