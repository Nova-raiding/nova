      JD_UPDATE_METHOD: ${JD_UPDATE_METHOD:-}
      JD_QUERY_METHOD: ${JD_QUERY_METHOD:-}
      JD_MEDIA_METHOD: ${JD_MEDIA_METHOD:-}
      JD_MEDIA_UPLOAD_PATH: ${JD_MEDIA_UPLOAD_PATH:-}
