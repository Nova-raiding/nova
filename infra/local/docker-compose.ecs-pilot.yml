      OPS_ALERT_NOTIFICATIONS_ENABLED: ${OPS_ALERT_NOTIFICATIONS_ENABLED:-false}
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-http://alert-receiver:8791/v1/alerts}
      OPS_ALERT_WEBHOOK_ALLOWED_HOSTS: ${OPS_ALERT_WEBHOOK_ALLOWED_HOSTS:-alert-receiver}
      OPS_ALERT_WEBHOOK_SECRET_FILE: /run/secrets/alert_receiver_hmac_secret
      NODE_ENV: production
      DEPLOYMENT_PROFILE: ecs
      ALLOW_LOCAL_DURABLE_OBJECT_STORAGE: "false"
      ALLOW_LOCAL_ASSET_SCAN_FIXTURE: "false"
      ASSET_SCANNER_MODE: clamav_worker
      ASSET_SCANNER_API_TOKEN: ${ASSET_SCANNER_API_TOKEN:?ASSET_SCANNER_API_TOKEN is required}
      ASSET_SCANNER_WORKSPACE_SIGNING_SECRET: ${ASSET_SCANNER_WORKSPACE_SIGNING_SECRET:?ASSET_SCANNER_WORKSPACE_SIGNING_SECRET is required}
      ASSET_SCAN_TRUSTED_PUBLIC_KEYS: ${ASSET_SCAN_TRUSTED_PUBLIC_KEYS:?ASSET_SCAN_TRUSTED_PUBLIC_KEYS is required}
      ASSET_SCAN_APPROVED_SCANNER_SERVICE_IDS: ${ASSET_SCAN_APPROVED_SCANNER_SERVICE_IDS:?ASSET_SCAN_APPROVED_SCANNER_SERVICE_IDS is required}
      ASSET_SCAN_MIN_DEFINITIONS_VERSION: ${ASSET_SCAN_MIN_DEFINITIONS_VERSION:?ASSET_SCAN_MIN_DEFINITIONS_VERSION is required}
      ASSET_SCAN_POLICY_VERSION: ${ASSET_SCAN_POLICY_VERSION:?ASSET_SCAN_POLICY_VERSION is required}
      ASSET_STORAGE_BUCKET: ${ASSET_STORAGE_BUCKET:?ASSET_STORAGE_BUCKET is required}
      ASSET_STORAGE_REGION: ${ASSET_STORAGE_REGION:?ASSET_STORAGE_REGION is required}
      ASSET_STORAGE_ENDPOINT: ${ASSET_STORAGE_ENDPOINT:?ASSET_STORAGE_ENDPOINT is required}
      ASSET_STORAGE_SSE_MODE: ${ASSET_STORAGE_SSE_MODE:-AES256}
      ASSET_STORAGE_KMS_KEY_ID: ${ASSET_STORAGE_KMS_KEY_ID:-}
      ASSET_STORAGE_CREDENTIAL_PROVIDER: aliyun_ecs_ram_role
      ASSET_STORAGE_ECS_RAM_ROLE: ${ASSET_STORAGE_ECS_RAM_ROLE:?ASSET_STORAGE_ECS_RAM_ROLE is required}
      ASSET_STORAGE_QUOTA_BYTES: ${ASSET_STORAGE_QUOTA_BYTES:?ASSET_STORAGE_QUOTA_BYTES is required}
      OBJECT_STORAGE_VERSIONING: ${OBJECT_STORAGE_VERSIONING:?OBJECT_STORAGE_VERSIONING=true is required}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:?DATA_RETENTION_DAYS is required}
      ASSET_QUARANTINE_RETENTION_DAYS: ${ASSET_QUARANTINE_RETENTION_DAYS:?ASSET_QUARANTINE_RETENTION_DAYS is required}
      ASSET_CLEAN_RETENTION_DAYS: ${ASSET_CLEAN_RETENTION_DAYS:?ASSET_CLEAN_RETENTION_DAYS is required}
      DELETION_REQUEST_GRACE_DAYS: ${DELETION_REQUEST_GRACE_DAYS:?DELETION_REQUEST_GRACE_DAYS is required}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:?BACKUP_RETENTION_DAYS is required}
      LIFECYCLE_POLICY_REF: ${LIFECYCLE_POLICY_REF:?LIFECYCLE_POLICY_REF is required}
      ALERT_CHANNEL_SECRET_REF: ${ALERT_CHANNEL_SECRET_REF:-}
      PAYMENT_MODE: ${PAYMENT_MODE:?PAYMENT_MODE=provider is required for ECS}
      PAYMENT_PROVIDER_ADAPTERS: ${PAYMENT_PROVIDER_ADAPTERS:?PAYMENT_PROVIDER_ADAPTERS=alipay is required}
      PAYMENT_CHECKOUT_BASE_URL: ${PAYMENT_CHECKOUT_BASE_URL:?public HTTPS payment checkout base URL is required}
      PAYMENT_PROVIDER_CHECKOUT_API_URL: ${PAYMENT_PROVIDER_CHECKOUT_API_URL:?public HTTPS payment gateway checkout URL is required}
      PAYMENT_PROVIDER_QUERY_API_URL: ${PAYMENT_PROVIDER_QUERY_API_URL:?public HTTPS payment gateway query URL is required}
