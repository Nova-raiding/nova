    volumes:
      - ${CAPABILITY_EVIDENCE_PATH:?CAPABILITY_EVIDENCE_PATH is required}:/run/release-evidence/platform-capability.json:ro
      - ${CAPACITY_REPORT_PATH:?CAPACITY_REPORT_PATH is required}:/run/release-evidence/capacity-report.json:ro
      - /run/release-security/evidence-trust:/run/release-security/evidence-trust:ro
      - /opt/merchant-deploy/deploy/secrets/postgres_server.crt:/run/secrets/postgres_server.crt:ro

  api-replica:
    <<: *ecs-node-hardening
    ports: !override []
    healthcheck: *ecs-api-healthcheck
    # `extends` is resolved before this overlay is applied. Reuse the rendered
    # production map so every public, connector, alert, and payment value stays
    # byte-for-byte identical across both API instances.
    environment: *ecs-production-api-environment
    volumes:
      - ${CAPABILITY_EVIDENCE_PATH:?CAPABILITY_EVIDENCE_PATH is required}:/run/release-evidence/platform-capability.json:ro
      - ${CAPACITY_REPORT_PATH:?CAPACITY_REPORT_PATH is required}:/run/release-evidence/capacity-report.json:ro
      - /run/release-security/evidence-trust:/run/release-security/evidence-trust:ro
      - /opt/merchant-deploy/deploy/secrets/postgres_server.crt:/run/secrets/postgres_server.crt:ro

  # ECS keeps the stateful single-node services in the Compose release so a
  # fresh 101 host has a deterministic persistence boundary. Their runtime
  # credentials must come from the protected production env, never from the
  # local acceptance defaults in the base file. Host ports stay private to the
  # Compose network; the API reaches them by the service names below.
  postgres:
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/secrets/postgres_server.crt
      - -c
      - ssl_key_file=/run/secrets/postgres_server.key
    environment:
      POSTGRES_DB: merchant
      POSTGRES_USER: merchant
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD is required for the ECS database service}
    ports: !override []
    volumes: !override
      - merchant-postgres:/var/lib/postgresql/data
      - /opt/merchant-deploy/deploy/secrets/postgres_server.crt:/run/secrets/postgres_server.crt:ro
      - /opt/merchant-deploy/deploy/secrets/postgres_server.key:/run/secrets/postgres_server.key:ro

  redis:
    ports: !override []
    volumes: !override
      - merchant-redis:/data

  worker-sync:
    <<: *ecs-node-hardening
    environment:
      <<: *ecs-worker-environment
      WORKER_API_TOKEN: ${WORKER_SYNC_API_TOKEN:?WORKER_SYNC_API_TOKEN is required}
      WORKER_API_SIGNING_SECRET: ${WORKER_SYNC_API_SIGNING_SECRET:?WORKER_SYNC_API_SIGNING_SECRET is required}

  worker-generation:
    <<: *ecs-node-hardening
    environment:
      <<: *ecs-worker-environment
      WORKER_API_TOKEN: ${WORKER_GENERATION_API_TOKEN:?WORKER_GENERATION_API_TOKEN is required}
      WORKER_API_SIGNING_SECRET: ${WORKER_GENERATION_API_SIGNING_SECRET:?WORKER_GENERATION_API_SIGNING_SECRET is required}

  worker-publish:
    <<: *ecs-node-hardening
    environment:
      <<: *ecs-worker-environment
      WORKER_API_TOKEN: ${WORKER_PUBLISH_API_TOKEN:?WORKER_PUBLISH_API_TOKEN is required}
      WORKER_API_SIGNING_SECRET: ${WORKER_PUBLISH_API_SIGNING_SECRET:?WORKER_PUBLISH_API_SIGNING_SECRET is required}

  worker-reconcile:
    <<: *ecs-node-hardening
    environment:
      <<: *ecs-worker-environment
      WORKER_API_TOKEN: ${WORKER_RECONCILE_API_TOKEN:?WORKER_RECONCILE_API_TOKEN is required}
      WORKER_API_SIGNING_SECRET: ${WORKER_RECONCILE_API_SIGNING_SECRET:?WORKER_RECONCILE_API_SIGNING_SECRET is required}

  worker-automation:
    <<: *ecs-node-hardening
    environment:
      <<: *ecs-worker-environment
      WORKER_API_TOKEN: ${WORKER_AUTOMATION_API_TOKEN:?WORKER_AUTOMATION_API_TOKEN is required}
      WORKER_API_SIGNING_SECRET: ${WORKER_AUTOMATION_API_SIGNING_SECRET:?WORKER_AUTOMATION_API_SIGNING_SECRET is required}

  worker-scan:
    <<: *ecs-node-hardening
    environment:
      <<: *ecs-worker-environment
      WORKER_API_TOKEN: ${ASSET_SCANNER_API_TOKEN:?ASSET_SCANNER_API_TOKEN is required}
      WORKER_API_SIGNING_SECRET: ${ASSET_SCANNER_WORKSPACE_SIGNING_SECRET:?ASSET_SCANNER_WORKSPACE_SIGNING_SECRET is required}
      ASSET_SCANNER_API_TOKEN: ${ASSET_SCANNER_API_TOKEN:?ASSET_SCANNER_API_TOKEN is required}
      ASSET_SCANNER_WORKSPACE_SIGNING_SECRET: ${ASSET_SCANNER_WORKSPACE_SIGNING_SECRET:?ASSET_SCANNER_WORKSPACE_SIGNING_SECRET is required}
      ASSET_SCAN_RECEIPT_KEY_ID: ${ASSET_SCAN_RECEIPT_KEY_ID:?ASSET_SCAN_RECEIPT_KEY_ID is required}
      ASSET_SCAN_RECEIPT_PRIVATE_KEY_PEM_B64: ${ASSET_SCAN_RECEIPT_PRIVATE_KEY_PEM_B64:?ASSET_SCAN_RECEIPT_PRIVATE_KEY_PEM_B64 is required}
      ASSET_SCANNER_SERVICE_ID: ${ASSET_SCANNER_SERVICE_ID:?ASSET_SCANNER_SERVICE_ID is required}
      ASSET_SCAN_POLICY_VERSION: ${ASSET_SCAN_POLICY_VERSION:?ASSET_SCAN_POLICY_VERSION is required}
      SCANNER_DEFINITIONS_MAX_AGE_SECONDS: "86400"
      CLAMAV_DEFINITIONS_MAX_AGE_SECONDS: "86400"
      SCANNER_MINIMUM_READY_INSTANCES: ${SCANNER_MINIMUM_READY_INSTANCES:-1}

  pilot-gateway:
    <<: *ecs-nginx-hardening
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/pilot-gateway.Dockerfile
    ports: ["0.0.0.0:80:8080"]
    depends_on:
      ui: { condition: service_healthy }
      ops-ui: { condition: service_healthy }
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  merchant-redis:
