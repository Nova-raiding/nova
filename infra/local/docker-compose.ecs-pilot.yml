x-ecs-worker-environment: &ecs-worker-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL production secret is required}
  WORKER_WORKSPACES: ${WORKER_WORKSPACES:?WORKER_WORKSPACES=auto or an explicit production workspace allowlist is required}
  NODE_EXTRA_CA_CERTS: /run/secrets/postgres_server.crt

x-ecs-node-hardening: &ecs-node-hardening
  user: "10001:10001"
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  environment:
    NODE_EXTRA_CA_CERTS: /run/secrets/postgres_server.crt
  volumes:
    - /opt/merchant-deploy/deploy/secrets/postgres_server.crt:/run/secrets/postgres_server.crt:ro
  tmpfs:
    - "/tmp:rw,nosuid,nodev,noexec,size=64m"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-ecs-nginx-hardening: &ecs-nginx-hardening
  user: "101:101"
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  alert-receiver:
    <<: *ecs-node-hardening
    profiles: ["alerts"]
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/alert-receiver.Dockerfile
    environment:
      ALERT_RECEIVER_PORT: "8791"
      ALERT_RECEIVER_BIND_HOST: 0.0.0.0
      ALERT_RECEIVER_DATABASE_URL_FILE: /run/secrets/alert_receiver_database_url
      ALERT_RECEIVER_HMAC_SECRET_FILE: /run/secrets/alert_receiver_hmac_secret
    volumes:
      - type: bind
        source: /opt/merchant-deploy/deploy/secrets/alert_receiver_database_url
        target: /run/secrets/alert_receiver_database_url
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /opt/merchant-deploy/deploy/secrets/alert_receiver_hmac_secret
        target: /run/secrets/alert_receiver_hmac_secret
        read_only: true
        bind: {create_host_path: false}
    expose: ["8791"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8791/readyz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5

  payment-gateway:
    user: "100:101"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    tmpfs:
      - "/tmp:rw,nosuid,nodev,noexec,size=32m"
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/payment-gateway/Dockerfile
    environment:
      PORT: 8790
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://yxsona.com}
      # The API and gateway must use the same bearer credential. A second
      # independently configured name can render successfully while every
      # checkout fails with 401, so keep one canonical secret at deployment.
      PAYMENT_GATEWAY_API_KEY: ${PAYMENT_PROVIDER_API_KEY:?PAYMENT_PROVIDER_API_KEY is required}
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:?PAYMENT_CALLBACK_SECRET is required}
      PAYMENT_API_BASE_URL: ${PAYMENT_API_BASE_URL:-http://api:8787}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:?ALIPAY_APP_ID is required}
      ALIPAY_REQUEST_TIMEOUT_MS: ${ALIPAY_REQUEST_TIMEOUT_MS:-10000}
      ALIPAY_APP_PRIVATE_KEY_PATH: /run/secrets/alipay_app_private_key
      ALIPAY_PUBLIC_KEY_PATH: /run/secrets/alipay_public_key
    volumes:
      - /opt/merchant-deploy/deploy/secrets/alipay_app_private_key:/run/secrets/alipay_app_private_key:ro
      - /opt/merchant-deploy/deploy/secrets/alipay_public_key:/run/secrets/alipay_public_key:ro
    expose: ["8790"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8790/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
  ui:
    <<: *ecs-nginx-hardening
    ports: !override []
    environment:
      MERCHANT_API_TOKEN: ${MERCHANT_API_TOKEN:?MERCHANT_API_TOKEN is required for pilot preflight}
      MERCHANT_WORKSPACE_ID: ${MERCHANT_WORKSPACE_ID:?MERCHANT_WORKSPACE_ID is required for pilot preflight}

  ops-ui:
    <<: *ecs-nginx-hardening
    ports: !override []
    build:
      args:
        OPS_CONSOLE_BUILD_MODE: local
        VITE_API_BASE: /api
        VITE_BASE: /ops/

  api:
    <<: *ecs-node-hardening
    ports: !override ["127.0.0.1:8787:8787"]
    healthcheck: &ecs-api-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment: &ecs-production-api-environment
      <<: *ecs-platform-environment
      # This overlay is a local/pilot surface. The base Compose service keeps
      # its explicit local durable volume; remote OSS/KMS credentials belong to
      # a separately reviewed deployment manifest and must not be required here.
      NODE_ENV: production
      LOCAL_COMPOSE: "false"
      DEPLOYMENT_PROFILE: ecs
      CONNECTOR_FIXTURE_MODE: "false"
      MERCHANT_TEST_APPROVED_RATES: "false"
      ALLOW_LOCAL_PAYMENT_FIXTURE: "false"
      OPS_LOCAL_SESSION_ENABLED: "false"
      OPS_LOCAL_SESSION_TOKEN: ""
      OPS_LOCAL_SESSION_WORKSPACE_ID: ""
      PLATFORM_ACCOUNT_LOGIN: ""
      PLATFORM_ACCOUNT_PASSWORD_HASH: ""
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL production secret is required}
      OPS_DATABASE_URL: ${OPS_DATABASE_URL:?OPS_DATABASE_URL production secret is required}
      NODE_EXTRA_CA_CERTS: /run/secrets/postgres_server.crt
      API_AUTH_TOKENS: ${API_AUTH_TOKENS:?API_AUTH_TOKENS is required}
      SESSION_ID_HASH_SECRET: ${SESSION_ID_HASH_SECRET:?SESSION_ID_HASH_SECRET is required}
      WORKER_API_CREDENTIALS: ${WORKER_API_CREDENTIALS:?WORKER_API_CREDENTIALS is required}
      ALLOW_WILDCARD_WORKSPACE_GRANT: "false"
      ASSET_DISPLAY_URL_SIGNING_SECRET: ${ASSET_DISPLAY_URL_SIGNING_SECRET:?ASSET_DISPLAY_URL_SIGNING_SECRET is required}
      ASSET_DISPLAY_URL_SIGNING_KEY_ID: ${ASSET_DISPLAY_URL_SIGNING_KEY_ID:?ASSET_DISPLAY_URL_SIGNING_KEY_ID is required}
      ASSET_DISPLAY_URL_PREVIOUS_KEYS_JSON: ${ASSET_DISPLAY_URL_PREVIOUS_KEYS_JSON:-}
      MODEL_COST_ESTIMATE_VERSION: ${MODEL_COST_ESTIMATE_VERSION:?MODEL_COST_ESTIMATE_VERSION production value is required}
      ALLOW_LOCAL_DURABLE_OBJECT_STORAGE: "false"
      ALLOW_LOCAL_ASSET_SCAN_FIXTURE: "false"
      ASSET_SCANNER_MODE: clamav_worker
      ASSET_SCANNER_API_TOKEN: ${ASSET_SCANNER_API_TOKEN:?ASSET_SCANNER_API_TOKEN is required}
      ASSET_SCANNER_WORKSPACE_SIGNING_SECRET: ${ASSET_SCANNER_WORKSPACE_SIGNING_SECRET:?ASSET_SCANNER_WORKSPACE_SIGNING_SECRET is required}
      ASSET_SCAN_TRUSTED_PUBLIC_KEYS: ${ASSET_SCAN_TRUSTED_PUBLIC_KEYS:?ASSET_SCAN_TRUSTED_PUBLIC_KEYS is required}
      ASSET_SCAN_APPROVED_SCANNER_SERVICE_IDS: ${ASSET_SCAN_APPROVED_SCANNER_SERVICE_IDS:?ASSET_SCAN_APPROVED_SCANNER_SERVICE_IDS is required}
      ASSET_SCAN_MIN_DEFINITIONS_VERSION: ${ASSET_SCAN_MIN_DEFINITIONS_VERSION:?ASSET_SCAN_MIN_DEFINITIONS_VERSION is required}
      ASSET_SCAN_POLICY_VERSION: ${ASSET_SCAN_POLICY_VERSION:?ASSET_SCAN_POLICY_VERSION is required}
      ASSET_SCAN_RECEIPT_KEY_ID: ${ASSET_SCAN_RECEIPT_KEY_ID:?ASSET_SCAN_RECEIPT_KEY_ID is required}
      ASSET_SCANNER_SERVICE_ID: ${ASSET_SCANNER_SERVICE_ID:?ASSET_SCANNER_SERVICE_ID is required}
      ASSET_STORAGE_BUCKET: ${ASSET_STORAGE_BUCKET:?ASSET_STORAGE_BUCKET is required}
      ASSET_STORAGE_REGION: ${ASSET_STORAGE_REGION:?ASSET_STORAGE_REGION is required}
      ASSET_STORAGE_ENDPOINT: ${ASSET_STORAGE_ENDPOINT:?ASSET_STORAGE_ENDPOINT is required}
      ASSET_STORAGE_PREFIX: ${ASSET_STORAGE_PREFIX:-merchant-assets}
      ASSET_STORAGE_FORCE_PATH_STYLE: ${ASSET_STORAGE_FORCE_PATH_STYLE:-false}
      ASSET_STORAGE_SSE_MODE: ${ASSET_STORAGE_SSE_MODE:-AES256}
      ASSET_STORAGE_KMS_KEY_ID: ${ASSET_STORAGE_KMS_KEY_ID:-}
      ASSET_STORAGE_CREDENTIAL_PROVIDER: aliyun_ecs_ram_role
      ASSET_STORAGE_ECS_RAM_ROLE: ${ASSET_STORAGE_ECS_RAM_ROLE:?ASSET_STORAGE_ECS_RAM_ROLE is required}
      ASSET_STORAGE_QUOTA_BYTES: ${ASSET_STORAGE_QUOTA_BYTES:?ASSET_STORAGE_QUOTA_BYTES is required}
      PLUGIN_WRITE_ENABLED: ${PLUGIN_WRITE_ENABLED:-false}
      CAPABILITY_EVIDENCE_PATH: /run/release-evidence/platform-capability.json
      CAPACITY_REPORT_PATH: /run/release-evidence/capacity-report.json
      # ECS production is currently a single-node deployment. Keep the
      # scanner quorum explicit for that topology; Kubernetes retains its
      # separate two-instance contract.
      SCANNER_MINIMUM_READY_INSTANCES: ${SCANNER_MINIMUM_READY_INSTANCES:-1}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-}
      VAULT_CREDENTIAL_PATH_PREFIX: ${VAULT_CREDENTIAL_PATH_PREFIX:-}
      PUBLIC_APP_BASE_URL: ${PUBLIC_APP_BASE_URL:-https://yxsona.com}
      MCP_INTEGRATION_MODE: local_stdio
      MCP_OAUTH_REQUIRED: "false"
      PUBLIC_ASSET_BASE_URL: ${PUBLIC_ASSET_BASE_URL:-https://yxsona.com}
      PUBLIC_OAUTH_REDIRECT_URI: ${PUBLIC_OAUTH_REDIRECT_URI:-https://yxsona.com/v1/oauth/callback/{platform}}
      MERCHANT_BEARER_HOSTNAME: ${MERCHANT_BEARER_HOSTNAME:-yxsona.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://yxsona.com,https://admin.yxsona.com,https://ops.yxsona.com}
      # Alerts remain fail-closed until the separately profiled receiver is
      # explicitly reviewed and enabled by a dedicated production overlay.
      # Ignore stale host values so a plain production render cannot
      # accidentally activate or partially wire alert delivery.
      OPS_ALERT_NOTIFICATIONS_ENABLED: "false"
      ALERT_CHANNEL_SECRET_REF: ""
      OPS_ALERT_WEBHOOK_URL: ""
      OPS_ALERT_WEBHOOK_ALLOWED_HOSTS: ""
      OPS_ALERT_WEBHOOK_SECRET_FILE: ""
      PAYMENT_MODE: ${PAYMENT_MODE:?PAYMENT_MODE=provider is required for ECS}
      PAYMENT_PROVIDER_ADAPTERS: ${PAYMENT_PROVIDER_ADAPTERS:?PAYMENT_PROVIDER_ADAPTERS=alipay is required}
      PAYMENT_CHECKOUT_BASE_URL: ${PAYMENT_CHECKOUT_BASE_URL:?public HTTPS payment checkout base URL is required}
      PAYMENT_PROVIDER_CHECKOUT_API_URL: ${PAYMENT_PROVIDER_CHECKOUT_API_URL:?public HTTPS payment gateway checkout URL is required}
      PAYMENT_PROVIDER_QUERY_API_URL: ${PAYMENT_PROVIDER_QUERY_API_URL:?public HTTPS payment gateway query URL is required}
      PAYMENT_PROVIDER_REFUND_QUERY_API_URL: ${PAYMENT_PROVIDER_REFUND_QUERY_API_URL:?public HTTPS payment gateway refund query URL is required}
      PAYMENT_PROVIDER_REFUND_API_URL: ${PAYMENT_PROVIDER_REFUND_API_URL:?public HTTPS payment gateway refund URL is required}
      PAYMENT_PROVIDER_API_KEY: ${PAYMENT_PROVIDER_API_KEY:?PAYMENT_PROVIDER_API_KEY is required}
      PAYMENT_PROVIDER_MERCHANT_ID: ${PAYMENT_PROVIDER_MERCHANT_ID:?PAYMENT_PROVIDER_MERCHANT_ID is required}
      PAYMENT_CALLBACK_BASE_URL: ${PAYMENT_CALLBACK_BASE_URL:?public HTTPS payment callback base URL is required}
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:?PAYMENT_CALLBACK_SECRET is required}
      PAYMENT_RECONCILIATION_ENABLED: ${PAYMENT_RECONCILIATION_ENABLED:?PAYMENT_RECONCILIATION_ENABLED=true is required}
      PAYMENT_REFUND_ENABLED: ${PAYMENT_REFUND_ENABLED:?PAYMENT_REFUND_ENABLED=true is required}
      PAYMENT_ONE_FEN_TEST_ENABLED: ${PAYMENT_ONE_FEN_TEST_ENABLED:-false}
      PAYMENT_ONE_FEN_TEST_WORKSPACE_ID: ${PAYMENT_ONE_FEN_TEST_WORKSPACE_ID:-}
      COMMERCIAL_PAYMENT_PROVIDER: ${COMMERCIAL_PAYMENT_PROVIDER:-manual_transfer}

      # Six-platform OAuth/API configuration is injected by the ECS secret and
      # configuration environment. Empty values remain fail-closed.
      JD_APP_KEY: ${JD_APP_KEY:-}
      JD_APP_SECRET: ${JD_APP_SECRET:-}
      JD_OAUTH_AUTHORIZE_URL: ${JD_OAUTH_AUTHORIZE_URL:-}
      JD_OAUTH_TOKEN_URL: ${JD_OAUTH_TOKEN_URL:-}
      JD_OAUTH_REFRESH_URL: ${JD_OAUTH_REFRESH_URL:-}
      JD_OAUTH_REVOKE_URL: ${JD_OAUTH_REVOKE_URL:-}
      JD_OAUTH_SCOPES: ${JD_OAUTH_SCOPES:-}
      JD_API_BASE_URL: ${JD_API_BASE_URL:-}
      JD_SYNC_PATH: ${JD_SYNC_PATH:-}
      JD_CREATE_PATH: ${JD_CREATE_PATH:-}
      JD_UPDATE_PATH: ${JD_UPDATE_PATH:-}
