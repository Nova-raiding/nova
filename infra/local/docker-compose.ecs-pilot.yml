      ASSET_SCANNER_SERVICE_ID: ${ASSET_SCANNER_SERVICE_ID:?ASSET_SCANNER_SERVICE_ID is required}
      ASSET_SCAN_POLICY_VERSION: ${ASSET_SCAN_POLICY_VERSION:?ASSET_SCAN_POLICY_VERSION is required}
      SCANNER_DEFINITIONS_MAX_AGE_SECONDS: ${SCANNER_DEFINITIONS_MAX_AGE_SECONDS:-86400}
      CLAMAV_DEFINITIONS_MAX_AGE_SECONDS: ${CLAMAV_DEFINITIONS_MAX_AGE_SECONDS:-86400}
      SCANNER_EICAR_MAX_AGE_SECONDS: ${SCANNER_EICAR_MAX_AGE_SECONDS:-900}
      SCANNER_CALLBACK_MAX_AGE_SECONDS: ${SCANNER_CALLBACK_MAX_AGE_SECONDS:-86400}
      SCANNER_MINIMUM_READY_INSTANCES: ${SCANNER_MINIMUM_READY_INSTANCES:-1}

  pilot-gateway:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/pilot-gateway.Dockerfile
    ports: ["0.0.0.0:80:8080"]
    depends_on:
      ui: { condition: service_healthy }
      ops-ui: { condition: service_healthy }
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
