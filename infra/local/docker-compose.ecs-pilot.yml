      JD_MAPPING_EVIDENCE_VERIFIED_AT: ${JD_MAPPING_EVIDENCE_VERIFIED_AT:-}
      JD_MEDIA_UPLOAD_EVIDENCE_VERSION: ${JD_MEDIA_UPLOAD_EVIDENCE_VERSION:-}
      JD_MEDIA_UPLOAD_EVIDENCE_REF: ${JD_MEDIA_UPLOAD_EVIDENCE_REF:-}
      JD_MEDIA_UPLOAD_EVIDENCE_VERIFIED_BY: ${JD_MEDIA_UPLOAD_EVIDENCE_VERIFIED_BY:-}
      JD_MEDIA_UPLOAD_EVIDENCE_VERIFIED_AT: ${JD_MEDIA_UPLOAD_EVIDENCE_VERIFIED_AT:-}
      TAOBAO_APP_KEY: ${TAOBAO_APP_KEY:-}
      TAOBAO_APP_SECRET: ${TAOBAO_APP_SECRET:-}
      TAOBAO_OAUTH_AUTHORIZE_URL: ${TAOBAO_OAUTH_AUTHORIZE_URL:-}
      TAOBAO_OAUTH_TOKEN_URL: ${TAOBAO_OAUTH_TOKEN_URL:-}
