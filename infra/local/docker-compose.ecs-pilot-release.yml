# Pilot-only release identity. This file is intentionally not used by
# production Kubernetes deployment. Values are generated from the exact pilot
# Compose render and image inventory by the deployment operator.
services:
  migrate:
    build: !reset null
    # The base migration entrypoint invokes psql against PostgreSQL 17. Keep
    # migration identity independent from the Node API image and pin the same
    # client major so dump/restore compatibility cannot drift at release time.
    image: ${MIGRATION_IMAGE_REF:?MIGRATION_IMAGE_REF must be an immutable postgres:17-alpine repository@sha256 reference}
  api:
    build: !reset null
    image: ${API_IMAGE_REF:?API_IMAGE_REF must be an immutable repository@sha256 reference}
    environment:
      RELEASE_ID: ${PILOT_RELEASE_ID:?PILOT_RELEASE_ID is required}
      RELEASE_GIT_SHA: ${PILOT_RELEASE_GIT_SHA:?PILOT_RELEASE_GIT_SHA is required}
      RELEASE_MANIFEST_SHA256: ${PILOT_RELEASE_MANIFEST_SHA256:?PILOT_RELEASE_MANIFEST_SHA256 is required}
      RELEASE_IMAGE_SET_DIGEST: ${PILOT_RELEASE_IMAGE_SET_DIGEST:?PILOT_RELEASE_IMAGE_SET_DIGEST is required}
  api-replica:
    build: !reset null
    image: ${API_IMAGE_REF:?API_IMAGE_REF must be an immutable repository@sha256 reference}
    environment:
      RELEASE_ID: ${PILOT_RELEASE_ID:?PILOT_RELEASE_ID is required}
      RELEASE_GIT_SHA: ${PILOT_RELEASE_GIT_SHA:?PILOT_RELEASE_GIT_SHA is required}
      RELEASE_MANIFEST_SHA256: ${PILOT_RELEASE_MANIFEST_SHA256:?PILOT_RELEASE_MANIFEST_SHA256 is required}
      RELEASE_IMAGE_SET_DIGEST: ${PILOT_RELEASE_IMAGE_SET_DIGEST:?PILOT_RELEASE_IMAGE_SET_DIGEST is required}
  ui:
    build: !reset null
    image: ${UI_IMAGE_REF:?UI_IMAGE_REF must be an immutable repository@sha256 reference}
  ops-ui:
    build: !reset null
    image: ${OPS_UI_IMAGE_REF:?OPS_UI_IMAGE_REF must be an immutable repository@sha256 reference}
  payment-gateway:
    build: !reset null
    image: ${PAYMENT_GATEWAY_IMAGE_REF:?PAYMENT_GATEWAY_IMAGE_REF must be an immutable repository@sha256 reference}
  worker-sync: &release-worker-image
    build: !reset null
    image: ${WORKER_IMAGE_REF:?WORKER_IMAGE_REF must be an immutable repository@sha256 reference}
  worker-generation:
    <<: *release-worker-image
    build: !reset null
  worker-publish:
    <<: *release-worker-image
    build: !reset null
  worker-reconcile:
    <<: *release-worker-image
    build: !reset null
  worker-automation:
    <<: *release-worker-image
    build: !reset null
  worker-scan:
    <<: *release-worker-image
    build: !reset null
  clamav:
    image: ${CLAMAV_IMAGE_REF:?CLAMAV_IMAGE_REF must be an immutable repository@sha256 reference}
