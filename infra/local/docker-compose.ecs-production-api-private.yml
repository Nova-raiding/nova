# Production API consumers use the project network (the gateway and payment
# gateway resolve the API by Compose service name). Keep the API private to
# that network so a host-local development service cannot block the release.
services:
  api:
    ports: !override []
    environment:
      AUTHZ_DURABLE_ASSIGNMENTS_REQUIRED: "true"
  api-replica:
    environment:
      AUTHZ_DURABLE_ASSIGNMENTS_REQUIRED: "true"
