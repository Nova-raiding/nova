# Documentation-only contract. This file is intentionally NOT referenced by
# any Kustomization and must never be applied. Create the Secret through the
# cloud Secret Manager / External Secrets integration instead.
apiVersion: merchant.example.com/v1
kind: RuntimeSecretContract
metadata:
  name: merchant-runtime-secrets
spec:
  namespace: merchant
  requiredKeys:
    - DATABASE_URL
    - OPS_DATABASE_URL
    - REDIS_URL
    - API_AUTH_TOKENS
    - MERCHANT_UI_API_TOKEN
    - OIDC_PROXY_SIGNING_SECRET
    - SESSION_ID_HASH_SECRET
    - WORKER_API_CREDENTIALS
    - WORKER_SYNC_API_TOKEN
    - WORKER_SYNC_API_SIGNING_SECRET
    - WORKER_GENERATION_API_TOKEN
    - WORKER_GENERATION_API_SIGNING_SECRET
    - WORKER_PUBLISH_API_TOKEN
    - WORKER_PUBLISH_API_SIGNING_SECRET
    - WORKER_RECONCILE_API_TOKEN
    - WORKER_RECONCILE_API_SIGNING_SECRET
    - WORKER_AUTOMATION_API_TOKEN
    - WORKER_AUTOMATION_API_SIGNING_SECRET
    - ASSET_STORAGE_KMS_KEY_ID
    - ASSET_DISPLAY_URL_SIGNING_SECRET
    - VAULT_TOKEN
    - RULE_APPROVAL_TOKENS
    - PLATFORM_RULE_SYNC_SIGNING_SECRET
    - MODEL_RELAY_API_KEY
    - PAYMENT_PROVIDER_API_KEY
    - PAYMENT_CALLBACK_SECRET
    - OPS_CUSTOMER_ACCESS_SIGNING_SECRET
  optionalKeys:
    - WEBHOOK_SIGNING_SECRET
    - ASSET_DISPLAY_URL_PREVIOUS_KEYS_JSON
  source:
    type: managed-secret-store
    workloadIdentityRequired: true
    receiptPrivateKeyDelivery: read-only-projected-file
  prohibitions:
    - neverCommitSecretValues
    - neverUseLocalOnlyToken
    - neverExposeSecretAsConfigMap
    - neverShareWorkerRoleCredentials
  rotation:
    maximumActiveCredentialsPerRole: 2
    order: [expandApiTrust, rollSingleRoleWorker, revokePreviousCredential]
---
# Scanner credentials are isolated from normal workers. The API receives only
# callback verification material; the scan worker is the sole private-key
# consumer. Provision this contract through the managed secret store.
apiVersion: merchant.example.com/v1
kind: RuntimeSecretContract
metadata:
  name: merchant-scanner-secrets
spec:
  namespace: merchant
  requiredKeys:
    - ASSET_SCANNER_API_TOKEN
    - ASSET_SCANNER_WORKSPACE_SIGNING_SECRET
    - ASSET_SCAN_RECEIPT_KEY_ID
    - ASSET_SCAN_RECEIPT_PRIVATE_KEY_PEM
    - ASSET_SCAN_TRUSTED_PUBLIC_KEYS
  source:
    type: managed-secret-store
    workloadIdentityRequired: true
  rotation:
    receiptSigningAlgorithm: Ed25519
    overlapRequired: true
  prohibitions:
    - neverShareWorkerApiToken
    - neverCommitSecretValues
    - neverExposeSecretAsConfigMap
    - neverMountReceiptPrivateKeyIntoApi
---
# Owner credentials are isolated to the pre-rollout migration Job. Runtime API
# and Worker pods reference only merchant-runtime-secrets and cannot read this
# Secret through their pod specification.
apiVersion: merchant.example.com/v1
kind: RuntimeSecretContract
metadata:
  name: merchant-migration-secrets
spec:
  namespace: merchant
  requiredKeys:
    - DATABASE_URL
  source:
    type: managed-secret-store
    workloadIdentityRequired: true
    databaseRole: schema-owner
  prohibitions:
    - neverReferenceFromRuntimePods
    - neverCommitSecretValues
    - neverExposeSecretAsConfigMap
