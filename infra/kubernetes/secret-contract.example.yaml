# Documentation-only contract. This file is intentionally NOT referenced by
# any Kustomization and must never be applied. Create the Secret through the
# cloud Secret Manager / External Secrets integration instead.
apiVersion: merchant.example.com/v1
kind: RuntimeSecretContract
metadata:
  name: merchant-runtime-secrets
spec:
  namespace: merchant
  requiredKeys:
    - DATABASE_URL
    - REDIS_URL
    - API_AUTH_TOKENS
    - MERCHANT_UI_API_TOKEN
    - OIDC_PROXY_SIGNING_SECRET
    - WORKER_API_TOKEN
    - WORKER_API_SIGNING_SECRET
    - ASSET_STORAGE_KMS_KEY_ID
    - VAULT_TOKEN
    - RULE_APPROVAL_TOKENS
    - PLATFORM_RULE_SYNC_SIGNING_SECRET
    - MODEL_RELAY_API_KEY
  optionalKeys:
    - MODEL_RELAY_API_KEY
    - WEBHOOK_SIGNING_SECRET
  source:
    type: managed-secret-store
    workloadIdentityRequired: true
  prohibitions:
    - neverCommitSecretValues
    - neverUseLocalOnlyToken
    - neverExposeSecretAsConfigMap
