apiVersion: apps/v1
kind: Deployment
metadata: {name: merchant-ops-ui, labels: {app.kubernetes.io/name: merchant-ops-ui, app.kubernetes.io/part-of: merchant-marketing-codex}}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: merchant-ops-ui}}
  template:
    metadata: {labels: {app.kubernetes.io/name: merchant-ops-ui, app.kubernetes.io/part-of: merchant-marketing-codex}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: ops-ui
          image: merchant-ops-ui:0.1.0
          ports: [{name: http, containerPort: 8080}]
          env: [{name: OPS_API_UPSTREAM, value: http://merchant-api:8787}, {name: OPS_API_RESOLVER, value: kube-dns.kube-system.svc.cluster.local}]
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2, timeoutSeconds: 2, failureThreshold: 15}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          volumeMounts: [{name: nginx-conf, mountPath: /etc/nginx/conf.d}, {name: nginx-cache, mountPath: /var/cache/nginx}, {name: nginx-run, mountPath: /var/run}, {name: nginx-tmp, mountPath: /tmp}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumes: [{name: nginx-conf, emptyDir: {sizeLimit: 1Mi}}, {name: nginx-cache, emptyDir: {sizeLimit: 16Mi}}, {name: nginx-run, emptyDir: {sizeLimit: 1Mi}}, {name: nginx-tmp, emptyDir: {sizeLimit: 64Mi}}]
---
apiVersion: v1
kind: Service
metadata: {name: merchant-ops-ui, labels: {app.kubernetes.io/name: merchant-ops-ui, app.kubernetes.io/part-of: merchant-marketing-codex}}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: merchant-ops-ui}
  ports: [{name: http, port: 80, targetPort: http}]
