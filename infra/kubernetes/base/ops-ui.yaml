apiVersion: apps/v1
kind: Deployment
metadata: {name: merchant-ops-ui, labels: {app.kubernetes.io/name: merchant-ops-ui, app.kubernetes.io/part-of: merchant-marketing-codex}}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: merchant-ops-ui}}
  template:
    metadata: {labels: {app.kubernetes.io/name: merchant-ops-ui, app.kubernetes.io/part-of: merchant-marketing-codex}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: ops-ui
          image: merchant-ops-ui:0.1.0
          ports: [{name: http, containerPort: 80}]
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
          volumeMounts: [{name: nginx-cache, mountPath: /var/cache/nginx}, {name: nginx-run, mountPath: /var/run}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumes: [{name: nginx-cache, emptyDir: {sizeLimit: 16Mi}}, {name: nginx-run, emptyDir: {sizeLimit: 1Mi}}]
---
apiVersion: v1
kind: Service
metadata: {name: merchant-ops-ui, labels: {app.kubernetes.io/name: merchant-ops-ui, app.kubernetes.io/part-of: merchant-marketing-codex}}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: merchant-ops-ui}
  ports: [{name: http, port: 80, targetPort: http}]
