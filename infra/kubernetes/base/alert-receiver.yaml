apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-alert-receiver
  labels: {app.kubernetes.io/name: merchant-alert-receiver, app.kubernetes.io/part-of: merchant-marketing-codex}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: merchant-alert-receiver}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: merchant-alert-receiver, app.kubernetes.io/part-of: merchant-marketing-codex}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: alert-receiver
          image: merchant-alert-receiver@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          ports: [{name: http, containerPort: 8791}]
          env:
            - {name: ALERT_RECEIVER_PORT, value: "8791"}
            - {name: ALERT_RECEIVER_BIND_HOST, value: 0.0.0.0}
            - {name: ALERT_RECEIVER_DB_POOL_MAX, value: "5"}
            - {name: ALERT_RECEIVER_DATABASE_URL_FILE, value: /run/secrets/alert-receiver/DATABASE_URL}
            - {name: ALERT_RECEIVER_HMAC_SECRET_FILE, value: /run/secrets/alert-receiver/HMAC_SECRET}
          volumeMounts:
            - {name: alert-receiver-secrets, mountPath: /run/secrets/alert-receiver, readOnly: true}
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: 500m, memory: 256Mi}}
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 3, failureThreshold: 20}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, timeoutSeconds: 3}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumes:
        - name: alert-receiver-secrets
          secret:
            secretName: merchant-alert-receiver-secrets
            optional: false
            # Decimal 288 is 0440: root and the pod fsGroup can read it.
            defaultMode: 288
            items:
              - {key: DATABASE_URL, path: DATABASE_URL}
              - {key: HMAC_SECRET, path: HMAC_SECRET}
---
apiVersion: v1
kind: Service
metadata: {name: merchant-alert-receiver}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: merchant-alert-receiver}
  ports: [{name: http, port: 8791, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: merchant-alert-receiver}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: merchant-alert-receiver}}
