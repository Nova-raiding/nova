apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: merchant-alert-receiver-boundary
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: merchant-alert-receiver}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
          podSelector: {matchLabels: {app.kubernetes.io/name: ingress-nginx}}
      ports: [{protocol: TCP, port: 8791}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - ipBlock: {cidr: 10.0.0.0/8}
        - ipBlock: {cidr: 172.16.0.0/12}
        - ipBlock: {cidr: 192.168.0.0/16}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: merchant-api-ingress-boundary
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: merchant-api}}
  policyTypes: [Ingress]
  ingress:
    # Public traffic can reach only the public Service through the ingress
    # controller. The Ingress itself rejects /v1/internal before proxying.
    #
    # This rule is L3/L4 only: every route the API serves (merchant REST, /mcp
    # and the worker callbacks under /v1/sync-jobs, /v1/generation-jobs,
    # /v1/publish-jobs, /v1/worker-events, /v1/assets/{id}/scan and
    # /v1/ops/data-deletion/complete) shares pod port 8787, so a NetworkPolicy
    # cannot separate them by path. The worker callbacks are therefore protected
    # by `requireWorkerAuthorization` (role-bound HMAC proof) rather than by this
    # policy, and the public path filter is the ingress-nginx
    # `configuration-snippet` in ingress.yaml, which only matches
    # ^/v1/internal. Do not read this rule as a worker-callback boundary.
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
          podSelector:
            matchLabels: {app.kubernetes.io/name: ingress-nginx}
      ports: [{protocol: TCP, port: 8787}]
    # First-party UI proxies and callback workers retain access to the normal
    # API Service. Internal scanner endpoints remain HMAC-authenticated.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - merchant-ui
                  - merchant-ops-ui
                  - merchant-worker-sync
                  - merchant-worker-generation
                  - merchant-worker-publish
                  - merchant-worker-reconcile
                  - merchant-worker-automation
                  - merchant-worker-scan
      ports: [{protocol: TCP, port: 8787}]
    # Metrics collection. A Prometheus outside the namespace that is not
    # explicitly allowed here is dropped by this policy, so minting
    # METRICS_AUTH_TOKEN alone would still produce an empty scrape. Adjust the
    # namespace label to wherever the scraper actually runs, and delete this
    # rule if metrics are instead relayed through an in-namespace collector.
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 8787}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: merchant-worker-scan-isolation
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: merchant-worker-scan}}
  policyTypes: [Ingress, Egress]
  # clamd has no Service and listens only inside the scan Pod. NetworkPolicy
  # does not block the worker-to-sidecar loopback path, while this empty rule
  # prevents every other Pod from reaching clamd on the scan Pod IP.
  ingress: []
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: merchant-api}}
      ports: [{protocol: TCP, port: 8787}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Database and Redis are private provider endpoints in production. Narrow
    # these CIDRs in each deployment overlay to the allocated service ranges.
    - to:
        - ipBlock: {cidr: 10.0.0.0/8}
        - ipBlock: {cidr: 172.16.0.0/12}
        - ipBlock: {cidr: 192.168.0.0/16}
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
    # Quarantine objects are fetched from the configured HTTPS object store.
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports: [{protocol: TCP, port: 443}]
