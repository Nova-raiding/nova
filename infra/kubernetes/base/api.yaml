apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-api
  labels: {app.kubernetes.io/name: merchant-api, app.kubernetes.io/part-of: merchant-marketing-codex}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector: {matchLabels: {app.kubernetes.io/name: merchant-api}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: merchant-api, app.kubernetes.io/part-of: merchant-marketing-codex}
      annotations:
        merchant.example.com/config-sha256: sha256:dbd96f579ae01b73f771135dfa5eea5b1fdf0d65afeee4b93dbd2430cc8be5bd
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: merchant-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8787}]
          envFrom:
            - configMapRef: {name: merchant-runtime}
          env:
            - {name: OTEL_SERVICE_NAME, value: merchant-api}
            # ChatGPT MCP OAuth is mandatory on the public merchant host. The
            # client/callback allowlist remains a managed Secret so a missing
            # production registration keeps /readyz fail-closed.
            - {name: MCP_OAUTH_REQUIRED, value: "true"}
            - {name: MCP_OAUTH_ISSUER, value: https://yxsona.com}
            - {name: MCP_OAUTH_AUTHORIZATION_ENDPOINT, value: https://yxsona.com/oauth/authorize}
            - {name: MCP_OAUTH_TOKEN_ENDPOINT, value: https://yxsona.com/oauth/token}
            - {name: MCP_OAUTH_CLIENTS, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: MCP_OAUTH_CLIENTS}}}
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: DATABASE_URL}}}
            - {name: OPS_DATABASE_URL, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: OPS_DATABASE_URL}}}
            - {name: REDIS_URL, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: REDIS_URL}}}
            - {name: API_AUTH_TOKENS, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: API_AUTH_TOKENS}}}
            - {name: OIDC_PROXY_SIGNING_SECRET, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: OIDC_PROXY_SIGNING_SECRET}}}
            - {name: SESSION_ID_HASH_SECRET, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: SESSION_ID_HASH_SECRET}}}
            - {name: WORKER_API_CREDENTIALS, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: WORKER_API_CREDENTIALS}}}
            - {name: ASSET_SCANNER_API_TOKEN, valueFrom: {secretKeyRef: {name: merchant-scanner-secrets, key: ASSET_SCANNER_API_TOKEN}}}
            - {name: ASSET_SCANNER_WORKSPACE_SIGNING_SECRET, valueFrom: {secretKeyRef: {name: merchant-scanner-secrets, key: ASSET_SCANNER_WORKSPACE_SIGNING_SECRET}}}
            - {name: ASSET_SCAN_TRUSTED_PUBLIC_KEYS, valueFrom: {secretKeyRef: {name: merchant-scanner-secrets, key: ASSET_SCAN_TRUSTED_PUBLIC_KEYS}}}
            - {name: ASSET_DISPLAY_URL_SIGNING_SECRET, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: ASSET_DISPLAY_URL_SIGNING_SECRET}}}
            - {name: ASSET_DISPLAY_URL_PREVIOUS_KEYS_JSON, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: ASSET_DISPLAY_URL_PREVIOUS_KEYS_JSON}}}
            - {name: VAULT_TOKEN, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: VAULT_TOKEN}}}
            - {name: RULE_APPROVAL_TOKENS, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: RULE_APPROVAL_TOKENS}}}
            - {name: PLATFORM_RULE_SYNC_SIGNING_SECRET, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: PLATFORM_RULE_SYNC_SIGNING_SECRET}}}
            - {name: MODEL_RELAY_API_KEY, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: MODEL_RELAY_API_KEY}}}
            - {name: PAYMENT_PROVIDER_API_KEY, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: PAYMENT_PROVIDER_API_KEY}}}
            - {name: PAYMENT_CALLBACK_SECRET, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: PAYMENT_CALLBACK_SECRET}}}
            - {name: OPS_CUSTOMER_ACCESS_SIGNING_SECRET, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: OPS_CUSTOMER_ACCESS_SIGNING_SECRET}}}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /livez, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-api
  labels: {app.kubernetes.io/name: merchant-api, app.kubernetes.io/part-of: merchant-marketing-codex}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8787"
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: merchant-api}
  ports: [{name: http, port: 8787, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-api-scanner-internal
  labels:
    app.kubernetes.io/name: merchant-api-scanner-internal
    app.kubernetes.io/part-of: merchant-marketing-codex
    merchant.example.com/exposure: internal-only
spec:
  type: ClusterIP
  # Scanner bootstrapping probes /healthz through this private Service before
  # API /readyz can observe scanner quorum. Publish only these internal API
  # endpoints before readiness to avoid a circular cold-start dependency.
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: merchant-api}
  ports: [{name: scanner-http, port: 8787, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: merchant-api}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: merchant-api}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: merchant-api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: merchant-api}
  minReplicas: 2
  maxReplicas: 12
  behavior:
    scaleUp: {stabilizationWindowSeconds: 30}
    scaleDown: {stabilizationWindowSeconds: 300}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
    - type: Resource
      resource: {name: memory, target: {type: Utilization, averageUtilization: 75}}
