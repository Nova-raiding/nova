# Worker fleet.
#
# Metrics exposure (added for the observability gap):
#   Every worker process now serves Prometheus text format on containerPort
#   `metrics` (9102) at GET /metrics. `WORKER_METRICS_HOST=0.0.0.0` is set
#   explicitly here because the in-code default is 127.0.0.1, which is
#   unreachable from a scraper running in another Pod.
#
#   The endpoint is read-only, exposes no tenant data, and is fail-closed in
#   production: without METRICS_AUTH_TOKEN it answers 503, and a non-matching
#   bearer answers 401. Provisioning the token is what makes these series
#   readable; see infra/observability/prometheus-scrape.example.yaml.
#
#   REQUIRED COMPANION (not yet applied): these Pods currently have no ingress
#   NetworkPolicy except merchant-worker-scan, whose policy is `ingress: []`.
#   Until a rule allowing the scraper's namespace on 9102 is added to
#   infra/kubernetes/base/network-policies.yaml, the annotated targets are
#   either unreachable (scan) or reachable by every Pod in the namespace
#   (the other five). The annotations below declare intent; they do not
#   themselves grant access.
apiVersion: apps/v1
kind: Deployment
metadata: {name: merchant-worker-sync, labels: {app.kubernetes.io/name: merchant-worker-sync, app.kubernetes.io/part-of: merchant-marketing-codex}}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: merchant-worker-sync}}
  template:
    metadata: {labels: {app.kubernetes.io/name: merchant-worker-sync, app.kubernetes.io/part-of: merchant-marketing-codex}, annotations: {merchant.example.com/config-sha256: "sha256:e9cd848a7148f8673360f7833c785d17dd2ad0b51042e8d706658d0a373a7592", prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "9102"}}
    spec:
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers: [{name: worker, image: "merchant-worker@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb", envFrom: [{configMapRef: {name: merchant-runtime}}], env: [{name: WORKER_ROLE, value: sync}, {name: WORKER_READY_FILE, value: /tmp/merchant-worker-sync-ready}, {name: OTEL_SERVICE_NAME, value: merchant-worker-sync}, {name: WORKER_METRICS_HOST, value: "0.0.0.0"}, {name: WORKER_METRICS_PORT, value: "9102"}, {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: DATABASE_URL}}}, {name: REDIS_URL, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: REDIS_URL}}}, {name: WORKER_API_TOKEN, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: WORKER_SYNC_API_TOKEN}}}, {name: WORKER_API_SIGNING_SECRET, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: WORKER_SYNC_API_SIGNING_SECRET}}}, {name: VAULT_TOKEN, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: VAULT_TOKEN}}}], ports: [{name: metrics, containerPort: 9102, protocol: TCP}], volumeMounts: [{name: tmp, mountPath: /tmp}], readinessProbe: {exec: {command: ["/bin/sh", "-c", "test -s /tmp/merchant-worker-sync-ready && find /tmp/merchant-worker-sync-ready -mmin -2 -print -quit | grep -q ."]}, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 6}, livenessProbe: {exec: {command: ["/bin/sh", "-c", "find /tmp/merchant-worker-sync-ready -mmin -2 -print -quit | grep -q ."]}, initialDelaySeconds: 15, periodSeconds: 10, timeoutSeconds: 3}, resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 4Gi}}, securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
