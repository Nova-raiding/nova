  template:
    metadata: {labels: {app.kubernetes.io/name: merchant-worker-sync, app.kubernetes.io/part-of: merchant-marketing-codex}}
    spec:
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers: [{name: worker, image: "merchant-worker:0.1.0", envFrom: [{configMapRef: {name: merchant-runtime}}, {secretRef: {name: merchant-runtime-secrets}}], env: [{name: WORKER_ROLE, value: sync}, {name: WORKER_READY_FILE, value: /tmp/merchant-worker-sync-ready}, {name: OTEL_SERVICE_NAME, value: merchant-worker-sync}], volumeMounts: [{name: tmp, mountPath: /tmp}], readinessProbe: {exec: {command: ["/bin/sh", "-c", "test -s /tmp/merchant-worker-sync-ready && node -e \"process.kill(1, 0)\" >/dev/null 2>&1"]}, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 6}, livenessProbe: {exec: {command: ["/bin/sh", "-c", "node -e \"process.kill(1, 0)\" >/dev/null 2>&1"]}, initialDelaySeconds: 15, periodSeconds: 10, timeoutSeconds: 3}, resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 4Gi}}, securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
