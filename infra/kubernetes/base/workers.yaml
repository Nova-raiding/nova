apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: merchant-worker-automation}
spec:
  # `maxUnavailable`, not `minAvailable: 1`. Every production overlay scales
  # automation to a single replica, and the automation worker deliberately
  # excludes itself from lease-based claiming (see the `config.role !==
  # 'automation'` dispatch guard), so it is a singleton on purpose. A
  # `minAvailable: 1` budget over one replica forbids every voluntary eviction
  # and blocks node drains indefinitely. One unavailable pod still protects the
  # two-replica base rendering, which is what this budget was written for.
  maxUnavailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: merchant-worker-automation}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: merchant-worker-scan, labels: {app.kubernetes.io/name: merchant-worker-scan, app.kubernetes.io/part-of: merchant-marketing-codex}}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector: {matchLabels: {app.kubernetes.io/name: merchant-worker-scan}}
  template:
    metadata: {labels: {app.kubernetes.io/name: merchant-worker-scan, app.kubernetes.io/part-of: merchant-marketing-codex}, annotations: {merchant.example.com/config-sha256: "sha256:e9cd848a7148f8673360f7833c785d17dd2ad0b51042e8d706658d0a373a7592", prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "9102"}}
    spec:
      terminationGracePeriodSeconds: 90
      nodeSelector: {kubernetes.io/arch: amd64}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app.kubernetes.io/name: merchant-worker-scan}
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: "merchant-worker@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ASSET_SCAN_RECEIPT_PRIVATE_KEY_PEM="$(cat /var/run/secrets/merchant-scanner/receipt-private-key.pem)"
              export ASSET_SCAN_RECEIPT_PRIVATE_KEY_PEM
              exec node dist/apps/worker/src/main.js
          envFrom: [{configMapRef: {name: merchant-runtime}}]
          env:
            - {name: WORKER_ROLE, value: scan}
            - {name: WORKER_API_BASE_URL, valueFrom: {configMapKeyRef: {name: merchant-runtime, key: ASSET_SCANNER_INTERNAL_API_BASE_URL}}}
            - {name: ASSET_SCANNER_SERVICE_ID, valueFrom: {configMapKeyRef: {name: merchant-runtime, key: ASSET_SCANNER_SERVICE_ID}}}
            - {name: WORKER_READY_FILE, value: /tmp/merchant-worker-scan-ready}
            - {name: OTEL_SERVICE_NAME, value: merchant-worker-scan}
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: DATABASE_URL}}}
            - {name: REDIS_URL, valueFrom: {secretKeyRef: {name: merchant-runtime-secrets, key: REDIS_URL}}}
            - {name: WORKER_API_TOKEN, valueFrom: {secretKeyRef: {name: merchant-scanner-secrets, key: ASSET_SCANNER_API_TOKEN}}}
            - {name: WORKER_API_SIGNING_SECRET, valueFrom: {secretKeyRef: {name: merchant-scanner-secrets, key: ASSET_SCANNER_WORKSPACE_SIGNING_SECRET}}}
            - {name: ASSET_SCANNER_API_TOKEN, valueFrom: {secretKeyRef: {name: merchant-scanner-secrets, key: ASSET_SCANNER_API_TOKEN}}}
            - {name: ASSET_SCANNER_WORKSPACE_SIGNING_SECRET, valueFrom: {secretKeyRef: {name: merchant-scanner-secrets, key: ASSET_SCANNER_WORKSPACE_SIGNING_SECRET}}}
            - {name: ASSET_SCAN_RECEIPT_KEY_ID, valueFrom: {secretKeyRef: {name: merchant-scanner-secrets, key: ASSET_SCAN_RECEIPT_KEY_ID}}}
            - {name: SCANNER_HEARTBEAT_INTERVAL_MS, value: "5000"}
            - {name: SCANNER_HEARTBEAT_TTL_SECONDS, value: "15"}
            - {name: SCANNER_DEFINITIONS_MAX_AGE_SECONDS, value: "86400"}
            - {name: SCANNER_EICAR_MAX_AGE_SECONDS, value: "900"}
            - {name: SCANNER_CALLBACK_MAX_AGE_SECONDS, value: "86400"}
            - {name: SCANNER_MINIMUM_READY_INSTANCES, value: "2"}
            # Pod IP binding is deliberate: a scraper cannot reach another
            # Pod's loopback. See the header note for the NetworkPolicy that
            # must exist before this listener is reachable by a scraper.
            - {name: WORKER_METRICS_HOST, value: "0.0.0.0"}
            - {name: WORKER_METRICS_PORT, value: "9102"}
          ports: [{name: metrics, containerPort: 9102, protocol: TCP}]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: scanner-signing-key, mountPath: /var/run/secrets/merchant-scanner, readOnly: true}
          readinessProbe: {exec: {command: ["/bin/sh", "-c", "test -s /tmp/merchant-worker-scan-ready && node -e \"const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/merchant-worker-scan-ready','utf8'));if(h.state!=='ready'||!h.heartbeat||Date.parse(h.heartbeat.expiresAt)<=Date.now())process.exit(1)\" && node -e \"process.kill(1, 0)\" >/dev/null 2>&1"]}, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3}
          livenessProbe: {exec: {command: ["/bin/sh", "-c", "node -e \"process.kill(1, 0)\" >/dev/null 2>&1"]}, initialDelaySeconds: 15, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
          securityContext: {runAsUser: 10001, runAsGroup: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        # The pinned upstream image declares no `USER` and its `/init` needs root
        # (it runs `install -d`, `chown -R` and `sed -i` over /etc/clamav), so
        # leaving this container on the image default made kubelet refuse the
        # Pod with "container has runAsNonRoot and image will run as root".
        #
        # Fix: run the image's own non-root entrypoint as uid 10001 and feed it
        # the effective daemon config as a read-only ConfigMap mount, instead of
        # letting the entrypoint rewrite /etc/clamav/clamd.conf in place.
        # `/init-unprivileged` is shipped by the pinned digest; it skips the
        # root-only steps and reads /etc/clamav/clamd.conf, which is exactly the
        # mounted ConfigMap. See infra/kubernetes/base/clamav-config.yaml for why
        # the daemon limits must not be left to the image defaults.
        - name: clamav
          image: "clamav/clamav@sha256:761f6c99b8d9134b39431f8c200189cda749b17310091561bfa8b732f32bfada"
          command: ["/init-unprivileged"]
          env: [{name: FRESHCLAM_CHECKS, value: "24"}]
          ports: [{name: clamd, containerPort: 3310, protocol: TCP}]
          # These probes deliberately read /etc/clamav/clamd.conf -- the file
          # clamd was handed -- rather than echoing the CLAMD_CONF_* environment
          # variables, which is what the previous version checked. That check was
          # a tautology: it asserted the value of the variable it had just set,
          # never the value the daemon was actually running with.
          startupProbe: {exec: {command: ["/bin/sh", "-c", "grep -qx 'StreamMaxLength 100M' /etc/clamav/clamd.conf && grep -qx 'MaxFileSize 100M' /etc/clamav/clamd.conf && grep -qx 'MaxScanSize 100M' /etc/clamav/clamd.conf && grep -qx 'AlertExceedsMax yes' /etc/clamav/clamd.conf && clamdscan --ping 1 >/dev/null 2>&1"]}, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 30}
          readinessProbe: {exec: {command: ["/bin/sh", "-c", "grep -qx 'StreamMaxLength 100M' /etc/clamav/clamd.conf && grep -qx 'MaxFileSize 100M' /etc/clamav/clamd.conf && grep -qx 'MaxScanSize 100M' /etc/clamav/clamd.conf && grep -qx 'AlertExceedsMax yes' /etc/clamav/clamd.conf && clamdscan --ping 1 >/dev/null 2>&1 && find /var/lib/clamav -maxdepth 1 -type f \\( -name daily.cvd -o -name daily.cld \\) -mmin -1440 | grep -q ."]}, periodSeconds: 15, timeoutSeconds: 10, failureThreshold: 2}
          livenessProbe: {exec: {command: ["/bin/sh", "-c", "grep -qx 'StreamMaxLength 100M' /etc/clamav/clamd.conf && grep -qx 'MaxFileSize 100M' /etc/clamav/clamd.conf && grep -qx 'MaxScanSize 100M' /etc/clamav/clamd.conf && grep -qx 'AlertExceedsMax yes' /etc/clamav/clamd.conf && clamdscan --ping 1 >/dev/null 2>&1"]}, initialDelaySeconds: 30, periodSeconds: 30, timeoutSeconds: 10, failureThreshold: 3}
          resources: {requests: {cpu: 500m, memory: 3Gi}, limits: {cpu: "2", memory: 4Gi}}
          # /var/log/clamav must be writable: the image's freshclam.conf pins
          # UpdateLogFile there and freshclam aborts when it cannot open it.
          volumeMounts: [{name: clamav-config, mountPath: /etc/clamav/clamd.conf, subPath: clamd.conf, readOnly: true}, {name: clamav-database, mountPath: /var/lib/clamav}, {name: clamav-logs, mountPath: /var/log/clamav}, {name: clamav-tmp, mountPath: /tmp}]
          securityContext: {runAsUser: 10001, runAsGroup: 10001, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: clamav-tmp, emptyDir: {sizeLimit: 256Mi}}
        - {name: clamav-logs, emptyDir: {sizeLimit: 64Mi}}
        - {name: clamav-database, emptyDir: {sizeLimit: 2Gi}}
        # defaultMode 0444: a subPath mount is not chowned by kubelet's fsGroup
        # handling, so the file has to be readable without it. It carries no
        # secret material.
        - {name: clamav-config, configMap: {name: merchant-clamav-config, defaultMode: 292}}
        - name: scanner-signing-key
          projected:
            defaultMode: 288 # 0440; readable only by root and fsGroup 10001.
            sources:
              - secret:
                  name: merchant-scanner-secrets
                  items:
                    - {key: ASSET_SCAN_RECEIPT_PRIVATE_KEY_PEM, path: receipt-private-key.pem, mode: 288}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: merchant-worker-scan}
spec:
  # `minAvailable: 2` over `replicas: 2` was unsatisfiable by construction: the
  # budget equalled the replica count, so evicting either scan pod violated it.
  # The scan pod additionally carries a REQUIRED podAntiAffinity on
  # kubernetes.io/hostname, so the two replicas always land on different nodes
  # and BOTH nodes became permanently undrainable. One available scanner still
  # keeps the 100 MiB ClamAV boundary serving while a node drains; the drain
  # window is the only time the scanner runs below its two-instance quorum.
  # Raising replicas to 3 instead would make the required anti-affinity demand
  # a third schedulable node, which the pilot overlay does not guarantee.
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: merchant-worker-scan}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: merchant-worker-generation}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: merchant-worker-generation}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: merchant-worker-publish}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: merchant-worker-publish}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: merchant-worker-reconcile}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: merchant-worker-reconcile}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: merchant-worker-publish}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: merchant-worker-publish}
  minReplicas: 2
  maxReplicas: 8
  behavior: {scaleUp: {stabilizationWindowSeconds: 30}, scaleDown: {stabilizationWindowSeconds: 300}}
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}}, {type: Resource, resource: {name: memory, target: {type: Utilization, averageUtilization: 75}}}]
---
apiVersion: autoscaling/v2
