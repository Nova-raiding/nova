apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: merchant
  annotations:
    # REST, OAuth, payment callback, and alert routes keep a small request
    # boundary. Upload-capable MCP uses the separate Exact ingress below.
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # /v1 is public for merchant APIs, but scanner callbacks are service-to-
    # service only. `return` inside an NGINX location is deterministic and
    # prevents the broader /v1 Prefix rule from forwarding internal paths.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* "^/v1/internal(?:/|$)") { return 404; }
spec:
  ingressClassName: nginx
  tls:
    - hosts: [yxsona.com, ops.yxsona.com, alerts.yxsona.com]
      secretName: merchant-tls
  rules:
    - host: alerts.yxsona.com
      http:
        paths:
          - path: /internal/v1/alerts
            pathType: Exact
            backend: {service: {name: merchant-alert-receiver, port: {name: http}}}
    - host: yxsona.com
      http:
        paths:
          - path: /v1/internal
            pathType: Prefix
            backend: {service: {name: merchant-internal-deny, port: {name: http}}}
          - path: /v1
            pathType: Prefix
            backend: {service: {name: merchant-api, port: {name: http}}}
          - path: /oauth
            pathType: Prefix
            backend: {service: {name: merchant-api, port: {name: http}}}
          - path: /healthz
            pathType: Exact
            backend: {service: {name: merchant-api, port: {name: http}}}
          # Release identity and liveness are API attestations. Keep them out
          # of the SPA fallback (infra/nginx/merchant-studio.conf has no
          # /releasez or /livez location) so deployment and canary checks
          # receive JSON release metadata instead of a 200 index.html.
          - path: /releasez
            pathType: Exact
            backend: {service: {name: merchant-api, port: {name: http}}}
          - path: /livez
            pathType: Exact
            backend: {service: {name: merchant-api, port: {name: http}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: merchant-ui, port: {name: http}}}
    - host: ops.yxsona.com
      http:
        paths:
          - path: /v1/internal
            pathType: Prefix
            backend: {service: {name: merchant-internal-deny, port: {name: http}}}
          - path: /v1
            pathType: Prefix
            backend: {service: {name: merchant-api, port: {name: http}}}
          - path: /oauth
            pathType: Prefix
            backend: {service: {name: merchant-api, port: {name: http}}}
          - path: /healthz
            pathType: Exact
            backend: {service: {name: merchant-api, port: {name: http}}}
          # The ops console proxies /readyz to the API but has no /releasez or
          # /livez location, so both must be published here as well.
          - path: /releasez
            pathType: Exact
            backend: {service: {name: merchant-api, port: {name: http}}}
          - path: /livez
            pathType: Exact
            backend: {service: {name: merchant-api, port: {name: http}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: merchant-ops-ui, port: {name: http}}}
---
# A product-limited 50 MiB customer-delivery file is transported as ~67 MiB
# JSON base64. Isolate that larger request budget to the authenticated browser
# RPC paths instead of weakening /v1 payment callbacks and their /api aliases.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: merchant-browser-api-upload
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 70m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [yxsona.com, ops.yxsona.com]
      secretName: merchant-tls
  rules:
    - host: yxsona.com
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend: {service: {name: merchant-api, port: {name: http}}}
          - path: /api/mcp
            pathType: Exact
            backend: {service: {name: merchant-ui, port: {name: http}}}
          - path: /v1/assets/upload
            pathType: Exact
            backend: {service: {name: merchant-api, port: {name: http}}}
          - path: /api/v1/assets/upload
            pathType: Exact
            backend: {service: {name: merchant-ui, port: {name: http}}}
    - host: ops.yxsona.com
      http:
        paths:
          - path: /api/mcp
            pathType: Exact
            backend: {service: {name: merchant-ops-ui, port: {name: http}}}
          - path: /v1/assets/upload
            pathType: Exact
            backend: {service: {name: merchant-api, port: {name: http}}}
          - path: /api/v1/assets/upload
            pathType: Exact
            backend: {service: {name: merchant-ops-ui, port: {name: http}}}
---
# Deliberately has no matching endpoints. Kubernetes longest-prefix routing
# sends every public /v1/internal request here instead of merchant-api, even
# when ingress-nginx disables snippet annotations at the controller level.
apiVersion: v1
kind: Service
metadata:
  name: merchant-internal-deny
  labels:
    app.kubernetes.io/name: merchant-internal-deny
    merchant.example.com/exposure: public-deny-sink
spec:
  type: ClusterIP
  selector: {merchant.example.com/deny-endpoint: "never"}
  ports: [{name: http, port: 80, targetPort: 8080}]
